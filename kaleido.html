<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Kaleidoscope Drawing</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden; position: fixed; background: #222; font-family: sans-serif;
    }
    #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #controls {
      flex: 0 0 auto; background: #e0e0e0; padding: 6px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
      border-bottom: 2px solid #333; touch-action: manipulation;
    }
    .ctrl-group {
      display: flex; align-items: center; background: #fff;
      border: 1px solid #999; border-radius: 6px; padding: 2px 6px; height: 36px;
    }
    .ctrl-group span { font-size: 16px; margin-right: 4px; }
    #controls input[type="number"], #controls select {
      font-size: 16px; border: none; outline: none; background: transparent;
      padding: 0; margin: 0; color: #333; font-weight: bold;
    }
    #controls input[type="number"] { width: 45px; text-align: center; }
    #controls select { width: 90px; cursor: pointer; -webkit-appearance: none; appearance: none; }
    #controls input[type="color"] { width: 28px; height: 28px; padding: 0; border: none; background: none; cursor: pointer; }
    #controls input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }
    .btn-group { display: flex; gap: 4px; width: 100%; justify-content: space-between; }
    .btn-group button {
      flex: 1; font-size: 14px; font-weight: bold; padding: 6px 0;
      border: 1px solid #555; border-radius: 6px; background: #fff;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 4px;
    }
    .btn-group button:active { background: #ccc; }
    #canvas-wrapper {
      flex: 1 1 auto; position: relative; overflow: hidden;
      background-color: #333;
    }

    canvas {
      display: block; touch-action: none; background-color: #ffffff;
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }
  </style>
</head>
<body>

<div id="app-container">
  <div id="controls">
    <div class="ctrl-group" title="Warna"><span>🎨</span><input type="color" id="colorPicker" value="#000000"></div>
    <div class="ctrl-group" title="Ketebalan"><span>🖌️</span><input type="number" id="lineWidth" min="1" max="50" value="2"></div>
    <div class="ctrl-group" title="Tipe Kuas"><span>✏️</span><select id="brushType"><option value="normal">Normal</option><option value="glow">Glow</option></select></div>
    <div class="ctrl-group" title="Alat Gambar"><span>📐</span><select id="toolType"><option value="free">Bebas</option><option value="line">Garis</option><option value="circle">Lingkaran</option><option value="triangle">Segitiga</option><option value="rectangle">Persegi P.</option><option value="square">Persegi</option><option value="ellipse">Elips</option><option value="star">Bintang</option><option value="heart">Hati</option><option value="trapezoid">Trapesium</option></select></div>
    <div class="ctrl-group" title="Isi Warna"><span>🍩</span><input type="checkbox" id="fillShape"></div>
    <div class="ctrl-group" title="Jumlah Pantulan"><span>🔁</span><input type="number" id="segmentsInput" min="1" value="12"></div>
    <div class="ctrl-group" title="Gaya Pantulan"><span>💠</span><select id="reflectionStyle"><option value="both">Rotasi+Cermin</option><option value="rotate">Rotasi</option><option value="mirror">Cermin</option><option value="none">Tanpa</option></select></div>

    <div class="ctrl-group" title="Mode Input">
      <span>🖱️</span>
      <select id="inputMode">
        <option value="touch">Sentuh</option>
        <option value="mouse">Mouse</option>
      </select>
    </div>

    <div class="ctrl-group" title="Tampilkan Garis Panduan"><span>👁️</span><input type="checkbox" id="showGuides" checked></div>
    <div class="btn-group">
      <button id="eraser">🧹</button><button id="undo">↩️</button><button id="redo">↪️</button>
      <button id="reset">🗑️</button><button id="resetZoom">🔄</button><button id="save">💾</button>
    </div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="980" height="980"></canvas>
  </div>
</div>

<script>
const CANVAS_W = 980;
const CANVAS_H = 980;

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

const wrapper = document.getElementById("canvas-wrapper");

let transform = { scale: 1, tx: 0, ty: 0 };
let baseLeft = 0, baseTop = 0, baseSize = 0;
let k = 1; 

let paths = [], redoStack = [], undoStack = [];
let drawing = false, erasing = false;
let currentPath = null, startPos = null;
let lastTouchPos = null;

let isPinching = false;
let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartMid = { x: 0, y: 0 };
let pinchStartTx = 0, pinchStartTy = 0;

const $ = id => document.getElementById(id);

function getSegments() {
  const s = parseInt($("segmentsInput").value);
  return isNaN(s) ? 12 : Math.max(1, s);
}

function layoutCanvas() {
  const wRect = wrapper.getBoundingClientRect();
  const w = wrapper.clientWidth;
  const h = wrapper.clientHeight;
  baseSize = Math.min(w, h);
  baseLeft = wRect.left + (w - baseSize) / 2;
  baseTop  = wRect.top  + (h - baseSize) / 2;
  k = baseSize / CANVAS_W;

  canvas.style.width  = baseSize + "px";
  canvas.style.height = baseSize + "px";
  canvas.style.left = (baseSize ? (w - baseSize) / 2 : 0) + "px";
  canvas.style.top  = (baseSize ? (h - baseSize) / 2 : 0) + "px";
}

function applyTransform() {
  canvas.style.transform =
    `translate(${transform.tx}px, ${transform.ty}px) scale(${transform.scale})`;
}

function screenToCanvas(clientX, clientY) {
  return {
    x: (clientX - baseLeft - transform.tx) / (transform.scale * k),
    y: (clientY - baseTop  - transform.ty) / (transform.scale * k)
  };
}

/* ================= RENDER ================= */

function drawGuides() {
  if (!$("showGuides").checked) return;
  const segments = getSegments();
  ctx.save();
  ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
  ctx.strokeStyle = "rgba(150,150,150,0.3)";
  ctx.lineWidth = 1;
  for (let i = 0; i < segments; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -CANVAS_H);
    ctx.stroke();
    ctx.rotate((2 * Math.PI) / segments);
  }
  ctx.restore();
}

function drawShape(p1, p2, path) {
  const { segments, color, width, brush, fill, tool } = path;
  const reflectionStyle = path.reflection || "both";
  const doRotate = reflectionStyle !== "mirror" && reflectionStyle !== "none";
  const doMirror = reflectionStyle !== "rotate" && reflectionStyle !== "none";
  const loopCount = doRotate ? segments : 1;

  for (let i = 0; i < loopCount; i++) {
    const angle = (i * 2 * Math.PI) / segments;
    ctx.save();
    ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
    if (doRotate) ctx.rotate(angle);

    const x1 = p1.x - CANVAS_W / 2, y1 = p1.y - CANVAS_H / 2;
    const x2 = p2.x - CANVAS_W / 2, y2 = p2.y - CANVAS_H / 2;

    const drawBaseShape = (mirror = false) => {
      ctx.beginPath();
      let sx1 = x1, sx2 = x2, sy1 = mirror ? -y1 : y1, sy2 = mirror ? -y2 : y2;
      let cx = (sx1 + sx2) / 2; let cy = (sy1 + sy2) / 2;
      let r = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2) / 2;

      if (tool === "line") { ctx.moveTo(sx1, sy1); ctx.lineTo(sx2, sy2); }
      else if (tool === "circle") { ctx.arc(cx, cy, r, 0, 2 * Math.PI); }
      else if (tool === "triangle") { ctx.moveTo(sx1, sy2); ctx.lineTo((sx1 + sx2) / 2, sy1); ctx.lineTo(sx2, sy2); ctx.closePath(); }
      else if (tool === "rectangle") { ctx.rect(Math.min(sx1, sx2), Math.min(sy1, sy2), Math.abs(sx2 - sx1), Math.abs(sy2 - sy1)); }
      else if (tool === "square") { const size = Math.min(Math.abs(sx2 - sx1), Math.abs(sy2 - sy1)); ctx.rect(sx1, sy1, size * Math.sign(sx2 - sx1), size * Math.sign(sy2 - sy1)); }
      else if (tool === "ellipse") { ctx.ellipse(cx, cy, Math.abs(sx2 - sx1) / 2, Math.abs(sy2 - sy1) / 2, 0, 0, 2 * Math.PI); }
      else if (tool === "star") {
        const spikes = 5; const outerRadius = r; const innerRadius = r / 2;
        for (let kk = 0; kk < spikes * 2; kk++) {
          const a = (kk * Math.PI) / spikes; const radius = kk % 2 === 0 ? outerRadius : innerRadius;
          const sx = cx + Math.cos(a) * radius; const sy = cy + Math.sin(a) * radius;
          if (kk === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
      } else if (tool === "heart") {
        ctx.moveTo(cx, cy + r / 4);
        ctx.bezierCurveTo(cx + r, cy - r / 2, cx + r * 1.5, cy + r / 2, cx, cy + r);
        ctx.bezierCurveTo(cx - r * 1.5, cy + r / 2, cx - r, cy - r / 2, cx, cy + r / 4);
        ctx.closePath();
      } else if (tool === "trapezoid") {
        const topWidth = Math.abs(sx2 - sx1) * 0.5; const bottomWidth = Math.abs(sx2 - sx1);
        const height = Math.abs(sy2 - sy1);
        ctx.moveTo(cx - topWidth / 2, cy - height / 2); ctx.lineTo(cx + topWidth / 2, cy - height / 2);
        ctx.lineTo(cx + bottomWidth / 2, cy + height / 2); ctx.lineTo(cx - bottomWidth / 2, cy + height / 2);
        ctx.closePath();
      }

      ctx.globalCompositeOperation = color === "eraser" ? "destination-out" : "source-over";
      ctx.fillStyle = ctx.strokeStyle = color === "eraser" ? "rgba(0,0,0,1)" : color;
      ctx.lineWidth = width;
      ctx.lineCap = "round"; // Ujung membulat
      ctx.lineJoin = "round"; // Sambungan membulat
      ctx.shadowBlur = brush === "glow" ? 10 : 0;
      ctx.shadowColor = color;
      if (fill) ctx.fill();
      ctx.stroke();
    };

    drawBaseShape(false);
    if (doMirror) drawBaseShape(true);
    ctx.restore();
  }
}

/* Fungsi baru: Menggambar garis kuas yang halus menggunakan Quadratic Curve */
function drawSmoothPath(points, color, width, segments, brush, reflectionStyle) {
  if (points.length < 2) return;

  const doRotate = reflectionStyle !== "mirror" && reflectionStyle !== "none";
  const doMirror = reflectionStyle !== "rotate" && reflectionStyle !== "none";
  const loopCount = doRotate ? segments : 1;

  // Siapkan path dasar menggunakan Quadratic Bezier agar melengkung halus
  const path = new Path2D();
  const p0 = points[0];
  path.moveTo(p0.x - CANVAS_W / 2, p0.y - CANVAS_H / 2);

  for (let i = 1; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];
    // titik kontrol di tengah-tengah antara 2 titik
    const midX = (p1.x + p2.x) / 2 - CANVAS_W / 2;
    const midY = (p1.y + p2.y) / 2 - CANVAS_H / 2;
    path.quadraticCurveTo(p1.x - CANVAS_W / 2, p1.y - CANVAS_H / 2, midX, midY);
  }
  // Tarik garis ke titik terakhir
  const pLast = points[points.length - 1];
  path.lineTo(pLast.x - CANVAS_W / 2, pLast.y - CANVAS_H / 2);

  for (let i = 0; i < loopCount; i++) {
    const angle = (i * 2 * Math.PI) / segments;
    ctx.save();
    ctx.translate(CANVAS_W / 2, CANVAS_H / 2);
    if (doRotate) ctx.rotate(angle);

    const drawLine = (mirror = false) => {
      ctx.save();
      if (mirror) ctx.scale(1, -1); // Efek cermin
      
      ctx.globalCompositeOperation = color === "eraser" ? "destination-out" : "source-over";
      ctx.strokeStyle = color === "eraser" ? "rgba(0,0,0,1)" : color;
      ctx.lineWidth = width;
      // Kunci kehalusan garis
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      // Menghindari bertumpuknya alpha di tikungan (membuat warna lebih solid/bersih)
      ctx.miterLimit = 2; 
      ctx.shadowBlur = brush === "glow" ? 10 : 0;
      ctx.shadowColor = color;
      
      ctx.stroke(path);
      ctx.restore();
    };

    drawLine(false);
    if (doMirror) drawLine(true);
    ctx.restore();
  }
}

function redrawAll() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  for (let path of paths) {
    if (path.tool === "free") {
      // Gunakan fungsi smooth yang baru
      drawSmoothPath(path.points, path.color, path.width, path.segments, path.brush, path.reflection);
    } else {
      drawShape(path.points[0], path.points[1], path);
    }
  }
  drawGuides();
}

/* ================= INPUT HANDLING ================= */

function handleDown(e) {
  if (isPinching) return;
  const pos = screenToCanvas(e.clientX, e.clientY);
  drawing = true;
  startPos = pos;
  const tool = $("toolType").value;
  currentPath = {
    tool, color: erasing ? "eraser" : $("colorPicker").value,
    width: parseInt($("lineWidth").value), segments: getSegments(),
    brush: $("brushType").value, fill: $("fillShape").checked,
    points: [startPos], reflection: $("reflectionStyle").value
  };
}

function handleMove(e) {
  if (!drawing || isPinching) return;
  const pos = screenToCanvas(e.clientX, e.clientY);
  lastTouchPos = { clientX: e.clientX, clientY: e.clientY };
  
  if (currentPath.tool === "free") {
    // Hanya tambahkan titik jika jaraknya lumayan jauh (mencegah titik menumpuk)
    const lastP = currentPath.points[currentPath.points.length - 1];
    const dist = Math.hypot(pos.x - lastP.x, pos.y - lastP.y);
    
    if (dist > 1.5) { 
      currentPath.points.push(pos);
      // Karena penggambaran path smooth lebih efisien, kita redraw saja
      // (atau jika terasa lag, gambar hanya segmen terakhir)
      redrawAll(); 
      drawSmoothPath(currentPath.points, currentPath.color, currentPath.width, currentPath.segments, currentPath.brush, currentPath.reflection);
    }
  } else {
    redrawAll();
    drawShape(startPos, pos, currentPath);
    drawGuides();
  }
}

function handleUp(e) {
  if (!drawing || isPinching) { drawing = false; return; }
  drawing = false;
  let cx, cy;
  if (e.changedTouches && e.changedTouches.length) {
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else if (lastTouchPos) {
    cx = lastTouchPos.clientX;
    cy = lastTouchPos.clientY;
  } else {
    cx = e.clientX; cy = e.clientY;
  }
  const endPos = screenToCanvas(cx, cy);
  
  if (currentPath.tool !== "free") {
    currentPath.points.push(endPos);
  } else {
    // Pastikan titik terakhir masuk
    const lastP = currentPath.points[currentPath.points.length - 1];
    if (Math.hypot(endPos.x - lastP.x, endPos.y - lastP.y) > 1) {
      currentPath.points.push(endPos);
    }
  }
  
  paths.push(currentPath);
  undoStack.push(currentPath);
  redoStack = [];
  redrawAll();
}

/* ================= WHEEL ZOOM (mouse) ================= */
function handleWheel(e) {
  e.preventDefault();
  const zoomIntensity = 0.1;
  const oldScale = transform.scale;
  let newScale = oldScale * (e.deltaY < 0 ? 1 + zoomIntensity : 1 - zoomIntensity);
  newScale = Math.min(Math.max(newScale, 0.1), 10);

  const p = screenToCanvas(e.clientX, e.clientY);
  transform.tx = e.clientX - baseLeft - newScale * k * p.x;
  transform.ty = e.clientY - baseTop  - newScale * k * p.y;
  transform.scale = newScale;
  applyTransform();
}

/* ================= TOUCH ================= */

function touchDistance(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}
function touchMid(t1, t2) {
  return {
    x: (t1.clientX + t2.clientX) / 2,
    y: (t1.clientY + t2.clientY) / 2
  };
}

function startPinch(t1, t2) {
  isPinching = true;
  if (drawing) { drawing = false; currentPath = null; }
  pinchStartDistance = touchDistance(t1, t2);
  pinchStartScale = transform.scale;
  pinchStartMid = touchMid(t1, t2);
  pinchStartTx = transform.tx;
  pinchStartTy = transform.ty;
}

function handleTouchStart(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    startPinch(e.touches[0], e.touches[1]);
  } else if (e.touches.length === 1) {
    if (isPinching) return;
    handleDown(e.touches[0]);
  }
}

function handleTouchMove(e) {
  if (e.touches.length === 2) {
    e.preventDefault();
    if (!isPinching) { startPinch(e.touches[0], e.touches[1]); return; }

    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = touchDistance(t1, t2);
    if (pinchStartDistance === 0) return;
    const ratio = dist / pinchStartDistance;
    let newScale = pinchStartScale * ratio;
    newScale = Math.min(Math.max(newScale, 0.1), 10);

    const mid = touchMid(t1, t2);
    const px = (pinchStartMid.x - baseLeft - pinchStartTx) / (pinchStartScale * k);
    const py = (pinchStartMid.y - baseTop  - pinchStartTy) / (pinchStartScale * k);

    transform.tx = mid.x - baseLeft - newScale * k * px;
    transform.ty = mid.y - baseTop  - newScale * k * py;
    transform.scale = newScale;
    applyTransform();
  } else if (e.touches.length === 1) {
    if (isPinching) return;
    e.preventDefault();
    handleMove(e.touches[0]);
  }
}

function handleTouchEnd(e) {
  if (e.touches.length === 0) {
    if (isPinching) {
      isPinching = false;
      pinchStartDistance = 0;
      drawing = false;
      return;
    }
    handleUp(e);
  } else if (e.touches.length === 1 && isPinching) {
    isPinching = false;
    pinchStartDistance = 0;
  }
}

/* ================= SETUP INPUT MODE ================= */

function setupInputMode(mode) {
  const newCanvas = canvas.cloneNode(true);
  canvas.parentNode.replaceChild(newCanvas, canvas);
  canvas = newCanvas;
  ctx = canvas.getContext("2d");
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;

  layoutCanvas();
  applyTransform();

  canvas.addEventListener("wheel", handleWheel, { passive: false });

  if (mode === "mouse") {
    canvas.addEventListener("mousedown", handleDown);
    canvas.addEventListener("mousemove", (e) => { if (drawing) handleMove(e); });
    window.addEventListener("mouseup", handleUp);
  } else {
    canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
    canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
    canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
    canvas.addEventListener("touchcancel", handleTouchEnd, { passive: false });
  }

  redrawAll();
}

$("inputMode").addEventListener("change", (e) => setupInputMode(e.target.value));
setupInputMode($("inputMode").value);

/* ================= BUTTONS ================= */

$("undo").onclick = () => { if (paths.length > 0) redoStack.push(paths.pop()); redrawAll(); };
$("redo").onclick = () => { if (redoStack.length > 0) paths.push(redoStack.pop()); redrawAll(); };
$("reset").onclick = () => {
  paths = []; undoStack = []; redoStack = [];
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  drawGuides();
};

$("resetZoom").onclick = () => {
  transform.scale = 1;
  transform.tx = 0;
  transform.ty = 0;
  applyTransform();
};

$("eraser").onclick = () => {
  erasing = !erasing;
  $("eraser").style.background = erasing ? "#ffcccc" : "#fff";
};

/* ================= SAVE ================= */
$("save").onclick = () => {
  const showGuidesWas = $("showGuides").checked;
  const tmpCanvas = document.createElement("canvas");
  tmpCanvas.width = CANVAS_W;
  tmpCanvas.height = CANVAS_H;
  const tmpCtx = tmpCanvas.getContext("2d", { willReadFrequently: true });

  const realCtx = ctx;
  ctx = tmpCtx;
  $("showGuides").checked = false;
  redrawAll();

  const imgData = tmpCtx.getImageData(0, 0, CANVAS_W, CANVAS_H);
  const data = imgData.data;
  let minX = CANVAS_W, minY = CANVAS_H, maxX = 0, maxY = 0;
  let hasPixels = false;

  for (let y = 0; y < CANVAS_H; y++) {
    for (let x = 0; x < CANVAS_W; x++) {
      const alpha = data[(y * CANVAS_W + x) * 4 + 3];
      if (alpha > 0) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        hasPixels = true;
      }
    }
  }

  ctx = realCtx;
  $("showGuides").checked = showGuidesWas;

  if (!hasPixels) {
    alert("Kanvas masih kosong!");
    return;
  }

  const padding = 20;
  minX = Math.max(0, minX - padding);
  minY = Math.max(0, minY - padding);
  maxX = Math.min(CANVAS_W, maxX + padding);
  maxY = Math.min(CANVAS_H, maxY + padding);

  const cropW = maxX - minX;
  const cropH = maxY - minY;

  const finalCanvas = document.createElement("canvas");
  finalCanvas.width = cropW;
  finalCanvas.height = cropH;
  const finalCtx = finalCanvas.getContext("2d");
  finalCtx.drawImage(tmpCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

  const link = document.createElement("a");
  link.download = "kaleidoscope.png";
  link.href = finalCanvas.toDataURL("image/png");
  link.click();

  redrawAll();
};

/* ================= RESIZE ================= */

function onResize() {
  layoutCanvas();
  applyTransform();
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);
onResize();
</script>

</body>
</html>
