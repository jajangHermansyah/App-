<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Kaleidoscope Drawing</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden; position: fixed; background: #222; font-family: sans-serif;
    }
    #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }
    #controls {
      flex: 0 0 auto; background: #e0e0e0; padding: 6px;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
      border-bottom: 2px solid #333; touch-action: manipulation; z-index: 10;
    }
    .ctrl-group {
      display: flex; align-items: center; background: #fff;
      border: 1px solid #999; border-radius: 6px; padding: 2px 6px; height: 36px;
    }
    .ctrl-group span { font-size: 16px; margin-right: 4px; }
    #controls input[type="number"], #controls select {
      font-size: 16px; border: none; outline: none; background: transparent;
      padding: 0; margin: 0; color: #333; font-weight: bold;
    }
    #controls input[type="number"] { width: 45px; text-align: center; }
    #controls select { width: 90px; cursor: pointer; -webkit-appearance: none; appearance: none; }
    #controls input[type="color"] { width: 28px; height: 28px; padding: 0; border: none; background: none; cursor: pointer; }
    #controls input[type="checkbox"] { width: 20px; height: 20px; margin: 0; cursor: pointer; }
    .btn-group { display: flex; gap: 4px; width: 100%; justify-content: space-between; }
    .btn-group button {
      flex: 1; font-size: 14px; font-weight: bold; padding: 6px 0;
      border: 1px solid #555; border-radius: 6px; background: #fff;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 4px;
    }
    .btn-group button:active { background: #ccc; }
    .btn-group button.active { background: #ffcccc; border-color: #d26969; }
    
    #canvas-wrapper {
      flex: 1 1 auto; position: relative; overflow: hidden;
      background-color: #333; display: flex; justify-content: center; align-items: center;
    }
    canvas {
      position: absolute; touch-action: none;
      transform-origin: 0 0; will-change: transform;
    }
    #bgCanvas { z-index: 0; background-color: #ffffff; }
    #sceneCanvas   { z-index: 1; background-color: transparent; }
    #previewCanvas { z-index: 2; background-color: transparent; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="app-container">
  <div id="controls">
    <div class="ctrl-group" title="Warna"><span>🎨</span><input type="color" id="color" value="#000000"></div>
    <div class="ctrl-group" title="Ketebalan"><span>🖌️</span><input type="number" id="width" min="1" max="50" value="4"></div>
    <div class="ctrl-group" title="Tipe Kuas"><span>✏️</span><select id="brush"><option value="normal">Normal</option><option value="glow">Glow</option></select></div>

    <div class="ctrl-group" title="Alat Gambar">
      <span>📐</span>
      <select id="tool">
        <option value="freehand">Bebas</option>
        <option value="line">Garis</option>
        <option value="circle">Lingkaran</option>
        <option value="triangle">Segitiga</option>
        <option value="rectangle">Persegi P.</option>
        <option value="square">Persegi</option>
        <option value="ellipse">Elips</option>
        <option value="star">Bintang</option>
        <option value="heart">Hati</option>
        <option value="trapezoid">Trapesium</option>
      </select>
    </div>

    <div class="ctrl-group" title="Isi Warna"><span>🍩</span><input type="checkbox" id="fill"></div>
    <div class="ctrl-group" title="Jumlah Pantulan"><span>🔁</span><input type="number" id="segments" min="2" max="48" value="12"></div>
    <div class="ctrl-group" title="Gaya Pantulan">
      <span>💠</span>
      <select id="reflection">
        <option value="both">Rotasi+Cermin</option>
        <option value="rotate">Rotasi</option>
        <option value="mirror">Cermin</option>
        <option value="none">Tanpa</option>
      </select>
    </div>

    <div class="ctrl-group" title="Tampilkan Garis Panduan"><span>👁️</span><input type="checkbox" id="showGuides" checked></div>

    <div class="btn-group">
      <button id="eraserBtn" title="Penghapus">🧹</button>
      <button id="undoBtn" disabled>↩️</button>
      <button id="redoBtn" disabled>↪️</button>
      <button id="clearBtn">🗑️</button>
      <button id="resetZoomBtn" title="Reset Zoom">🔄</button>
      <button id="saveBtn">💾</button>
      <button id="importBtn">🖼️</button>
      <button id="clearTextureBtn">🚫</button>
      <input type="file" id="textureFile" accept="image/*" class="hidden">
    </div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="bgCanvas" width="980" height="980"></canvas>
    <canvas id="sceneCanvas" width="980" height="980"></canvas>
    <canvas id="previewCanvas" width="980" height="980"></canvas>
  </div>
</div>

<script>
"use strict";

/* ================= SETUP CANVAS ================= */
const W = 980, H = 980, CX = W/2, CY = H/2;

const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");

const sceneCanvas = document.getElementById("sceneCanvas");
const sceneCtx = sceneCanvas.getContext("2d", { alpha: true });

const previewCanvas = document.getElementById("previewCanvas");
const previewCtx = previewCanvas.getContext("2d");

const snapshotCanvas = document.createElement("canvas");
snapshotCanvas.width = W; snapshotCanvas.height = H;
const snapshotCtx = snapshotCanvas.getContext("2d");

const eraserPreviewCanvas = document.createElement("canvas");
eraserPreviewCanvas.width = W; eraserPreviewCanvas.height = H;
const eraserPreviewCtx = eraserPreviewCanvas.getContext("2d");

/* ================= TRANSFORM & LAYOUT ================= */
const wrapper = document.getElementById("canvas-wrapper");
let transform = { scale: 1, tx: 0, ty: 0 };
let baseSize = 0, baseLeft = 0, baseTop = 0;

function layoutCanvas() {
  const w = wrapper.clientWidth, h = wrapper.clientHeight;
  baseSize = Math.min(w, h);
  baseLeft = (w - baseSize) / 2;
  baseTop  = (h - baseSize) / 2;
  [bgCanvas, sceneCanvas, previewCanvas].forEach(c => {
    c.style.width = baseSize + "px";
    c.style.height = baseSize + "px";
    c.style.left = baseLeft + "px";
    c.style.top = baseTop + "px";
  });
  applyTransform();
}

function applyTransform() {
  const t = `translate(${transform.tx}px, ${transform.ty}px) scale(${transform.scale})`;
  bgCanvas.style.transform = t;
  sceneCanvas.style.transform = t;
  previewCanvas.style.transform = t;
}

function screenToCanvas(clientX, clientY) {
  const rect = previewCanvas.getBoundingClientRect();
  const scaleFactor = baseSize / W;
  return {
    x: (clientX - rect.left) / (transform.scale * scaleFactor),
    y: (clientY - rect.top) / (transform.scale * scaleFactor)
  };
}

window.addEventListener("resize", layoutCanvas);
window.addEventListener("orientationchange", layoutCanvas);
layoutCanvas();

/* ================= ELEMEN UI ================= */
const colorInput = document.getElementById("color");
const widthInput = document.getElementById("width");
const segmentsInput = document.getElementById("segments");
const brushInput = document.getElementById("brush");
const reflectionInput = document.getElementById("reflection");
const fillInput = document.getElementById("fill");
const guidesInput = document.getElementById("showGuides");
const toolSelect = document.getElementById("tool");
const eraserBtn = document.getElementById("eraserBtn");

let selectedTool = "freehand";
let isEraserMode = false;
let currentPath = null;
let isDrawing = false;
let activePointerId = null;

let undoStack = [];
let redoStack = [];
const MAX_HISTORY = 20;
const MAX_POINTS = 12000;

let textureImage = null;

/* ================= MULTI-TOUCH ================= */
let isPinching = false;
let initialPinchDist = 0, initialPinchScale = 1;
let initialPinchMid = { x: 0, y: 0 };
let initialPinchTx = 0, initialPinchTy = 0;

function getDistance(t1, t2) {
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}
function getMidpoint(t1, t2) {
  return { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
}

function handlePinchStart(touches) {
  isPinching = true;
  if (isDrawing) {
    isDrawing = false; currentPath = null;
    previewCtx.clearRect(0, 0, W, H); renderFrame();
  }
  initialPinchDist = getDistance(touches[0], touches[1]);
  initialPinchScale = transform.scale;
  initialPinchMid = getMidpoint(touches[0], touches[1]);
  initialPinchTx = transform.tx; initialPinchTy = transform.ty;
}

function handlePinchMove(touches) {
  const dist = getDistance(touches[0], touches[1]);
  const currentMid = getMidpoint(touches[0], touches[1]);
  let newScale = initialPinchScale * (dist / initialPinchDist);
  newScale = Math.min(Math.max(newScale, 0.5), 300);
  const deltaX = currentMid.x - initialPinchMid.x;
  const deltaY = currentMid.y - initialPinchMid.y;
  const rect = wrapper.getBoundingClientRect();
  const midX = initialPinchMid.x - rect.left;
  const midY = initialPinchMid.y - rect.top;
  const px = (midX - baseLeft - initialPinchTx) / initialPinchScale;
  const py = (midY - baseTop - initialPinchTy) / initialPinchScale;
  transform.tx = (midX - baseLeft - px * newScale) + deltaX;
  transform.ty = (midY - baseTop - py * newScale) + deltaY;
  transform.scale = newScale;
  applyTransform();
}

/* ================= TOUCH EVENTS ================= */
previewCanvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) { e.preventDefault(); handlePinchStart(e.touches); }
  else if (e.touches.length === 1 && !isPinching) { e.preventDefault(); handleDown(e.touches[0]); }
}, { passive: false });

previewCanvas.addEventListener("touchmove", (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    if (!isPinching) handlePinchStart(e.touches);
    handlePinchMove(e.touches);
  } else if (e.touches.length === 1 && !isPinching) {
    e.preventDefault(); handleMove(e.touches[0]);
  }
}, { passive: false });

previewCanvas.addEventListener("touchend", (e) => {
  if (e.touches.length === 0) {
    if (isPinching) isPinching = false;
    else handleUp(e.changedTouches[0]);
  } else if (e.touches.length === 1 && isPinching) {
    isPinching = false;
  }
}, { passive: false });

previewCanvas.addEventListener("touchcancel", () => {
  isPinching = false;
  if (isDrawing) finishDrawing();
});

previewCanvas.addEventListener("mousedown", (e) => {
  if (e.pointerType === "touch") return;
  handleDown(e);
});
previewCanvas.addEventListener("mousemove", (e) => {
  if (e.pointerType === "touch") return;
  if (isDrawing) handleMove(e);
});
window.addEventListener("mouseup", (e) => {
  if (e.pointerType === "touch") return;
  if (isDrawing) handleUp(e);
});

previewCanvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const zoomIntensity = 0.1;
  const oldScale = transform.scale;
  let newScale = oldScale * (e.deltaY < 0 ? 1 + zoomIntensity : 1 - zoomIntensity);
  newScale = Math.min(Math.max(newScale, 0.5), 200);
  const rect = wrapper.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const px = (mouseX - baseLeft - transform.tx) / oldScale;
  const py = (mouseY - baseTop - transform.ty) / oldScale;
  transform.tx = mouseX - baseLeft - px * newScale;
  transform.ty = mouseY - baseTop - py * newScale;
  transform.scale = newScale;
  applyTransform();
}, { passive: false });


/* ================= LOGIKA GAMBAR & PENGHAPUSAN ================= */
let lastProcessedPointIndex = 0;

function handleDown(e) {
  if (isDrawing) return;
  activePointerId = e.identifier || "mouse";
  const p = screenToCanvas(e.clientX, e.clientY);
  saveHistory();
  currentPath = { settings: getSettings(), points: [p, p] };
  isDrawing = true;
  lastProcessedPointIndex = 0;

  snapshotCtx.clearRect(0, 0, W, H);
  snapshotCtx.drawImage(sceneCanvas, 0, 0);

  renderFrame();
}

function handleMove(e) {
  if (!isDrawing || !currentPath) return;
  if (e.identifier && e.identifier !== activePointerId) return;
  const p = screenToCanvas(e.clientX, e.clientY);

  const points = currentPath.points;
  const settings = currentPath.settings;

  if (settings.shape === "freehand") {
    const last = points[points.length - 1];
    const dx = p.x - last.x, dy = p.y - last.y;
    if (dx*dx + dy*dy < 0.5) return;

    if (points.length < MAX_POINTS) points.push(p);
    else points[points.length - 1] = p;

    if (settings.erase) {
      applyIncrementalEraser();
    }
  } else {
    points[1] = p;
  }

  renderFrame();
}

function handleUp() {
  if (!isDrawing || !currentPath) return;
  finishDrawing();
  activePointerId = null;
}

function applyIncrementalEraser() {
  const points = currentPath.points;
  const settings = currentPath.settings;
  if (points.length < 2) return;

  const slicePoints = points.slice(lastProcessedPointIndex);
  if (slicePoints.length < 2) return;

  // 1. Hapus di sceneCtx (coretan)
  sceneCtx.save();
  sceneCtx.lineCap = "round";
  sceneCtx.lineJoin = "round";
  sceneCtx.lineWidth = settings.width;
  sceneCtx.globalCompositeOperation = "destination-out";
  sceneCtx.strokeStyle = "rgba(0,0,0,1)";
  sceneCtx.shadowBlur = 0;

  drawReflected(sceneCtx, settings, function(c) {
    traceSmoothPath(c, slicePoints);
    c.stroke();
  });
  sceneCtx.restore();

  // 2. Hapus di bgCtx (jika ada gambar galeri)
  if (textureImage) {
    bgCtx.save();
    bgCtx.lineCap = "round";
    bgCtx.lineJoin = "round";
    bgCtx.lineWidth = settings.width;
    bgCtx.globalCompositeOperation = "destination-out";
    bgCtx.strokeStyle = "rgba(0,0,0,1)";
    bgCtx.shadowBlur = 0;
    
    drawReflected(bgCtx, settings, function(c) {
      traceSmoothPath(c, slicePoints);
      c.stroke();
    });
    bgCtx.restore();
  }

  lastProcessedPointIndex = points.length - 1;
}

function finishDrawing() {
  if (!isDrawing || !currentPath) return;
  const path = currentPath;
  const settings = path.settings;

  if (settings.shape === "freehand") {
    if (!settings.erase) {
      drawSmoothPathTo(sceneCtx, path.points, settings);
    }
  } else {
    if (settings.erase && textureImage) {
      // Hapus bentuk di bgCtx juga
      bgCtx.save();
      bgCtx.globalCompositeOperation = "destination-out";
      bgCtx.fillStyle = "rgba(0,0,0,1)";
      bgCtx.strokeStyle = "rgba(0,0,0,1)";
      bgCtx.lineWidth = settings.width;
      drawReflected(bgCtx, settings, function(c) {
        traceShape(c, path.points, settings.shape, settings.fill);
        if (settings.shape === "line" || !settings.fill) c.stroke();
      });
      bgCtx.restore();
    }
    drawShapeTo(sceneCtx, path.points, settings);
  }

  currentPath = null;
  isDrawing = false;
  previewCtx.clearRect(0, 0, W, H);
  renderFrame();
}

/* ================= UI & PENGATURAN ================= */
toolSelect.addEventListener("change", (e) => {
  selectedTool = e.target.value;
});

eraserBtn.addEventListener("click", () => {
  isEraserMode = !isEraserMode;
  eraserBtn.classList.toggle("active", isEraserMode);
  eraserBtn.textContent = isEraserMode ? "✅🧹" : "🧹";
});

function getSettings() {
  return {
    color: colorInput.value,
    width: Number(widthInput.value),
    segments: Number(segmentsInput.value),
    brush: brushInput.value,
    reflection: reflectionInput.value,
    fill: fillInput.checked,
    shape: selectedTool,
    erase: isEraserMode
  };
}

/* ================= RENDER & GAMBAR ================= */
function drawReflected(targetCtx, settings, drawFunction) {
  const n = Math.max(2, settings.segments);
  const step = (Math.PI * 2) / n;
  const mode = settings.reflection;
  targetCtx.save();
  targetCtx.translate(CX, CY);
  for (let i = 0; i < n; i++) {
    targetCtx.save();
    targetCtx.rotate(i * step);
    if (mode === "both" || mode === "mirror") {
      targetCtx.save();
      targetCtx.scale(1, -1);
      drawFunction(targetCtx, settings);
      targetCtx.restore();
    }
    if (mode === "both" || mode === "rotate" || mode === "none") {
      drawFunction(targetCtx, settings);
    }
    targetCtx.restore();
    if (mode === "none") break;
  }
  targetCtx.restore();
}

function traceSmoothPath(targetCtx, points) {
  if (!points || points.length === 0) return;
  targetCtx.beginPath();
  targetCtx.moveTo(points[0].x - CX, points[0].y - CY);
  if (points.length === 1) {
    targetCtx.lineTo(points[0].x - CX + 0.01, points[0].y - CY + 0.01);
    return;
  }
  if (points.length === 2) {
    targetCtx.lineTo(points[1].x - CX, points[1].y - CY);
    return;
  }
  for (let i = 1; i < points.length - 1; i++) {
    const p1 = points[i], p2 = points[i + 1];
    targetCtx.quadraticCurveTo(p1.x - CX, p1.y - CY, (p1.x + p2.x)/2 - CX, (p1.y + p2.y)/2 - CY);
  }
  const last = points[points.length - 1];
  targetCtx.lineTo(last.x - CX, last.y - CY);
}

function drawSmoothPathTo(targetCtx, points, settings) {
  if (!points || points.length === 0) return;
  targetCtx.save();
  targetCtx.lineCap = "round";
  targetCtx.lineJoin = "round";
  targetCtx.lineWidth = settings.width;

  if (settings.erase) {
    targetCtx.globalCompositeOperation = "destination-out";
    targetCtx.strokeStyle = "rgba(0,0,0,1)";
    targetCtx.shadowBlur = 0;
  } else {
    targetCtx.globalCompositeOperation = "source-over";
    targetCtx.strokeStyle = settings.color;
    if (settings.brush === "glow") {
      targetCtx.shadowColor = settings.color;
      targetCtx.shadowBlur = settings.width * 2.5;
    } else {
      targetCtx.shadowBlur = 0;
    }
  }

  drawReflected(targetCtx, settings, function(c) {
    traceSmoothPath(c, points);
    c.stroke();
  });
  targetCtx.restore();
}

function traceShape(targetCtx, points, shape, filled) {
  if (!points || points.length < 1) return;
  const a = points[0], b = points[points.length - 1];
  const x1 = a.x - CX, y1 = a.y - CY;
  const x2 = b.x - CX, y2 = b.y - CY;
  const left = Math.min(x1, x2), right = Math.max(x1, x2);
  const top = Math.min(y1, y2), bottom = Math.max(y1, y2);
  const width = right - left, height = bottom - top;

  targetCtx.beginPath();
  if (shape === "line") { targetCtx.moveTo(x1, y1); targetCtx.lineTo(x2, y2); }
  else if (shape === "circle") { targetCtx.arc((x1+x2)/2, (y1+y2)/2, Math.sqrt(width*width+height*height)/2, 0, Math.PI*2); }
  else if (shape === "ellipse") { targetCtx.ellipse((x1+x2)/2, (y1+y2)/2, Math.max(0.5, width/2), Math.max(0.5, height/2), 0, 0, Math.PI*2); }
  else if (shape === "rectangle" || shape === "square") {
    let w = width, h = height;
    if (shape === "square") { const size = Math.max(width, height); w = size; h = size; }
    targetCtx.rect(left, top, w, h);
  }
  else if (shape === "triangle") { targetCtx.moveTo((x1+x2)/2, top); targetCtx.lineTo(right, bottom); targetCtx.lineTo(left, bottom); targetCtx.closePath(); }
  else if (shape === "star") {
    const cx = (x1+x2)/2, cy = (y1+y2)/2;
    const outer = Math.max(1, Math.sqrt(width*width+height*height)/2), inner = outer*0.42;
    for (let i=0; i<10; i++) {
      const r = i%2===0 ? outer : inner;
      const angle = -Math.PI/2 + i*Math.PI/5;
      const px = cx + Math.cos(angle)*r, py = cy + Math.sin(angle)*r;
      if (i===0) targetCtx.moveTo(px, py); else targetCtx.lineTo(px, py);
    }
    targetCtx.closePath();
  }
  else if (shape === "heart") {
    const cx = (x1+x2)/2, cy = (y1+y2)/2;
    const w = Math.max(1, width), h = Math.max(1, height);
    targetCtx.moveTo(cx, cy + h*0.4);
    targetCtx.bezierCurveTo(cx - w*0.7, cy - h*0.05, cx - w*0.45, cy - h*0.6, cx, cy - h*0.25);
    targetCtx.bezierCurveTo(cx + w*0.45, cy - h*0.6, cx + w*0.7, cy - h*0.05, cx, cy + h*0.4);
    targetCtx.closePath();
  }
  else if (shape === "trapezoid") {
    const inset = width*0.22;
    targetCtx.moveTo(left+inset, top); targetCtx.lineTo(right-inset, top);
    targetCtx.lineTo(right, bottom); targetCtx.lineTo(left, bottom);
    targetCtx.closePath();
  }

  if (filled && shape !== "line") {
    targetCtx.fill();
  }
}

function drawShapeTo(targetCtx, points, settings) {
  targetCtx.save();
  targetCtx.lineWidth = settings.width;
  targetCtx.lineCap = "round";
  targetCtx.lineJoin = "round";

  if (settings.erase) {
    targetCtx.globalCompositeOperation = "destination-out";
    targetCtx.strokeStyle = "rgba(0,0,0,1)";
    targetCtx.fillStyle = "rgba(0,0,0,1)";
    targetCtx.shadowBlur = 0;
  } else {
    targetCtx.globalCompositeOperation = "source-over";
    targetCtx.strokeStyle = settings.color;
    targetCtx.fillStyle = settings.color;
    if (settings.brush === "glow") {
      targetCtx.shadowColor = settings.color;
      targetCtx.shadowBlur = settings.width * 2;
    } else {
      targetCtx.shadowBlur = 0;
    }
  }

  drawReflected(targetCtx, settings, function(c) {
    traceShape(c, points, settings.shape, settings.fill);
    if (settings.shape === "line" || !settings.fill) c.stroke();
  });
  targetCtx.restore();
}

function drawGuides(targetCtx) {
  if (!guidesInput.checked) return;
  const n = Number(segmentsInput.value);
  const step = (Math.PI * 2) / n;
  targetCtx.save();
  targetCtx.translate(CX, CY);
  targetCtx.strokeStyle = "rgba(40,50,70,0.17)";
  targetCtx.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const angle = i * step;
    targetCtx.beginPath();
    targetCtx.moveTo(0, 0);
    targetCtx.lineTo(Math.cos(angle) * W, Math.sin(angle) * H);
    targetCtx.stroke();
  }
  targetCtx.beginPath();
  targetCtx.arc(0, 0, 5, 0, Math.PI * 2);
  targetCtx.stroke();
  targetCtx.restore();
}

/* ================= PREVIEW (PERBAIKAN VISUAL ERASER) ================= */
function drawPreview() {
  previewCtx.clearRect(0, 0, W, H);

  if (currentPath && currentPath.points.length > 0) {
    const settings = currentPath.settings;

    if (settings.shape !== "freehand") {
      if (settings.erase) {
        // 1. Render efek hapusan secara live ke layer tersembunyi
        eraserPreviewCtx.clearRect(0, 0, W, H);
        eraserPreviewCtx.drawImage(snapshotCanvas, 0, 0);
        drawShapeTo(eraserPreviewCtx, currentPath.points, settings);

        // 2. Tampilkan hasil hapusan dan background ke layar
        previewCtx.save();
        previewCtx.globalCompositeOperation = "source-over";
        previewCtx.drawImage(bgCanvas, 0, 0);
        previewCtx.drawImage(eraserPreviewCanvas, 0, 0);
        previewCtx.restore();

        // 3. Tampilkan OUTLINE BENTUK ASLI dengan warna merah transparan
        previewCtx.save();
        previewCtx.lineWidth = Math.max(1, settings.width); 
        previewCtx.strokeStyle = "rgba(255, 0, 0, 0.5)"; // Merah transparan
        previewCtx.fillStyle = "rgba(255, 0, 0, 0.2)"; // Merah pudar

        drawReflected(previewCtx, settings, function(c) {
          traceShape(c, currentPath.points, settings.shape, settings.fill);
          c.stroke(); // Selalu gambar outline solid
          if (settings.fill && settings.shape !== "line") {
             c.fill(); // Isi bentuk jika checkbox dicentang
          }
        });
        previewCtx.restore();

      } else {
        drawShapeTo(previewCtx, currentPath.points, settings);
      }
    } else if (!settings.erase) {
      drawSmoothPathTo(previewCtx, currentPath.points, settings);
    }
  }

  drawGuides(previewCtx);
}

function renderFrame() {
  drawPreview();
}

/* ================= UNDO/REDO ================= */
function saveHistory() {
  try {
    const combined = document.createElement("canvas");
    combined.width = W; combined.height = H;
    const cCtx = combined.getContext("2d");
    cCtx.drawImage(bgCanvas, 0, 0);
    cCtx.drawImage(sceneCanvas, 0, 0);
    
    undoStack.push(combined.toDataURL("image/png"));
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    updateHistoryButtons();
  } catch (e) {}
}

function restoreHistory(dataUrl) {
  const img = new Image();
  img.onload = function() {
    sceneCtx.clearRect(0, 0, W, H);
    sceneCtx.drawImage(img, 0, 0, W, H);
    
    bgCtx.clearRect(0, 0, W, H);
    textureImage = null; 
    renderFrame();
  };
  img.src = dataUrl;
}

function updateHistoryButtons() {
  document.getElementById("undoBtn").disabled = undoStack.length === 0;
  document.getElementById("redoBtn").disabled = redoStack.length === 0;
}

document.getElementById("undoBtn").addEventListener("click", () => {
  if (isDrawing) finishDrawing();
  if (!undoStack.length) return;
  
  const combined = document.createElement("canvas");
  combined.width = W; combined.height = H;
  const cCtx = combined.getContext("2d");
  cCtx.drawImage(bgCanvas, 0, 0);
  cCtx.drawImage(sceneCanvas, 0, 0);
  
  redoStack.push(combined.toDataURL("image/png"));
  restoreHistory(undoStack.pop());
  updateHistoryButtons();
});

document.getElementById("redoBtn").addEventListener("click", () => {
  if (isDrawing) finishDrawing();
  if (!redoStack.length) return;
  
  const combined = document.createElement("canvas");
  combined.width = W; combined.height = H;
  const cCtx = combined.getContext("2d");
  cCtx.drawImage(bgCanvas, 0, 0);
  cCtx.drawImage(sceneCanvas, 0, 0);
  
  undoStack.push(combined.toDataURL("image/png"));
  restoreHistory(redoStack.pop());
  updateHistoryButtons();
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (isDrawing) { isDrawing = false; currentPath = null; }
  saveHistory();
  sceneCtx.clearRect(0, 0, W, H);
  previewCtx.clearRect(0, 0, W, H);
  renderFrame();
});

document.getElementById("resetZoomBtn").addEventListener("click", () => {
  transform = { scale: 1, tx: 0, ty: 0 };
  applyTransform();
});

/* ================= SAVE (HASIL TRANSPARAN) ================= */
document.getElementById("saveBtn").addEventListener("click", function() {
  if (isDrawing) finishDrawing();

  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = W; exportCanvas.height = H;
  const ectx = exportCanvas.getContext("2d");

  if (textureImage) {
    ectx.drawImage(bgCanvas, 0, 0);
  }
  
  ectx.drawImage(sceneCanvas, 0, 0);

  const link = document.createElement("a");
  link.download = "kaleidoscope.png";
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
});

/* ================= TEXTURE ================= */
function drawTextureToLayer() {
  if (!textureImage) return;
  const iw = textureImage.naturalWidth || textureImage.width;
  const ih = textureImage.naturalHeight || textureImage.height;
  const scale = Math.max(W / iw, H / ih);
  const dw = iw * scale, dh = ih * scale;
  const dx = (W - dw)/2, dy = (H - dh)/2;

  bgCtx.save();
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.globalCompositeOperation = "source-over";
  bgCtx.globalAlpha = 1;
  bgCtx.drawImage(textureImage, dx, dy, dw, dh);
  bgCtx.restore();
}

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("textureFile").click();
});

document.getElementById("textureFile").addEventListener("change", (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      textureImage = img;
      saveHistory();
      drawTextureToLayer();
      renderFrame();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

document.getElementById("clearTextureBtn").addEventListener("click", () => {
  saveHistory();
  textureImage = null;
  sceneCtx.clearRect(0, 0, W, H);
  bgCtx.clearRect(0, 0, W, H);
  renderFrame();
});

/* ================= INIT ================= */
bgCtx.clearRect(0, 0, W, H); 
sceneCtx.clearRect(0, 0, W, H);
previewCtx.clearRect(0, 0, W, H);
renderFrame();
updateHistoryButtons();
</script>
