
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111122">
<title>Edge Builder + Background Image</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #0a0a14; color: #eee;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #app { display: flex; width: 100vw; height: 100vh; overflow: hidden; }

  #panel2D {
    flex: 0 0 55%; display: flex; flex-direction: column;
    background: #12121e; border-right: 1px solid #222;
    min-width: 260px; position: relative;
  }
  #toolbar2D {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 6px; background: #1a1a2a;
    border-bottom: 1px solid #2a2a3a;
  }
  .toolBtn {
    width: 40px; height: 40px; border: none;
    border-radius: 8px; background: #2a2a3e;
    color: #bbb; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, background .15s;
    font-weight: bold; touch-action: manipulation;
  }
  .toolBtn:active { transform: scale(0.9); }
  .toolBtn.active {
    background: #ff8800; color: #000;
    box-shadow: 0 0 0 2px rgba(255,136,0,0.4);
  }
  .toolBtn.danger { background: #6a1a1a; color: #fff; }
  .toolBtn.danger:active { background: #aa2222; }
  .toolBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  .toolBtn.edge { background: #2a5a8a; color: #fff; }
  .toolBtn.edge.active {
    background: #44aaff; color: #000;
    box-shadow: 0 0 0 2px rgba(68,170,255,0.5);
  }
  .toolBtn.curve { background: #6a2a8a; color: #fff; }
  .toolBtn.curve.active {
    background: #cc66ff; color: #000;
    box-shadow: 0 0 0 2px rgba(204,102,255,0.5);
  }
  .toolBtn.arc { background: #2a7a5a; color: #fff; }
  .toolBtn.arc.active {
    background: #00ff99; color: #000;
    box-shadow: 0 0 0 2px rgba(0,255,153,0.5);
  }
  .toolBtn.bg { background: #8a5a2a; color: #fff; }
  .toolBtn.bg.hasImage {
    background: #ffaa44; color: #000;
    box-shadow: 0 0 0 2px rgba(255,170,68,0.5);
  }
  .toolBtn.save { background: #2a7a3a; color: #fff; }
  .toolBtn.save:active { background: #1a5a2a; }
  .toolBtn.finishMode {
    background: #ff4444 !important; color: #fff !important;
    animation: pulseFinish 1.2s infinite;
  }
  @keyframes pulseFinish {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,68,68,0.5); }
    50% { box-shadow: 0 0 0 6px rgba(255,68,68,0.2); }
  }
  .toolBtn.group { background: #2a7a6a; color: #fff; }
  .toolBtn.group.active {
    background: #00ffcc; color: #000;
    box-shadow: 0 0 0 2px rgba(0,255,204,0.5);
  }
  .toolBtn.magnetOn {
    background: #00c8ff; color: #000;
    box-shadow: 0 0 0 2px rgba(0,200,255,0.5);
  }
  .divider {
    width: 1px; background: #2a2a3a;
    align-self: stretch; margin: 2px 4px;
  }
  #canvasWrap {
    flex: 1; position: relative;
    background: #0a0a14; overflow: hidden;
    touch-action: none;
  }
  #canvas2D {
    display: block; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
  }
  #statusBar {
    padding: 4px 10px; background: #1a1a2a;
    border-top: 1px solid #2a2a3a;
    font-size: 11px; font-family: monospace; color: #888;
    display: flex; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  #statusBar .statusVal { color: #ffaa44; font-weight: bold; }
  #statusBar .edgeCount { color: #44aaff; }
  #statusBar .groupCount { color: #00ffcc; }

  #extrudePanel {
    padding: 8px 10px; background: #1a1a2a;
    border-top: 1px solid #2a2a3a;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sliderRow { display: flex; align-items: center; gap: 8px; }
  .sliderRow label {
    font-size: 10px; color: #888;
    text-transform: uppercase; font-weight: bold;
    min-width: 60px; letter-spacing: .5px;
  }
  .sliderRow input[type="range"] {
    flex: 1; -webkit-appearance: none;
    height: 5px; border-radius: 3px;
    background: rgba(80,80,110,.5); outline: none;
  }
  .sliderRow input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px; border-radius: 50%;
    background: #ff8800; cursor: pointer;
    border: 2px solid #fff;
  }
  .sliderRow .val {
    font-family: monospace; font-size: 12px;
    font-weight: bold; color: #ffaa44;
    min-width: 55px; text-align: right;
  }
  .axisRow { display: flex; gap: 4px; }
  .axisRow button {
    flex: 1; height: 30px; border: none;
    border-radius: 6px; background: #2a2a3e;
    color: #aaa; font-size: 12px; font-weight: bold;
    cursor: pointer;
  }
  .axisRow button.on { background: #ff8800; color: #000; }
  #btnExtrude {
    width: 100%; height: 44px; border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #ff8800, #cc5500);
    color: #fff; font-size: 14px; font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 14px rgba(255,136,0,.4);
    transition: .15s; touch-action: manipulation;
  }
  #btnExtrude:active { transform: scale(.97); }
  #btnExtrude:disabled {
    background: #333; color: #666; box-shadow: none;
    cursor: not-allowed;
  }

  #panel3D {
    flex: 1; background: #0a0a14;
    position: relative; overflow: hidden;
  }
  #panel3D canvas { display: block; }
  #info3D {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.7); color: #fff;
    padding: 6px 12px; border-radius: 10px;
    font-size: 11px; font-family: monospace;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
  }

  #mobileTabs {
    display: none; position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a1a2a;
    border-top: 1px solid #2a2a3a;
    z-index: 100; padding: 4px; gap: 4px;
  }
  #mobileTabs button {
    flex: 1; height: 42px; border: none;
    border-radius: 8px; background: #2a2a3e;
    color: #aaa; font-size: 13px; font-weight: bold;
    cursor: pointer;
  }
  #mobileTabs button.on { background: #ff8800; color: #000; }
  @media (max-width: 768px) {
    #app { flex-direction: column; }
    #panel2D {
      flex: 1; border-right: none;
      border-bottom: 1px solid #222;
      padding-bottom: 50px;
    }
    #panel3D { flex: 0 0 40vh; }
    #mobileTabs { display: flex; }
    body.mode-2d #panel3D { display: none; }
    body.mode-2d #panel2D { flex: 1; }
    body.mode-3d #panel2D { display: none; }
    body.mode-3d #panel3D { flex: 1; padding-bottom: 50px; }
    .toolBtn { width: 38px; height: 38px; font-size: 16px; }
  }

  #hint {
    position: fixed; bottom: 60px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.9); color: #ffaa44;
    padding: 8px 16px; border-radius: 18px;
    font-size: 12px; z-index: 200;
    display: none; pointer-events: none;
    font-weight: bold;
    max-width: calc(100vw - 40px);
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  #hint.show { display: block; }

  #arcBadge, #groupBadge {
    position: fixed; top: 60px; left: 50%;
    transform: translateX(-50%);
    padding: 6px 14px; border-radius: 16px;
    font-size: 11px; font-weight: bold;
    font-family: monospace; z-index: 300;
    display: none; pointer-events: none;
  }
  #arcBadge { background: rgba(0,255,153,0.9); color: #000; box-shadow: 0 4px 16px rgba(0,255,153,0.4); }
  #groupBadge { background: rgba(0,255,204,0.9); color: #000; box-shadow: 0 4px 16px rgba(0,255,204,0.4); }
  #arcBadge.show, #groupBadge.show { display: block; }

  #gridSnapInd {
    position: fixed; bottom: 92px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,200,255,0.9); color: #000;
    padding: 4px 12px; border-radius: 12px;
    font-size: 10px; font-weight: bold;
    font-family: monospace; z-index: 200;
    display: none; pointer-events: none;
  }
  #gridSnapInd.show { display: block; }

  /* Background Image Panel */
  #bgPanel {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20,20,35,0.98);
    border: 1px solid #ffaa44;
    border-radius: 14px;
    padding: 16px;
    z-index: 400;
    display: none;
    flex-direction: column;
    gap: 12px;
    min-width: 300px;
    max-width: calc(100vw - 40px);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 50px rgba(0,0,0,0.8);
  }
  #bgPanel.show { display: flex; }
  #bgPanel .panelTitle {
    font-size: 14px;
    color: #ffaa44;
    font-weight: bold;
    text-align: center;
    padding-bottom: 8px;
    border-bottom: 1px solid #2a2a3a;
  }
  #bgPanel .panelSubtitle {
    font-size: 10px;
    color: #888;
    text-align: center;
    line-height: 1.4;
    margin-top: -6px;
  }

  #bgPanel label {
    font-size: 10px;
    color: #aaa;
    text-transform: uppercase;
    font-weight: bold;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  #bgPanel .sliderRow {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #bgPanel input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 5px;
    border-radius: 3px;
    background: rgba(80,80,110,.5);
    outline: none;
  }
  #bgPanel input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffaa44;
    cursor: pointer;
    border: 2px solid #fff;
  }
  #bgPanel .val {
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    color: #ffaa44;
    min-width: 50px;
    text-align: right;
  }

  #bgPanel button {
    height: 40px;
    border: none;
    border-radius: 8px;
    background: #2a2a3e;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    padding: 0 12px;
  }
  #bgPanel button:active { transform: scale(0.96); }
  #bgPanel button.primary {
    background: linear-gradient(90deg, #ffaa44, #cc7722);
    color: #000;
    font-size: 13px;
    height: 44px;
  }
  #bgPanel button.danger {
    background: #7a2a2a;
    color: #ffaaaa;
  }

  #bgPanel .row {
    display: flex;
    gap: 6px;
  }
  #bgPanel .row button {
    flex: 1;
  }

  #bgFileInput {
    display: none;
  }
</style>
</head>
<body class="mode-2d">

<div id="app">
  <div id="panel2D">
    <div id="toolbar2D">
      <button class="toolBtn active" data-tool="select" title="Pilih/Geser (V)">👆</button>
      <button class="toolBtn edge" id="btnEdge" data-tool="edge" title="Edge Lurus (E)">📏</button>
      <button class="toolBtn curve" id="btnCurve" data-tool="curve" title="Edge Curve (C)">🌊</button>
      <button class="toolBtn arc" id="btnArc" data-tool="arc" title="Arc (A)">🌀</button>
      <button class="toolBtn group" data-tool="group" title="Group - tarik kotak seleksi (M)">🔗</button>
      <button class="toolBtn magnetOn" id="btnMagnet" title="Magnet - snap ke grid">🧲</button>
      <button class="toolBtn bg" id="btnBg" title="Background Image - Import dari galeri">🖼️</button>
      <button class="toolBtn save" id="btnSave" title="Simpan OBJ">💾</button>

      <div class="divider"></div>

      <button class="toolBtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="toolBtn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>

      <div class="divider"></div>

      <button class="toolBtn danger" id="btnClear" title="Hapus semua">🗑️</button>
    </div>

    <div id="canvasWrap">
      <canvas id="canvas2D"></canvas>
    </div>

    <div id="statusBar">
      <span>🎯 <span class="statusVal" id="statusTool">Select</span></span>
      <span>📏 <span class="edgeCount" id="statusEdges">0 edges</span></span>
      <span>🔗 <span class="groupCount" id="statusGroups">0 shapes</span></span>
      <span id="statusHint" style="color:#ffaa44;"></span>
    </div>

    <div id="extrudePanel">
      <div class="sliderRow">
        <label>Panjang</label>
        <input type="range" id="sldLength" min="0.1" max="10" step="0.05" value="1.5">
        <span class="val" id="valLength">1.50</span>
      </div>
      <div class="sliderRow">
        <label>Skala</label>
        <input type="range" id="sldScale" min="0.1" max="5" step="0.05" value="1.0">
        <span class="val" id="valScale">1.00</span>
      </div>
      <div class="axisRow" id="axisRow">
        <button data-axis="x">↔ X</button>
        <button data-axis="y">↕ Y</button>
        <button data-axis="z" class="on">⊙ Z</button>
      </div>
      <button id="btnExtrude" disabled>⚡ EXTRUDE KE 3D</button>
    </div>
  </div>

  <div id="panel3D">
    <div id="info3D">🖱️ Drag: rotate · Scroll: zoom</div>
  </div>
</div>

<!-- Background Panel -->
<div id="bgPanel">
  <div class="panelTitle">🖼️ Background Image</div>
  <div class="panelSubtitle">Import gambar sebagai referensi trace</div>

  <div>
    <label>Gambar</label>
    <div class="row">
      <button id="bgImportBtn" class="primary" style="flex:1;">📁 Import dari Galeri</button>
    </div>
  </div>

  <div id="bgControls" style="display:none; flex-direction:column; gap:10px;">
    <div>
      <label>Opasitas</label>
      <div class="sliderRow">
        <input type="range" id="bgOpacity" min="5" max="100" step="1" value="50">
        <span class="val" id="bgOpacityVal">50%</span>
      </div>
    </div>

    <div>
      <label>Skala</label>
      <div class="sliderRow">
        <input type="range" id="bgScale" min="10" max="300" step="1" value="100">
        <span class="val" id="bgScaleVal">100%</span>
      </div>
    </div>

    <div>
      <label>Rotasi</label>
      <div class="sliderRow">
        <input type="range" id="bgRotation" min="-180" max="180" step="1" value="0">
        <span class="val" id="bgRotationVal">0°</span>
      </div>
    </div>

    <div class="row">
      <button id="bgCenterBtn">🎯 Center</button>
      <button id="bgFitBtn">🔍 Fit</button>
    </div>
    <div class="row">
      <button id="bgResetBtn">↺ Reset</button>
      <button id="bgRemoveBtn" class="danger">🗑️ Hapus</button>
    </div>
  </div>

  <button id="bgCloseBtn" style="background:#333; color:#aaa;">✕ Tutup</button>
</div>

<input type="file" id="bgFileInput" accept="image/*">

<div id="mobileTabs">
  <button data-tab="2d" class="on">✏️ 2D</button>
  <button data-tab="3d">🎨 3D</button>
</div>

<div id="arcBadge">🌀 Tap AWAL</div>
<div id="gridSnapInd">📐 GRID SNAP ON</div>
<div id="groupBadge">🔗 Tarik kotak seleksi</div>

<div id="hint"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const state = {
  tool: 'select',
  edges: [],
  groups: [],
  nextEdgeId: 1,
  nextGroupId: 1,

  currentEdgeDrawing: null,
  activePointerId: null,
  pointerCurrentPos: null,
  isPointerDown: false,
  snapPoint: null,

  cursorOffsetY: 0,

  draggingEdgeIdx: -1,
  draggingEdgeTarget: null,

  groupActive: false,
  groupStart: null,
  groupCurrent: null,
  groupPointerId: null,

  arcState: null,

  snapGrid: true,
  magnetSnap: true,
  vertexSnap: true,
  magnetRadius: 0.01,

  minPointDist: 0.05,
  gridSize: 0.1,
  zoom: 100,
  panX: 0, panY: 0,

  dragMode: null,
  dragStart: null,

  history: [],
  future: [],
  historyIndex: -1,

  previewDirty: true,

  activePointers: new Map(),
  isMultiTouch: false,
  suppressInputs: false,
  gestureState: null,

  bg: {
    image: null,
    loaded: false,
    opacity: 0.5,
    scale: 1.0,
    rotation: 0,
    offsetX: 0,
    offsetY: 0,
    dragMode: null,
    dragStart: null
  },
  bgDragActive: false,
};

// ═══════════════════════════════════════════════════════════════
// HINT
// ═══════════════════════════════════════════════════════════════
const hintEl = document.getElementById('hint');
const statusHint = document.getElementById('statusHint');
const arcBadge = document.getElementById('arcBadge');
const gridSnapInd = document.getElementById('gridSnapInd');
const groupBadge = document.getElementById('groupBadge');
const bgPanel = document.getElementById('bgPanel');
let hintTimer = null;
function flashHint(msg, ms = 2200) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
  if (hintTimer) clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), ms);
}

function showGridSnapIndicator() {
  if (state.magnetSnap) {
    gridSnapInd.textContent = '📐 GRID SNAP ON';
    gridSnapInd.style.background = 'rgba(0,200,255,0.9)';
  } else {
    gridSnapInd.textContent = '📐 GRID SNAP OFF';
    gridSnapInd.style.background = 'rgba(120,120,120,0.9)';
  }
  gridSnapInd.classList.add('show');
  setTimeout(() => gridSnapInd.classList.remove('show'), 900);
}

function updateArcBadge() {
  if (state.tool !== 'arc') { arcBadge.classList.remove('show'); return; }
  if (!state.arcState || state.arcState.stage === 'idle') {
    arcBadge.textContent = '🌀 Tap AWAL';
    arcBadge.classList.add('show');
  } else if (state.arcState.stage === 'start') {
    arcBadge.textContent = '🌀 Tap AKHIR';
    arcBadge.classList.add('show');
  } else if (state.arcState.stage === 'end') {
    arcBadge.textContent = '🌀 Geser untuk lengkung';
    arcBadge.classList.add('show');
  } else if (state.arcState.stage === 'bulge') {
    const b = state.arcState.bulge || 0;
    arcBadge.textContent = `🌀 ${b.toFixed(2)}m · tap selesai`;
    arcBadge.classList.add('show');
  }
}

function updateGroupBadge() {
  if (state.tool !== 'group') { groupBadge.classList.remove('show'); return; }
  if (!state.groupActive) {
    groupBadge.textContent = '🔗 Tarik kotak seleksi';
    groupBadge.classList.add('show');
  } else {
    groupBadge.textContent = '🔗 Tarik untuk seleksi';
    groupBadge.classList.add('show');
  }
}

// ═══════════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('canvas2D');
const ctx = canvas.getContext('2d');
let canvasRect = null;

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const r = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio, 2);
  canvas.width = Math.max(1, r.width * dpr);
  canvas.height = Math.max(1, r.height * dpr);
  canvas.style.width = r.width + 'px';
  canvas.style.height = r.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvasRect = canvas.getBoundingClientRect();

  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  state.cursorOffsetY = isTouch ? -80 : 0;

  draw2D();
}

function pointerToWorld(sx, sy) {
  const offsetSy = sy + state.cursorOffsetY;
  return screenToWorld(sx, offsetSy);
}

function screenToWorld(sx, sy) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;
  const lx = sx - canvasRect.left;
  const ly = sy - canvasRect.top;
  return {
    x: (lx - cw / 2 - state.panX) / state.zoom,
    y: -(ly - ch / 2 - state.panY) / state.zoom
  };
}
function worldToScreen(wx, wy) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;
  return {
    x: cw / 2 + state.panX + wx * state.zoom,
    y: ch / 2 + state.panY - wy * state.zoom
  };
}
function snapToGrid(v) {
  return Math.round(v / state.gridSize) * state.gridSize;
}

function cancelAllInputs() {
  state.draggingEdgeIdx = -1;
  state.draggingEdgeTarget = null;
  state.dragStartPos = null;
  state.groupActive = false;
  state.groupStart = null;
  state.groupCurrent = null;
  state.groupPointerId = null;
  state.dragMode = null;
  state.dragStart = null;
  state.activePointerId = null;
  state.isPointerDown = false;
  state.pointerCurrentPos = null;
  state.snapPoint = null;
  state.bgDragActive = false;
  state.bg.dragMode = null;
  if (state.arcState && state.arcState.stage === 'bulge') {
    state.arcState.stage = 'end';
  }
  updateGroupBadge();
}

// ═══════════════════════════════════════════════════════════════
// ARC MATH
// ═══════════════════════════════════════════════════════════════
function circumcircle(p1, p2, p3) {
  const ax = p1.x, ay = p1.y;
  const bx = p2.x, by = p2.y;
  const cx = p3.x, cy = p3.y;
  const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  if (Math.abs(d) < 1e-9) return null;
  const ux = ((ax*ax + ay*ay) * (by - cy) + (bx*bx + by*by) * (cy - ay) + (cx*cx + cy*cy) * (ay - by)) / d;
  const uy = ((ax*ax + ay*ay) * (cx - bx) + (bx*bx + by*by) * (ax - cx) + (cx*cx + cy*cy) * (bx - ax)) / d;
  const r = Math.hypot(ax - ux, ay - uy);
  return { cx: ux, cy: uy, r };
}

function makeArc3Points(p1, p2, p3, segments = 32) {
  const circ = circumcircle(p1, p2, p3);
  if (!circ) return [p1, p3];
  const { cx, cy, r } = circ;
  const a1 = Math.atan2(p1.y - cy, p1.x - cx);
  const a2 = Math.atan2(p2.y - cy, p2.x - cx);
  const a3 = Math.atan2(p3.y - cy, p3.x - cx);
  function normAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  const da2 = normAngle(a2 - a1);
  const da3 = normAngle(a3 - a1);
  let startA = a1;
  let endA = a1 + da3;
  const da3norm = normAngle(da3);
  let inBetween;
  if (da3norm >= 0) inBetween = (da2 >= 0 && da2 <= da3norm);
  else inBetween = (da2 <= 0 && da2 >= da3norm);
  if (!inBetween) {
    if (da3norm >= 0) endA = a1 + da3norm - Math.PI * 2;
    else endA = a1 + da3norm + Math.PI * 2;
  }
  const result = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const a = startA + (endA - startA) * t;
    result.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }
  return result;
}

function makeArcWithBulge(p1, p2, bulge, segments = 32) {
  const mx = (p1.x + p2.x) / 2;
  const my = (p1.y + p2.y) / 2;
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  const chordLen = Math.hypot(dx, dy);
  if (chordLen < 1e-9) return [p1, p2];
  const nx = -dy / chordLen;
  const ny = dx / chordLen;
  const midPt = { x: mx + nx * bulge, y: my + ny * bulge };
  return makeArc3Points(p1, midPt, p2, segments);
}

function cubicBezier(p0, cp1, cp2, p1, t) {
  const mt = 1 - t;
  const a = mt*mt*mt, b = 3*mt*mt*t, c = 3*mt*t*t, d = t*t*t;
  return {
    x: a*p0.x + b*cp1.x + c*cp2.x + d*p1.x,
    y: a*p0.y + b*cp1.y + c*cp2.y + d*p1.y
  };
}

function updateEdgeHandles(edge) {
  const pts = edge.points;
  const n = pts.length;
  const closed = edge.closed;
  const f = 0.25;
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    if (p.corner) {
      p.cpIn = { x: p.x, y: p.y };
      p.cpOut = { x: p.x, y: p.y };
      continue;
    }
    let prev, next;
    if (closed) {
      prev = pts[(i - 1 + n) % n];
      next = pts[(i + 1) % n];
    } else {
      prev = pts[Math.max(0, i - 1)];
      next = pts[Math.min(n - 1, i + 1)];
    }
    if (!closed && i === 0) {
      const dx = next.x - p.x, dy = next.y - p.y;
      p.cpIn = { x: p.x, y: p.y };
      p.cpOut = { x: p.x + dx * f, y: p.y + dy * f };
    } else if (!closed && i === n - 1) {
      const dx = p.x - prev.x, dy = p.y - prev.y;
      p.cpIn = { x: p.x - dx * f, y: p.y - dy * f };
      p.cpOut = { x: p.x, y: p.y };
    } else {
      const dx = next.x - prev.x, dy = next.y - prev.y;
      p.cpIn  = { x: p.x - dx * f, y: p.y - dy * f };
      p.cpOut = { x: p.x + dx * f, y: p.y + dy * f };
    }
  }
}

function sampleEdgePath(edge, samplesPerSegment = 20) {
  const pts = edge.points;
  if (pts.length < 2) return pts.map(p => ({ x: p.x, y: p.y }));
  if (edge.isArc && edge.arcBulge !== undefined) {
    return makeArcWithBulge(pts[0], pts[1], edge.arcBulge, samplesPerSegment * 2);
  }
  const result = [];
  const n = pts.length;
  const closed = edge.closed;
  const limit = closed ? n : n - 1;
  for (let i = 0; i < limit; i++) {
    const p0 = pts[i];
    const p1 = pts[(i + 1) % n];
    const isCurve = !p0.corner || !p1.corner;
    if (!isCurve) {
      if (i === 0) result.push({ x: p0.x, y: p0.y });
      result.push({ x: p1.x, y: p1.y });
    } else {
      const cp1 = p0.cpOut || p0;
      const cp2 = p1.cpIn || p1;
      if (i === 0) result.push({ x: p0.x, y: p0.y });
      for (let s = 1; s <= samplesPerSegment; s++) {
        const t = s / samplesPerSegment;
        result.push(cubicBezier(p0, cp1, cp2, p1, t));
      }
    }
  }
  return result;
}

function findSnapPoint(wx, wy, excludeEdge = null) {
  const r2 = state.magnetRadius * state.magnetRadius;
  let best = null, bestD = r2;
  for (const edge of state.edges) {
    if (edge === excludeEdge) continue;
    const n = edge.points.length;
    if (n === 0) continue;
    let endpoints;
    if (edge.isArc && n >= 2) {
      endpoints = [edge.points[0], edge.points[1]];
    } else if (edge.closed) {
      endpoints = edge.points;
    } else {
      endpoints = [edge.points[0], edge.points[n - 1]];
    }
    for (const p of endpoints) {
      const d = (p.x - wx) ** 2 + (p.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = { x: p.x, y: p.y, type: 'vertex' }; }
    }
  }
  if (state.currentEdgeDrawing) {
    for (const p of state.currentEdgeDrawing.points) {
      const d = (p.x - wx) ** 2 + (p.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = { x: p.x, y: p.y, type: 'vertex' }; }
    }
  }
  if (state.arcState) {
    if (state.arcState.startPt) {
      const d = (state.arcState.startPt.x - wx) ** 2 + (state.arcState.startPt.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = { x: state.arcState.startPt.x, y: state.arcState.startPt.y, type: 'vertex' }; }
    }
  }
  if (best) return best;
  if (state.magnetSnap) return { x: snapToGrid(wx), y: snapToGrid(wy), type: 'grid' };
  return { x: wx, y: wy, type: 'free' };
}

function pointInRect(px, py, rect) {
  const minX = Math.min(rect.x1, rect.x2);
  const maxX = Math.max(rect.x1, rect.x2);
  const minY = Math.min(rect.y1, rect.y2);
  const maxY = Math.max(rect.y1, rect.y2);
  return px >= minX && px <= maxX && py >= minY && py <= maxY;
}
function isEdgeInRect(edge, rect) {
  const sampled = sampleEdgePath(edge, 12);
  for (const p of sampled) {
    if (pointInRect(p.x, p.y, rect)) return true;
  }
  return false;
}

function pointsEqual(p1, p2, tol) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y) < tol;
}
function findConnectedEdges(startEdgeId, allEdges, tol = 0.15) {
  const visited = new Set();
  const queue = [startEdgeId];
  const result = [];
  while (queue.length > 0) {
    const eid = queue.shift();
    if (visited.has(eid)) continue;
    visited.add(eid);
    const edge = allEdges.find(e => e.id === eid);
    if (!edge) continue;
    result.push(edge);
    const n = edge.points.length;
    if (n < 2) continue;
    let startPt, endPt;
    if (edge.isArc && n >= 2) {
      startPt = edge.points[0]; endPt = edge.points[1];
    } else {
      startPt = edge.points[0]; endPt = edge.points[n - 1];
    }
    for (const other of allEdges) {
      if (visited.has(other.id)) continue;
      if (other.points.length < 2) continue;
      let oStart, oEnd;
      if (other.isArc && other.points.length >= 2) {
        oStart = other.points[0]; oEnd = other.points[1];
      } else {
        oStart = other.points[0]; oEnd = other.points[other.points.length - 1];
      }
      if (pointsEqual(startPt, oStart, tol) || pointsEqual(startPt, oEnd, tol) ||
          pointsEqual(endPt, oStart, tol) || pointsEqual(endPt, oEnd, tol)) {
        queue.push(other.id);
      }
    }
  }
  return result;
}

function buildPolygonFromEdges(edges, tol = 0.15) {
  if (edges.length === 0) return null;
  if (edges.length === 1 && edges[0].closed) return sampleEdgePath(edges[0], 24);

  function keyOf(p) {
    const scale = 1 / Math.max(tol, 0.01);
    return `${Math.round(p.x * scale)},${Math.round(p.y * scale)}`;
  }

  const pointMap = new Map();
  for (const edge of edges) {
    const pts = edge.points;
    if (pts.length < 2) continue;
    let kStart, kEnd;
    if (edge.isArc && pts.length >= 2) {
      kStart = keyOf(pts[0]); kEnd = keyOf(pts[1]);
    } else {
      kStart = keyOf(pts[0]); kEnd = keyOf(pts[pts.length - 1]);
    }
    if (!pointMap.has(kStart)) pointMap.set(kStart, []);
    if (!pointMap.has(kEnd)) pointMap.set(kEnd, []);
    pointMap.get(kStart).push({ edge, end: 'start' });
    pointMap.get(kEnd).push({ edge, end: 'end' });
  }

  let startEntry = null;
  for (const [k, list] of pointMap) {
    if (list.length === 1) { startEntry = list[0]; break; }
  }
  if (!startEntry) startEntry = { edge: edges[0], end: 'start' };

  const usedEdges = new Set();
  const orderedPoints = [];
  let currentEdge = startEntry.edge;
  let currentEnd = startEntry.end;

  while (currentEdge && !usedEdges.has(currentEdge.id)) {
    usedEdges.add(currentEdge.id);
    let pts = sampleEdgePath(currentEdge, 20);
    if (currentEnd === 'end') pts = pts.slice().reverse();
    if (orderedPoints.length === 0) {
      for (const p of pts) orderedPoints.push(p);
    } else {
      for (let i = 1; i < pts.length; i++) orderedPoints.push(pts[i]);
    }
    const lastPt = pts[pts.length - 1];
    const kLast = keyOf(lastPt);
    const candidates = pointMap.get(kLast) || [];
    let next = null;
    for (const c of candidates) {
      if (c.edge.id === currentEdge.id) continue;
      if (usedEdges.has(c.edge.id)) continue;
      next = c; break;
    }
    if (!next) break;
    currentEdge = next.edge;
    currentEnd = next.end;
  }

  const cleaned = [];
  for (let i = 0; i < orderedPoints.length; i++) {
    const p = orderedPoints[i];
    if (cleaned.length === 0) { cleaned.push(p); continue; }
    const last = cleaned[cleaned.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) > 0.001) cleaned.push(p);
  }
  if (cleaned.length > 2) {
    const first = cleaned[0];
    const last = cleaned[cleaned.length - 1];
    if (Math.hypot(first.x - last.x, first.y - last.y) < tol) cleaned.pop();
  }
  return cleaned.length >= 3 ? cleaned : null;
}

function applyBoxGroup(rect) {
  if (!rect) { resetGroup(); return; }
  const dx = Math.abs(rect.x2 - rect.x1);
  const dy = Math.abs(rect.y2 - rect.y1);
  if (dx < 0.05 && dy < 0.05) {
    flashHint('⚠️ Kotak terlalu kecil');
    resetGroup();
    return;
  }
  const edgesInBox = state.edges.filter(e => isEdgeInRect(e, rect));
  if (edgesInBox.length === 0) {
    flashHint('⚠️ Tidak ada edge di dalam kotak');
    resetGroup();
    return;
  }
  const selectedIds = new Set(edgesInBox.map(e => e.id));
  const affectedGroupIds = new Set();
  for (const e of edgesInBox) {
    if (e.groupId !== null && e.groupId !== undefined) affectedGroupIds.add(e.groupId);
  }
  state.groups = state.groups.filter(g => {
    if (affectedGroupIds.has(g.id)) {
      for (const eid of g.edgeIds) {
        const e = state.edges.find(x => x.id === eid);
        if (e) e.groupId = null;
      }
      return false;
    }
    return true;
  });
  const remaining = new Set(edgesInBox.map(e => e.id));
  const newGroupIds = [];
  const failedChains = [];
  while (remaining.size > 0) {
    const startId = remaining.values().next().value;
    const chain = findConnectedEdges(startId, state.edges);
    const chainInBox = chain.filter(e => selectedIds.has(e.id));
    if (chainInBox.length === 0) { remaining.delete(startId); continue; }
    chainInBox.forEach(e => remaining.delete(e.id));
    let polygon = buildPolygonFromEdges(chainInBox, 0.15);
    if (!polygon) polygon = buildPolygonFromEdges(chainInBox, 0.30);
    if (!polygon) polygon = buildPolygonFromEdges(chainInBox, 0.50);
    if (polygon && polygon.length >= 3) {
      const grp = { id: state.nextGroupId++, edgeIds: chainInBox.map(e => e.id), polygon };
      for (const edge of chainInBox) edge.groupId = grp.id;
      state.groups.push(grp);
      newGroupIds.push(grp.id);
    } else {
      for (const edge of chainInBox) edge.groupId = null;
      failedChains.push(chainInBox.length);
    }
  }
  pushHistory(); updateStatus(); draw2D();
  if (newGroupIds.length > 0) flashHint(`✅ ${newGroupIds.length} shape dibuat. Tap EXTRUDE!`, 3000);
  else {
    const totalEdges = failedChains.reduce((a,b)=>a+b, 0);
    flashHint(`⚠️ ${totalEdges} edge tidak membentuk loop tertutup.`, 3500);
  }
  resetGroup();
}

function resetGroup() {
  state.groupActive = false;
  state.groupStart = null;
  state.groupCurrent = null;
  state.groupPointerId = null;
  updateGroupBadge();
  draw2D();
}

// ═══════════════════════════════════════════════════════════════
// BACKGROUND IMAGE
// ═══════════════════════════════════════════════════════════════
function drawBackgroundImage() {
  const bg = state.bg;
  if (!bg.loaded || !bg.image) return;

  const img = bg.image;
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;

  const center = worldToScreen(bg.offsetX, bg.offsetY);

  const baseWorldWidth = 3.0;
  const ratio = ih / iw;
  const worldWidth = baseWorldWidth * bg.scale;
  const worldHeight = worldWidth * ratio;

  const screenW = worldWidth * state.zoom;
  const screenH = worldHeight * state.zoom;

  ctx.save();
  ctx.globalAlpha = bg.opacity;
  ctx.translate(center.x, center.y);
  ctx.rotate(bg.rotation);
  ctx.drawImage(img, -screenW / 2, -screenH / 2, screenW, screenH);
  ctx.restore();

  if (state.bgDragActive || bg.dragMode) {
    drawBgFrame(center, screenW, screenH, bg.rotation);
  }
}

function drawBgFrame(center, screenW, screenH, rotation) {
  ctx.save();
  ctx.translate(center.x, center.y);
  ctx.rotate(rotation);

  ctx.strokeStyle = 'rgba(255,170,68,0.9)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.strokeRect(-screenW/2, -screenH/2, screenW, screenH);
  ctx.setLineDash([]);

  const cornerSize = 12;
  const corners = [
    { x: -screenW/2, y: -screenH/2, id: 'tl' },
    { x: screenW/2, y: -screenH/2, id: 'tr' },
    { x: -screenW/2, y: screenH/2, id: 'bl' },
    { x: screenW/2, y: screenH/2, id: 'br' }
  ];
  ctx.fillStyle = '#ffaa44';
  for (const c of corners) {
    ctx.fillRect(c.x - cornerSize/2, c.y - cornerSize/2, cornerSize, cornerSize);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x - cornerSize/2, c.y - cornerSize/2, cornerSize, cornerSize);
  }

  ctx.fillStyle = '#44aaff';
  ctx.beginPath();
  ctx.arc(0, -screenH/2 - 30, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(68,170,255,0.7)';
  ctx.beginPath();
  ctx.moveTo(0, -screenH/2);
  ctx.lineTo(0, -screenH/2 - 30);
  ctx.stroke();

  ctx.restore();
}

function hitTestBg(sx, sy) {
  const bg = state.bg;
  if (!bg.loaded || !bg.image) return null;

  const img = bg.image;
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  const baseWorldWidth = 3.0;
  const ratio = ih / iw;
  const worldWidth = baseWorldWidth * bg.scale;
  const worldHeight = worldWidth * ratio;
  const screenW = worldWidth * state.zoom;
  const screenH = worldHeight * state.zoom;
  const center = worldToScreen(bg.offsetX, bg.offsetY);

  const dx = sx - center.x;
  const dy = sy - center.y;
  const cos = Math.cos(-bg.rotation);
  const sin = Math.sin(-bg.rotation);
  const lx = dx * cos - dy * sin;
  const ly = dx * sin + dy * cos;

  const rotDist = Math.hypot(lx - 0, ly - (-screenH/2 - 30));
  if (rotDist < 20) return { type: 'rotate' };

  const cornerSize = 20;
  const corners = [
    { x: -screenW/2, y: -screenH/2, id: 'tl' },
    { x: screenW/2, y: -screenH/2, id: 'tr' },
    { x: -screenW/2, y: screenH/2, id: 'bl' },
    { x: screenW/2, y: screenH/2, id: 'br' }
  ];
  for (const c of corners) {
    if (Math.hypot(lx - c.x, ly - c.y) < cornerSize) {
      return { type: 'resize', corner: c.id };
    }
  }

  if (Math.abs(lx) <= screenW/2 && Math.abs(ly) <= screenH/2) {
    return { type: 'move' };
  }

  return null;
}

// ═══════════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════════
function draw2D() {
  const dpr = Math.min(window.devicePixelRatio, 2);
  const cw = canvas.width / dpr;
  const ch = canvas.height / dpr;

  ctx.fillStyle = '#0a0a14';
  ctx.fillRect(0, 0, cw, ch);

  drawBackgroundImage();

  const gridStep = state.gridSize * state.zoom;
  const origin = worldToScreen(0, 0);

  ctx.strokeStyle = state.bg.loaded ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  if (gridStep > 4) {
    let sx = origin.x % gridStep;
    for (let x = sx; x < cw; x += gridStep) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
    }
    let sy = origin.y % gridStep;
    for (let y = sy; y < ch; y += gridStep) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }
  }
  if (state.magnetSnap) {
    ctx.strokeStyle = 'rgba(0,200,255,0.06)';
    ctx.lineWidth = 1;
    let sx = origin.x % gridStep;
    for (let x = sx; x < cw; x += gridStep) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
    }
    let sy = origin.y % gridStep;
    for (let y = sy; y < ch; y += gridStep) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }
  }

  ctx.strokeStyle = 'rgba(255,136,0,0.15)';
  const major = 1.0 * state.zoom;
  if (major > 20) {
    let sx = origin.x % major;
    for (let x = sx; x < cw; x += major) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ch); ctx.stroke();
    }
    let sy = origin.y % major;
    for (let y = sy; y < ch; y += major) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255,136,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, origin.y); ctx.lineTo(cw, origin.y);
  ctx.moveTo(origin.x, 0); ctx.lineTo(origin.x, ch);
  ctx.stroke();
  ctx.fillStyle = '#ff8800';
  ctx.beginPath();
  ctx.arc(origin.x, origin.y, 3, 0, Math.PI * 2);
  ctx.fill();

  for (const group of state.groups) drawGroup(group);
  for (const edge of state.edges) drawEdge(edge);
  if (state.currentEdgeDrawing) drawCurrentEdge();
  if (state.arcState) drawArcPreview();

  if (state.groupActive && state.groupStart && state.groupCurrent) {
    drawBoxSelection();
  }

  if ((state.tool === 'edge' || state.tool === 'curve') 
      && state.isPointerDown && state.pointerCurrentPos) {
    drawPlusCursor(state.pointerCurrentPos, state.snapPoint, state.tool);
  }
  if (state.tool === 'arc' && state.isPointerDown && state.pointerCurrentPos 
      && state.arcState && (state.arcState.stage === 'idle' || state.arcState.stage === 'start')) {
    drawPlusCursor(state.pointerCurrentPos, state.snapPoint, 'arc');
  }
}

function drawBoxSelection() {
  const rect = {
    x1: state.groupStart.x, y1: state.groupStart.y,
    x2: state.groupCurrent.x, y2: state.groupCurrent.y
  };
  const p1 = worldToScreen(rect.x1, rect.y1);
  const p2 = worldToScreen(rect.x2, rect.y2);
  const minX = Math.min(p1.x, p2.x);
  const minY = Math.min(p1.y, p2.y);
  const w = Math.abs(p2.x - p1.x);
  const h = Math.abs(p2.y - p1.y);

  ctx.save();
  ctx.fillStyle = 'rgba(0,255,204,0.10)';
  ctx.fillRect(minX, minY, w, h);
  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.strokeRect(minX, minY, w, h);
  ctx.setLineDash([]);
  const cornerSize = 6;
  const corners = [
    { x: minX, y: minY }, { x: minX + w, y: minY },
    { x: minX, y: minY + h }, { x: minX + w, y: minY + h }
  ];
  ctx.fillStyle = '#00ffcc';
  for (const c of corners) {
    ctx.fillRect(c.x - cornerSize/2, c.y - cornerSize/2, cornerSize, cornerSize);
  }
  ctx.restore();
}

function drawPlusCursor(pos, snap, toolType) {
  const sp = worldToScreen(pos.x, pos.y);
  const isSnap = snap && snap.type === 'vertex';
  const isGrid = snap && snap.type === 'grid';
  const snapPos = snap ? worldToScreen(snap.x, snap.y) : sp;
  const drawAt = (isSnap || isGrid) ? snapPos : sp;

  ctx.save();
  const fingerScreenY = sp.y - state.cursorOffsetY;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  ctx.beginPath();
  ctx.moveTo(sp.x, sp.y);
  ctx.lineTo(sp.x, fingerScreenY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.arc(sp.x, fingerScreenY, 3, 0, Math.PI * 2);
  ctx.fill();

  let color = '#ffaa44';
  if (toolType === 'curve') color = '#cc66ff';
  if (toolType === 'arc') color = '#00ff99';
  if (isSnap) color = '#00ffcc';
  if (isGrid) color = '#00c8ff';

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  const arm = 16;
  ctx.beginPath();
  ctx.moveTo(drawAt.x - arm, drawAt.y); ctx.lineTo(drawAt.x + arm, drawAt.y);
  ctx.moveTo(drawAt.x, drawAt.y - arm); ctx.lineTo(drawAt.x, drawAt.y + arm);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(drawAt.x, drawAt.y, 10, 0, Math.PI * 2);
  ctx.lineWidth = 2;
  ctx.stroke();

  if (isSnap) {
    ctx.fillStyle = 'rgba(0,255,204,0.95)';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('SNAP', drawAt.x + 18, drawAt.y - 14);
  } else if (isGrid) {
    ctx.fillStyle = 'rgba(0,200,255,0.8)';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('GRID', drawAt.x + 16, drawAt.y - 12);
  }
  ctx.restore();
}

function drawArcPreview() {
  const arc = state.arcState;
  if (!arc) return;
  ctx.save();

  if (arc.stage === 'start' && arc.startPt) {
    if (state.isPointerDown && state.pointerCurrentPos) {
      const sp = worldToScreen(arc.startPt.x, arc.startPt.y);
      const cp = worldToScreen(state.pointerCurrentPos.x, state.pointerCurrentPos.y);
      ctx.strokeStyle = 'rgba(0,255,153,0.5)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(cp.x, cp.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
    return;
  }

  if (arc.startPt && arc.endPt) {
    const p1s = worldToScreen(arc.startPt.x, arc.startPt.y);
    const p2s = worldToScreen(arc.endPt.x, arc.endPt.y);
    const bulge = arc.bulge || 0;

    ctx.strokeStyle = 'rgba(0,255,153,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(p1s.x, p1s.y);
    ctx.lineTo(p2s.x, p2s.y);
    ctx.stroke();
    ctx.setLineDash([]);

    if (Math.abs(bulge) > 0.001) {
      const arcPts = makeArcWithBulge(arc.startPt, arc.endPt, bulge, 40);
      if (arcPts.length > 1) {
        ctx.strokeStyle = '#00ff99';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        const a0 = worldToScreen(arcPts[0].x, arcPts[0].y);
        ctx.moveTo(a0.x, a0.y);
        for (let i = 1; i < arcPts.length; i++) {
          const ap = worldToScreen(arcPts[i].x, arcPts[i].y);
          ctx.lineTo(ap.x, ap.y);
        }
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawCurrentEdge() {
  const edge = state.currentEdgeDrawing;
  if (!edge || edge.points.length === 0) return;
  ctx.save();
  const pts = edge.points;
  const sampled = sampleEdgePath(edge, 20);
  let strokeColor = '#ffaa44';
  if (edge.isCurveTool) strokeColor = '#cc66ff';
  if (sampled.length > 1) {
    ctx.beginPath();
    const p0 = worldToScreen(sampled[0].x, sampled[0].y);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < sampled.length; i++) {
      const p = worldToScreen(sampled[i].x, sampled[i].y);
      ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  if (state.isPointerDown && state.pointerCurrentPos) {
    const last = pts[pts.length - 1];
    const lp = worldToScreen(last.x, last.y);
    let targetX = state.pointerCurrentPos.x;
    let targetY = state.pointerCurrentPos.y;
    if (state.snapPoint) {
      targetX = state.snapPoint.x;
      targetY = state.snapPoint.y;
    }
    const tp = worldToScreen(targetX, targetY);
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    if (edge.isCurveTool) {
      const mx = (lp.x + tp.x) / 2;
      const my = (lp.y + tp.y) / 2;
      ctx.beginPath();
      ctx.moveTo(lp.x, lp.y);
      ctx.quadraticCurveTo(mx, my, tp.x, tp.y);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(lp.x, lp.y);
      ctx.lineTo(tp.x, tp.y);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function drawGroup(group) {
  const pts = group.polygon;
  if (!pts || pts.length < 3) return;
  ctx.save();
  ctx.beginPath();
  const p0 = worldToScreen(pts[0].x, pts[0].y);
  ctx.moveTo(p0.x, p0.y);
  for (let i = 1; i < pts.length; i++) {
    const p = worldToScreen(pts[i].x, pts[i].y);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,255,204,0.15)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,255,204,0.4)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawEdge(edge) {
  const pts = edge.points;
  if (pts.length === 0) return;

  ctx.save();
  const sampled = sampleEdgePath(edge, 24);

  if (sampled.length > 1) {
    ctx.beginPath();
    const p0 = worldToScreen(sampled[0].x, sampled[0].y);
    ctx.moveTo(p0.x, p0.y);
    for (let i = 1; i < sampled.length; i++) {
      const p = worldToScreen(sampled[i].x, sampled[i].y);
      ctx.lineTo(p.x, p.y);
    }
    if (edge.closed) ctx.closePath();

    let strokeColor = '#44aaff';
    if (edge.groupId !== null && edge.groupId !== undefined) strokeColor = '#00ccaa';
    else if (edge.isArc) strokeColor = '#00ff99';
    else if (edge.isCurveTool) strokeColor = '#9966ff';

    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// HISTORY
// ═══════════════════════════════════════════════════════════════
function snapshotState() {
  return JSON.stringify({
    edges: state.edges,
    groups: state.groups,
    currentEdgeDrawing: state.currentEdgeDrawing,
    arcState: state.arcState,
    nextEdgeId: state.nextEdgeId,
    nextGroupId: state.nextGroupId
  });
}
function restoreState(snapStr) {
  const data = JSON.parse(snapStr);
  state.edges = data.edges || [];
  state.groups = data.groups || [];
  state.currentEdgeDrawing = data.currentEdgeDrawing || null;
  state.arcState = data.arcState || null;
  state.nextEdgeId = data.nextEdgeId || 1;
  state.nextGroupId = data.nextGroupId || 1;
  state.isPointerDown = false;
  state.activePointerId = null;
  state.pointerCurrentPos = null;
}
function pushHistory() {
  state.future = [];
  const snap = snapshotState();
  state.history.push(snap);
  if (state.history.length > 200) state.history.shift();
  state.historyIndex = state.history.length - 1;
  updateHistoryButtons();
  updateExtrudeButton();
  state.previewDirty = true;
}
function undo() {
  if (state.history.length <= 1) return;
  const current = state.history.pop();
  state.future.push(current);
  const prev = state.history[state.history.length - 1];
  restoreState(prev);
  resetGroup();
  updateArcBadge();
  draw2D();
  updateStatus();
  updateHistoryButtons();
  updateExtrudeButton();
  updateEdgeButtonState();
  state.previewDirty = true;
  flashHint('↶ Undo');
}
function redo() {
  if (state.future.length === 0) return;
  const next = state.future.pop();
  state.history.push(next);
  restoreState(next);
  resetGroup();
  updateArcBadge();
  draw2D();
  updateStatus();
  updateHistoryButtons();
  updateExtrudeButton();
  updateEdgeButtonState();
  state.previewDirty = true;
  flashHint('↷ Redo');
}
function updateHistoryButtons() {
  document.getElementById('btnUndo').disabled = state.history.length <= 1;
  document.getElementById('btnRedo').disabled = state.future.length === 0;
}

// ═══════════════════════════════════════════════════════════════
// POINTER
// ═══════════════════════════════════════════════════════════════
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  canvasRect = canvas.getBoundingClientRect();
  state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY, startX: e.clientX, startY: e.clientY });

  if (state.activePointers.size >= 2) {
    state.isMultiTouch = true;
    state.suppressInputs = true;
    cancelAllInputs();
    if (state.activePointers.size === 2) {
      const pts = Array.from(state.activePointers.values());
      const [a, b] = pts;
      const midX = (a.x + b.x) / 2;
      const midY = (a.y + b.y) / 2;
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      state.gestureState = {
        startZoom: state.zoom,
        startPanX: state.panX,
        startPanY: state.panY,
        startMidX: midX,
        startMidY: midY,
        startDist: dist
      };
    }
    draw2D();
    return;
  }

  if (state.suppressInputs) return;

  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}

  if (state.bgDragActive && state.bg.loaded) {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const hit = hitTestBg(sx, sy);
    if (hit) {
      state.bg.dragMode = hit.type;
      state.bg.dragStart = {
        pointerX: sx,
        pointerY: sy,
        offsetX: state.bg.offsetX,
        offsetY: state.bg.offsetY,
        scale: state.bg.scale,
        rotation: state.bg.rotation
      };
      return;
    }
  }

  const w = pointerToWorld(e.clientX, e.clientY);

  if (state.tool === 'arc') {
    const snapPt = findSnapPoint(w.x, w.y);
    if (!state.arcState) {
      state.arcState = { stage: 'idle', startPt: null, endPt: null, bulge: 0 };
    }
    if (state.arcState.stage === 'idle') {
      state.activePointerId = e.pointerId;
      state.isPointerDown = true;
      state.pointerCurrentPos = { x: w.x, y: w.y };
      state.snapPoint = snapPt;
      draw2D();
      return;
    }
    if (state.arcState.stage === 'start') {
      state.activePointerId = e.pointerId;
      state.isPointerDown = true;
      state.pointerCurrentPos = { x: w.x, y: w.y };
      state.snapPoint = snapPt;
      draw2D();
      return;
    }
    if (state.arcState.stage === 'end') {
      state.activePointerId = e.pointerId;
      state.isPointerDown = true;
      state.pointerCurrentPos = { x: w.x, y: w.y };
      state.arcState.stage = 'bulge';
      state.snapPoint = snapPt;
      draw2D();
      return;
    }
    if (state.arcState.stage === 'bulge') {
      finishArc();
      return;
    }
    return;
  }

  if (state.tool === 'edge' || state.tool === 'curve') {
    if (!state.currentEdgeDrawing) {
      state.currentEdgeDrawing = {
        points: [],
        closed: false,
        isCurveTool: state.tool === 'curve',
        isArc: false
      };
    }
    if (state.currentEdgeDrawing.points.length >= 3) {
      const first = state.currentEdgeDrawing.points[0];
      const snapFirst = findSnapPoint(w.x, w.y, state.currentEdgeDrawing);
      if (Math.hypot(snapFirst.x - first.x, snapFirst.y - first.y) < state.magnetRadius) {
        state.currentEdgeDrawing.closed = true;
        updateEdgeHandles(state.currentEdgeDrawing);
        finishCurrentEdge();
        flashHint('🔗 Edge ditutup');
        return;
      }
    }
    state.activePointerId = e.pointerId;
    state.isPointerDown = true;
    state.pointerCurrentPos = { x: w.x, y: w.y };
    state.snapPoint = findSnapPoint(w.x, w.y, state.currentEdgeDrawing);
    draw2D();
    return;
  }

  if (state.tool === 'group') {
    state.groupActive = true;
    state.groupStart = { x: w.x, y: w.y };
    state.groupCurrent = { x: w.x, y: w.y };
    state.groupPointerId = e.pointerId;
    updateGroupBadge();
    draw2D();
    return;
  }

  if (state.tool === 'select') {
    for (const edge of state.edges) {
      const hitR = 16 / state.zoom;
      for (let i = 0; i < edge.points.length; i++) {
        const p = edge.points[i];
        if (Math.hypot(w.x - p.x, w.y - p.y) < hitR) {
          state.draggingEdgeIdx = i;
          state.draggingEdgeTarget = edge;
          return;
        }
      }
    }
    state.dragMode = 'pan';
    state.dragStart = { x: e.clientX, y: e.clientY, panX: state.panX, panY: state.panY };
    return;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.activePointers.has(e.pointerId)) return;
  state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (state.isMultiTouch && state.activePointers.size >= 2 && state.gestureState) {
    const pts = Array.from(state.activePointers.values()).slice(0, 2);
    const [a, b] = pts;
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    const zoomRatio = dist / Math.max(1, state.gestureState.startDist);
    const newZoom = Math.max(20, Math.min(500, state.gestureState.startZoom * zoomRatio));
    const dxScreen = midX - state.gestureState.startMidX;
    const dyScreen = midY - state.gestureState.startMidY;
    state.zoom = newZoom;
    state.panX = state.gestureState.startPanX + dxScreen;
    state.panY = state.gestureState.startPanY + dyScreen;
    draw2D();
    return;
  }

  if (state.suppressInputs) return;

  if (state.bg.dragMode && state.bg.dragStart) {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;
    const ds = state.bg.dragStart;

    if (state.bg.dragMode === 'move') {
      const dxS = sx - ds.pointerX;
      const dyS = sy - ds.pointerY;
      state.bg.offsetX = ds.offsetX + dxS / state.zoom;
      state.bg.offsetY = ds.offsetY - dyS / state.zoom;
    } else if (state.bg.dragMode === 'resize') {
      const center = worldToScreen(state.bg.offsetX, state.bg.offsetY);
      const dist = Math.hypot(sx - center.x, sy - center.y);
      const startDist = Math.hypot(ds.pointerX - center.x, ds.pointerY - center.y);
      if (startDist > 5) {
        const ratio = dist / startDist;
        state.bg.scale = Math.max(0.1, Math.min(5, ds.scale * ratio));
      }
    } else if (state.bg.dragMode === 'rotate') {
      const center = worldToScreen(state.bg.offsetX, state.bg.offsetY);
      const angleNow = Math.atan2(sy - center.y, sx - center.x);
      const angleStart = Math.atan2(ds.pointerY - center.y, ds.pointerX - center.x);
      state.bg.rotation = ds.rotation + (angleNow - angleStart);
    }
    syncBgPanelUI();
    draw2D();
    return;
  }

  const w = pointerToWorld(e.clientX, e.clientY);

  if (state.tool === 'group' && state.groupActive && e.pointerId === state.groupPointerId) {
    if (state.magnetSnap) {
      state.groupCurrent = { x: snapToGrid(w.x), y: snapToGrid(w.y) };
    } else {
      state.groupCurrent = { x: w.x, y: w.y };
    }
    draw2D();
    return;
  }

  if (state.tool === 'arc' && state.isPointerDown && state.activePointerId === e.pointerId) {
    state.pointerCurrentPos = { x: w.x, y: w.y };
    state.snapPoint = findSnapPoint(w.x, w.y);
    if (state.arcState && state.arcState.stage === 'bulge' && state.arcState.startPt && state.arcState.endPt) {
      const p1 = state.arcState.startPt;
      const p2 = state.arcState.endPt;
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const chordLen = Math.hypot(dx, dy);
      if (chordLen > 1e-9) {
        const nx = -dy / chordLen;
        const ny = dx / chordLen;
        const bulge = (w.x - mx) * nx + (w.y - my) * ny;
        state.arcState.bulge = bulge;
      }
    }
    updateArcBadge();
    draw2D();
    return;
  }

  if ((state.tool === 'edge' || state.tool === 'curve') && state.isPointerDown && state.activePointerId === e.pointerId) {
    state.pointerCurrentPos = { x: w.x, y: w.y };
    state.snapPoint = findSnapPoint(w.x, w.y, state.currentEdgeDrawing);
    draw2D();
    return;
  }

  if (state.draggingEdgeIdx >= 0 && state.draggingEdgeTarget) {
    const edge = state.draggingEdgeTarget;
    const pt = edge.points[state.draggingEdgeIdx];
    if (state.magnetSnap) {
      pt.x = snapToGrid(w.x);
      pt.y = snapToGrid(w.y);
    } else {
      pt.x = w.x;
      pt.y = w.y;
    }
    draw2D();
    return;
  }

  if (state.dragMode === 'pan') {
    state.panX = state.dragStart.panX + (e.clientX - state.dragStart.x);
    state.panY = state.dragStart.panY + (e.clientY - state.dragStart.y);
    draw2D();
    return;
  }
});

canvas.addEventListener('pointerup', (e) => {
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
  state.activePointers.delete(e.pointerId);

  if (state.bg.dragMode) {
    state.bg.dragMode = null;
    state.bg.dragStart = null;
    return;
  }

  if (state.isMultiTouch) {
    if (state.activePointers.size < 2) {
      state.gestureState = null;
    }
    if (state.activePointers.size === 0) {
      state.isMultiTouch = false;
      setTimeout(() => {
        if (state.activePointers.size === 0) {
          state.suppressInputs = false;
        }
      }, 100);
    }
    return;
  }

  if (state.tool === 'group' && state.groupActive && e.pointerId === state.groupPointerId) {
    const rect = {
      x1: state.groupStart.x, y1: state.groupStart.y,
      x2: state.groupCurrent.x, y2: state.groupCurrent.y
    };
    applyBoxGroup(rect);
    return;
  }

  if (state.draggingEdgeIdx >= 0 && state.draggingEdgeTarget) {
    pushHistory();
    state.draggingEdgeIdx = -1;
    state.draggingEdgeTarget = null;
    return;
  }

  if (state.tool === 'arc' && state.activePointerId === e.pointerId && state.isPointerDown) {
    const w = pointerToWorld(e.clientX, e.clientY);
    const snapPt = findSnapPoint(w.x, w.y);
    if (state.arcState.stage === 'idle') {
      state.arcState.startPt = { x: snapPt.x, y: snapPt.y };
      state.arcState.stage = 'start';
      pushHistory();
      flashHint('✓ Titik AWAL di-set');
      state.activePointerId = null;
      state.isPointerDown = false;
      state.pointerCurrentPos = { x: w.x, y: w.y };
      state.snapPoint = snapPt;
      updateArcBadge();
      draw2D();
      return;
    }
    if (state.arcState.stage === 'start') {
      const d = Math.hypot(snapPt.x - state.arcState.startPt.x, snapPt.y - state.arcState.startPt.y);
      if (d < state.minPointDist) {
        flashHint('⚠️ Terlalu dekat');
        state.activePointerId = null;
        state.isPointerDown = false;
        return;
      }
      state.arcState.endPt = { x: snapPt.x, y: snapPt.y };
      state.arcState.stage = 'end';
      state.arcState.bulge = 0;
      pushHistory();
      flashHint('✓ Titik AKHIR di-set');
      state.activePointerId = null;
      state.isPointerDown = false;
      state.pointerCurrentPos = { x: w.x, y: w.y };
      state.snapPoint = snapPt;
      updateArcBadge();
      draw2D();
      return;
    }
    if (state.arcState.stage === 'bulge') {
      state.arcState.stage = 'end';
      state.activePointerId = null;
      state.isPointerDown = false;
      updateArcBadge();
      draw2D();
      return;
    }
    state.activePointerId = null;
    state.isPointerDown = false;
    return;
  }

  if ((state.tool === 'edge' || state.tool === 'curve') && state.activePointerId === e.pointerId && state.isPointerDown) {
    const w = pointerToWorld(e.clientX, e.clientY);
    const snapPt = findSnapPoint(w.x, w.y, state.currentEdgeDrawing);
    const pts = state.currentEdgeDrawing.points;
    const last = pts[pts.length - 1];
    if (!last || Math.hypot(snapPt.x - last.x, snapPt.y - last.y) > state.minPointDist) {
      pts.push({
        x: snapPt.x,
        y: snapPt.y,
        corner: state.tool !== 'curve'
      });
      if (state.tool === 'curve') updateEdgeHandles(state.currentEdgeDrawing);
      pushHistory();
      flashHint(`✓ Titik ke-${pts.length}`);
    }
    state.activePointerId = null;
    state.isPointerDown = false;
    state.pointerCurrentPos = { x: w.x, y: w.y };
    state.snapPoint = snapPt;
    draw2D();
    updateStatus();
    updateEdgeButtonState();
    return;
  }

  state.activePointerId = null;
  state.isPointerDown = false;
  state.draggingEdgeIdx = -1;
  state.draggingEdgeTarget = null;
  if (state.dragMode === 'pan') state.dragMode = null;
});

canvas.addEventListener('pointercancel', (e) => {
  state.activePointers.delete(e.pointerId);
  if (state.activePointers.size === 0) {
    state.isMultiTouch = false;
    state.suppressInputs = false;
    state.gestureState = null;

  state.activePointerId = null;

  state.draggingEdgeTarget = null;

  state.bg.dragMode = null;

function finishArc() {
  const arc = state.arcState;
  if (!arc || !arc.startPt || !arc.endPt) {
    state.arcState = null;
    updateArcBadge();
    draw2D();
    return;
  }
  const bulge = arc.bulge || 0;
  const p1 = arc.startPt;
  const p2 = arc.endPt;
  if (Math.abs(bulge) < 0.02) {
    const edge = {
      id: state.nextEdgeId++,
      points: [
        { x: p1.x, y: p1.y, corner: true, cpIn: {x:p1.x,y:p1.y}, cpOut: {x:p1.x,y:p1.y} },
        { x: p2.x, y: p2.y, corner: true, cpIn: {x:p2.x,y:p2.y}, cpOut: {x:p2.x,y:p2.y} }
      ],
      closed: false, groupId: null,
      isArc: false, isCurveTool: false
    };
    state.edges.push(edge);
  } else {
    const edge = {
      id: state.nextEdgeId++,
      points: [
        { x: p1.x, y: p1.y },
        { x: p2.x, y: p2.y }
      ],
      closed: false, groupId: null,
      isArc: true, isCurveTool: false,
      arcBulge: bulge
    };
    state.edges.push(edge);
  }
  state.arcState = { stage: 'idle', startPt: null, endPt: null, bulge: 0 };
  state.isPointerDown = false;
  state.activePointerId = null;
  pushHistory();
  updateStatus();
  updateArcBadge();
  draw2D();
  flashHint('✅ Arc jadi');
}

function finishCurrentEdge() {
  const d = state.currentEdgeDrawing;
  if (!d) return;
  if (d.points.length < 2) {
    state.currentEdgeDrawing = null;
    state.isPointerDown = false;
    updateStatus();
    updateEdgeButtonState();
    draw2D();
    return;
  }
  const edge = {
    id: state.nextEdgeId++,
    points: d.points.map(p => ({
      x: p.x, y: p.y,
      corner: p.corner,
      cpIn: p.cpIn ? { ...p.cpIn } : { x: p.x, y: p.y },
      cpOut: p.cpOut ? { ...p.cpOut } : { x: p.x, y: p.y }
    })),
    closed: d.closed,
    groupId: null,
    isCurveTool: d.isCurveTool,
    isArc: false
  };
  state.edges.push(edge);
  state.currentEdgeDrawing = null;
  state.isPointerDown = false;
  pushHistory();
  updateStatus();
  updateEdgeButtonState();
  draw2D();
  flashHint(`✅ Edge selesai`);
}

function downloadFile(content, filename, mimeType = 'application/octet-stream') {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function timestamp() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

document.getElementById('btnSave').onclick = async () => {
  if (state.groups.length === 0) {
    flashHint('⚠️ Belum ada shape 3D. Bikin edge → Group dulu', 2500);
    return;
  }

  const length = parseFloat(document.getElementById('sldLength').value);
  const scale  = parseFloat(document.getElementById('sldScale').value);
  const axis   = document.querySelector('#axisRow .on')?.dataset.axis || 'z';

  let objContent = `# Edge Builder Export\n# ${new Date().toISOString()}\n# Groups: ${state.groups.length}\n\n`;
  let vertexOffset = 1;
  let totalVerts = 0;
  let totalFaces = 0;

  for (let g = 0; g < state.groups.length; g++) {
    const grp = state.groups[g];
    const pts = grp.polygon;
    if (!pts || pts.length < 3) continue;

    const scaledPts = pts.map(p => ({ x: p.x * scale, y: p.y * scale }));

    const s = new THREE.Shape();
    s.moveTo(scaledPts[0].x, scaledPts[0].y);
    for (let i = 1; i < scaledPts.length; i++) s.lineTo(scaledPts[i].x, scaledPts[i].y);
    s.closePath();

    const geo = new THREE.ExtrudeGeometry(s, {
      depth: length,
      bevelEnabled: false,
      curveSegments: 16,
      steps: 1
    });

    if (axis === 'x') geo.rotateY(Math.PI / 2);
    else if (axis === 'y') geo.rotateX(-Math.PI / 2);

    if (axis === 'z') geo.translate(0, 0, -length / 2);
    else if (axis === 'x') geo.translate(-length / 2, 0, 0);
    else if (axis === 'y') geo.translate(0, length / 2, 0);

    const pos = geo.attributes.position;
    const idx = geo.index;

    objContent += `# Shape ${g + 1} (${pts.length} points)\n`;
    objContent += `o Shape_${g + 1}\n`;

    for (let i = 0; i < pos.count; i++) {
      objContent += `v ${pos.getX(i).toFixed(6)} ${pos.getY(i).toFixed(6)} ${pos.getZ(i).toFixed(6)}\n`;
    }
    totalVerts += pos.count;

    if (idx) {
      for (let i = 0; i < idx.count; i += 3) {
        const a = idx.getX(i) + vertexOffset;
        const b = idx.getX(i+1) + vertexOffset;
        const c = idx.getX(i+2) + vertexOffset;
        objContent += `f ${a} ${b} ${c}\n`;
        totalFaces++;
      }
    } else {
      for (let i = 0; i < pos.count; i += 3) {
        objContent += `f ${i + vertexOffset} ${i + vertexOffset + 1} ${i + vertexOffset + 2}\n`;
        totalFaces++;
      }
    }

    vertexOffset += pos.count;
    objContent += `\n`;
    geo.dispose();
  }

  const filename = `shape3d_${timestamp()}.obj`;

  // ⭐ COBA: File System Access API (pilih folder)
  if (window.showSaveFilePicker) {
    try {
      // Buka dialog save native (user bisa pilih folder)
      const fileHandle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{
  description: 'Wavefront OBJ File',
  accept: { 'application/octet-stream': ['.obj'] }
}]
      });

      // Tulis file ke lokasi yang dipilih user
      const writable = await fileHandle.createWritable();
      await writable.write(objContent);
      await writable.close();

      flashHint(`✅ OBJ disimpan (${totalVerts}v, ${totalFaces}f) di folder pilihan`, 3000);
      return;
    } catch (err) {
      // User batal atau error → fallback ke download
      if (err.name === 'AbortError') {
        flashHint('❌ Dibatalkan', 1500);
        return;
      }
      console.warn('File System API gagal, fallback ke download:', err);
      // Lanjut ke fallback di bawah
    }
  }

  // ⭐ FALLBACK: Download biasa (kalau browser tidak support)
  downloadFile(objContent, filename, 'application/octet-stream');
  flashHint(`✅ OBJ disimpan (${totalVerts}v, ${totalFaces}f) → folder Download`, 3000);
};

function setTool(tool) {
  if (state.currentEdgeDrawing && tool !== 'edge' && tool !== 'curve') {
    finishCurrentEdge();
  }
  if (state.arcState && tool !== 'arc') state.arcState = null;
  if (state.groupActive) resetGroup();
  if (state.bgDragActive) {
    state.bgDragActive = false;
    document.getElementById('btnBg').classList.remove('active');
  }

  state.tool = tool;
  state.isPointerDown = false;
  state.pointerCurrentPos = null;
  state.snapPoint = null;

  document.querySelectorAll('#toolbar2D [data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === tool)
  );

  const names = {
    select: 'Select', edge: '📏 Edge', curve: '🌊 Curve',
    arc: '🌀 Arc', group: '🔗 Group (Box)'
  };
  document.getElementById('statusTool').textContent = names[tool] || tool;
  canvas.style.cursor = tool === 'select' ? 'default' : 'crosshair';

  updateEdgeButtonState();
  updateArcBadge();
  updateGroupBadge();

  if (tool === 'edge' || tool === 'curve') {
    statusHint.textContent = `${tool === 'curve' ? '🌊' : '📏'} Tap tahan, geser, lepas`;
  } else if (tool === 'arc') {
    statusHint.textContent = '🌀 Tap AWAL → Tap AKHIR → Geser → Tap';
    state.arcState = { stage: 'idle', startPt: null, endPt: null, bulge: 0 };
  } else if (tool === 'group') {
    statusHint.textContent = '🔗 Tap tahan & tarik kotak seleksi';
  } else {
    statusHint.textContent = '';
  }
  draw2D();
}

function updateEdgeButtonState() {
  const btnE = document.getElementById('btnEdge');
  const btnC = document.getElementById('btnCurve');
  const btnA = document.getElementById('btnArc');
  const isDrawing = state.currentEdgeDrawing && state.currentEdgeDrawing.points.length >= 2;
  const isCurve = state.currentEdgeDrawing && state.currentEdgeDrawing.isCurveTool;
  btnE.classList.remove('finishMode');
  btnC.classList.remove('finishMode');
  btnA.classList.remove('finishMode');
  btnE.textContent = '📏';
  btnC.textContent = '🌊';
  btnA.textContent = '🌀';
  if (isDrawing) {
    if (isCurve) { btnC.classList.add('finishMode'); btnC.textContent = '✓'; }
    else { btnE.classList.add('finishMode'); btnE.textContent = '✓'; }
  }
  if (state.tool === 'arc' && state.arcState && state.arcState.stage !== 'idle') {
    btnA.classList.add('finishMode');
    btnA.textContent = '✓';
  }
}

document.querySelectorAll('#toolbar2D [data-tool]').forEach(btn => {
  btn.onclick = () => {
    const tool = btn.dataset.tool;
    if (tool === state.tool && (tool === 'edge' || tool === 'curve')) {
      if (state.currentEdgeDrawing && state.currentEdgeDrawing.points.length >= 2) {
        finishCurrentEdge();

        state.currentEdgeDrawing = null;

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'v') setTool('select');
  else if (k === 'e') setTool('edge');
  else if (k === 'c') setTool('curve');
  else if (k === 'a') setTool('arc');
  else if (k === 'm') setTool('group');
  else if (k === 'escape') {
    if (bgPanel.classList.contains('show')) bgPanel.classList.remove('show');
    if (state.currentEdgeDrawing) {
      state.currentEdgeDrawing = null;
      state.isPointerDown = false;
      updateEdgeButtonState();
      draw2D();
      updateStatus();
    } else if (state.arcState) {
      state.arcState = null;
      updateArcBadge();
      draw2D();
    } else if (state.groupActive) resetGroup();
  }
  else if (k === 'enter') {
    if (state.currentEdgeDrawing) finishCurrentEdge();
    else if (state.arcState && state.arcState.stage !== 'idle') finishArc();
  }
  else if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); }
  else if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
});

const target = new THREE.Vector3(0, 0.5, 0);
const sphere = new THREE.Spherical();
{
  const off = camera.position.clone().sub(target);
  sphere.setFromVector3(off);
}

const activePointers3D = new Map();
let orbitState = null;

function refreshCamera() {
  const off = new THREE.Vector3().setFromSpherical(sphere);
  camera.position.copy(target).add(off);
  camera.lookAt(target);
}
function startSingle(x, y) {
  orbitState = { type: 'single', theta: sphere.theta, phi: sphere.phi, radius: sphere.radius, startX: x, startY: y };
}
function updateSingle(x, y) {
  if (!orbitState || orbitState.type !== 'single') return;
  const dx = x - orbitState.startX;
  const dy = y - orbitState.startY;
  const sp = 0.006;
  sphere.theta = orbitState.theta - dx * sp;
  sphere.phi = Math.max(0.05, Math.min(Math.PI - 0.05, orbitState.phi - dy * sp));
  sphere.radius = orbitState.radius;
  refreshCamera();
  requestRender();
}
function startTwo() {
  const pts = Array.from(activePointers3D.values());
  if (pts.length < 2) return;
  const [a, b] = pts;
  const camRight = new THREE.Vector3();
  const camUp = new THREE.Vector3();
  camera.matrixWorld.extractBasis(camRight, camUp, new THREE.Vector3());
  orbitState = {
    type: 'two', theta: sphere.theta, phi: sphere.phi, radius: sphere.radius,
    startMidX: (a.x + b.x) / 2, startMidY: (a.y + b.y) / 2,
    startDist: Math.hypot(a.x - b.x, a.y - b.y),
    startTarget: target.clone(),
    camRight: camRight.clone(), camUp: camUp.clone()
  };
}
function updateTwo() {
  if (!orbitState || orbitState.type !== 'two') return;
  const pts = Array.from(activePointers3D.values());
  if (pts.length < 2) return;
  const [a, b] = pts;
  const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  const dx = midX - orbitState.startMidX;
  const dy = midY - orbitState.startMidY;
  const panScale = orbitState.radius * 0.0018;
  const panOff = new THREE.Vector3();
  panOff.addScaledVector(orbitState.camRight, -dx * panScale);
  panOff.addScaledVector(orbitState.camUp, dy * panScale);
  target.copy(orbitState.startTarget).add(panOff);
  const scale = orbitState.startDist / Math.max(1, dist);
  sphere.radius = Math.max(1.5, Math.min(80, orbitState.radius * scale));
  sphere.theta = orbitState.theta;
  sphere.phi = orbitState.phi;
  refreshCamera();
  requestRender();
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button === 2) return;
  activePointers3D.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers3D.size === 2) startTwo();
  else if (activePointers3D.size === 1) startSingle(e.clientX, e.clientY);
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch(err) {}
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!activePointers3D.has(e.pointerId)) return;
  activePointers3D.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activePointers3D.size >= 2) updateTwo();
  else updateSingle(e.clientX, e.clientY);
});
function releasePointer(e) {
  activePointers3D.delete(e.pointerId);
  if (activePointers3D.size < 2) {
    if (activePointers3D.size === 1) {
      const p = Array.from(activePointers3D.values())[0];
      startSingle(p.x, p.y);
    } else orbitState = null;
  }
}
renderer.domElement.addEventListener('pointerup', releasePointer);
renderer.domElement.addEventListener('pointercancel', releasePointer);
renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = 1 + e.deltaY * 0.0015;
  sphere.radius = Math.max(1.5, Math.min(80, sphere.radius * f));
  refreshCamera();
  requestRender();
}, { passive: false });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

let previewGroup = null;

function buildPreviewGroup() {
  const length = parseFloat(document.getElementById('sldLength').value);
  const scale  = parseFloat(document.getElementById('sldScale').value);
  const axis   = document.querySelector('#axisRow .on')?.dataset.axis || 'z';
  if (state.groups.length === 0) return null;
  const group = new THREE.Group();
  const material = new THREE.MeshStandardMaterial({
    color: 0xeeeeee, roughness: 0.4, metalness: 0.08, side: THREE.DoubleSide
  });
  const extrudeSettings = { depth: length, bevelEnabled: false, curveSegments: 16, steps: 1 };
  for (const grp of state.groups) {
    const pts = grp.polygon;
    if (!pts || pts.length < 3) continue;
    const scaledPts = pts.map(p => ({ x: p.x * scale, y: p.y * scale }));
    const s = new THREE.Shape();
    s.moveTo(scaledPts[0].x, scaledPts[0].y);
    for (let i = 1; i < scaledPts.length; i++) s.lineTo(scaledPts[i].x, scaledPts[i].y);
    s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, extrudeSettings);
    if (axis === 'x') geo.rotateY(Math.PI / 2);
    else if (axis === 'y') geo.rotateX(-Math.PI / 2);
    if (axis === 'z') geo.translate(0, 0, -length / 2);
    else if (axis === 'x') geo.translate(-length / 2, 0, 0);
    else if (axis === 'y') geo.translate(0, length / 2, 0);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, material);
    group.add(mesh);
  }
  return group.children.length === 0 ? null : group;
}

function disposeGroup(g) {
  if (!g) return;
  g.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

function updatePreview(force = false) {
  if (!force && !state.previewDirty) return;
  state.previewDirty = false;
  if (previewGroup) {
    scene.remove(previewGroup);
    disposeGroup(previewGroup);
    previewGroup = null;
  }
  if (!state.groups.length) { requestRender(); return; }
  previewGroup = buildPreviewGroup();
  if (previewGroup) scene.add(previewGroup);
  requestRender();
}

let sliderTimer = null;
function schedulePreview() {
  state.previewDirty = true;
  if (sliderTimer) clearTimeout(sliderTimer);
  sliderTimer = setTimeout(() => updatePreview(true), 70);
}

document.getElementById('sldLength').oninput = function() {
  document.getElementById('valLength').textContent = parseFloat(this.value).toFixed(2);
  schedulePreview();
};
document.getElementById('sldScale').oninput = function() {
  document.getElementById('valScale').textContent = parseFloat(this.value).toFixed(2);
  schedulePreview();
};
document.getElementById('axisRow').onclick = (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#axisRow button').forEach(b => b.classList.toggle('on', b === btn));
  schedulePreview();
};

document.getElementById('btnExtrude').onclick = () => {
  updatePreview(true);
  if (!previewGroup) {
    if (state.groups.length === 0 && state.edges.length > 0) {
      alert('Ada ' + state.edges.length + ' edge tapi belum di-group.\n\nPakai tool 🔗 Group untuk merangkum edge jadi shape tertutup.');
    } else if (state.edges.length === 0) {
      alert('Belum ada edge. Bikin edge dulu pakai 📏 / 🌊 / 🌀');
    } else {
      alert('Belum ada shape 3D. Cek edge yang belum nyambung.');
    }
    return;
  }
  if (window.innerWidth <= 768) {
    document.body.className = 'mode-3d';
    document.querySelectorAll('#mobileTabs button').forEach(b =>
      b.classList.toggle('on', b.dataset.tab === '3d')
    );
    setTimeout(() => resize3D(), 80);
  }
  const box = new THREE.Box3().setFromObject(previewGroup);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  target.copy(center);
  sphere.radius = Math.max(2, maxDim * 2.5);
  sphere.theta = Math.PI * 0.25;
  sphere.phi = Math.PI * 0.35;
  refreshCamera();
  requestRender();
  flashHint('✅ Siap di-3D!');
};

function resize3D() {
  const r = panel3D.getBoundingClientRect();
  if (r.width === 0 || r.height === 0) return;
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  renderer.setSize(r.width, r.height, false);
  requestRender();
}

let renderRequested = false;
function requestRender() {
  if (renderRequested) return;
  renderRequested = true;
  requestAnimationFrame(renderFrame);
}
function renderFrame() {
  renderRequested = false;
  renderer.render(scene, camera);
}

const ro = new ResizeObserver(() => { resizeCanvas(); resize3D(); });
ro.observe(panel3D);
ro.observe(document.getElementById('canvasWrap'));

setTool('select');
pushHistory();
resizeCanvas();
resize3D();
refreshCamera();
requestRender();
updateStatus();

setInterval(() => { if (state.previewDirty) updatePreview(); }, 120);

window.__state = state;
console.log('✅ Edge Builder + Background + Save OBJ siap!');
</script>
</body>
