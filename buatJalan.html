<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Road Builder - Tekstur + Export OBJ/MTL ke Folder</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; overflow:hidden; background:#0a0f1a; font-family:'Segoe UI',sans-serif; touch-action:none; }

  #info {
    position:absolute; top:10px; left:10px; z-index:10;
    background:rgba(0,0,0,0.8); color:#fff; padding:10px 14px;
    border-radius:10px; font-size:12px; line-height:1.7;
    border:1px solid rgba(255,215,0,0.3); pointer-events:none; max-width:260px;
  }
  #info b { color:#ffd966; }
  #info .key { background:#333; padding:1px 6px; border-radius:4px;
    font-family:monospace; font-size:11px; color:#ffd966; }

  #fps {
    position:absolute; top:10px; right:10px; z-index:10;
    background:rgba(0,0,0,0.75); color:#0f0; padding:6px 10px;
    border-radius:8px; font-size:12px; font-family:monospace;
    border:1px solid rgba(0,255,0,0.3);
  }

  #btnPanelToggle {
    position:absolute; top:10px; right:10px; z-index:25;
    background:rgba(20,25,40,0.95); color:#ffd966;
    border:1px solid rgba(255,215,0,0.4);
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
    transition:0.2s;
  }
  #btnPanelToggle:active { background:#ffaa00; color:#000; }

  #mainPanel {
    position:absolute; top:56px; right:10px; z-index:15;
    background:rgba(20,25,40,0.95); color:#fff;
    border-radius:12px; border:1px solid rgba(255,215,0,0.5);
    font-size:13px; width:240px;
    box-shadow:0 8px 30px rgba(0,0,0,0.6);
    display:none;
    max-height: calc(100vh - 90px);
    overflow-y: auto;
  }
  #mainPanel.visible { display:block; }

  #mainPanel .panelSection {
    padding:12px 14px;
    border-bottom:1px solid rgba(255,215,0,0.15);
  }
  #mainPanel .panelSection:last-child { border-bottom:none; }
  #mainPanel .panelSection h4 {
    margin:0 0 10px 0; color:#ffd966; font-size:12px;
    text-transform:uppercase; letter-spacing:0.5px;
    display:flex; align-items:center; gap:6px;
  }

  .modeRow {
    display:flex; gap:6px;
  }
  .modeBtn {
    flex:1; padding:10px 8px; border-radius:8px;
    font-size:12px; font-weight:bold; cursor:pointer;
    border:1px solid rgba(255,215,0,0.3);
    background:rgba(50,50,70,0.6); color:#aaa;
    transition:0.15s;
  }
  .modeBtn.active {
    background:#ffaa00; color:#000;
    border-color:#ffaa00;
    box-shadow:0 0 12px rgba(255,170,0,0.5);
  }
  .modeBtn:active { transform:scale(0.97); }

  #mainPanel .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  #mainPanel .row label { min-width:20px; font-weight:bold; }
  #mainPanel .row .val { min-width:40px; text-align:right;
    font-family:monospace; color:#ffd966; font-size:12px; }
  #mainPanel .row input[type=range] { flex:1; accent-color:#ffaa00; }

  .toggleRow {
    display:flex; align-items:center; justify-content:space-between;
    margin:8px 0; padding:8px 10px;
    background:rgba(255,180,80,0.08);
    border:1px solid rgba(255,180,80,0.3);
    border-radius:8px;
  }
  .toggleRow span { color:#ffb450; font-weight:bold; font-size:12px; }
  .toggleSwitch {
    position:relative; width:44px; height:24px;
    background:#333; border-radius:12px; cursor:pointer;
    transition:0.2s; border:1px solid #555;
    flex-shrink:0;
  }
  .toggleSwitch::after {
    content:''; position:absolute; top:2px; left:2px;
    width:18px; height:18px; border-radius:50%;
    background:#888; transition:0.2s;
  }
  .toggleSwitch.on { background:rgba(255,180,80,0.3); border-color:#ffb450; }
  .toggleSwitch.on::after { left:22px; background:#ffb450; }

  .toggleRow.blue { background:rgba(100,200,255,0.08); border-color:rgba(100,200,255,0.3); }
  .toggleRow.blue span { color:#8cd8ff; }
  .toggleRow.blue .toggleSwitch.on { background:rgba(100,200,255,0.3); border-color:#8cd8ff; }
  .toggleRow.blue .toggleSwitch.on::after { background:#8cd8ff; }

  .toggleRow.green { background:rgba(100,255,150,0.08); border-color:rgba(100,255,150,0.3); }
  .toggleRow.green span { color:#9dffb8; }
  .toggleRow.green .toggleSwitch.on { background:rgba(100,255,150,0.3); border-color:#9dffb8; }
  .toggleRow.green .toggleSwitch.on::after { background:#9dffb8; }

  #mainPanel .btnRow { display:flex; gap:6px; margin-top:10px; }
  #mainPanel .btnRow button {
    flex:1; padding:8px; font-size:12px; border-radius:6px;
    background:rgba(255,215,0,0.2); border:1px solid rgba(255,215,0,0.4);
    color:#ffd966; cursor:pointer; font-weight:bold;
  }
  #mainPanel .btnRow button:active { background:#ffaa00; color:#000; }

  .miniBtn {
    background:rgba(255,180,80,0.15);
    border:1px solid rgba(255,180,80,0.4);
    color:#ffb450; padding:6px 8px; border-radius:6px;
    font-size:11px; cursor:pointer; font-weight:bold;
    white-space:nowrap;
    width:100%;
  }
  .miniBtn:active { background:#ffb450; color:#000; }

  #texPreviewRow {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
  }
  .preview {
    width:36px; height:36px; border-radius:6px;
    background:#333; border:1px solid #555; background-size:cover;
    flex-shrink:0;
  }
  .texLabel {
    background:rgba(100,200,255,0.15); padding:6px 12px;
    border-radius:20px; cursor:pointer; font-weight:500;
    border:1px solid rgba(100,200,255,0.4);
    color:#8cd8ff; white-space:nowrap; font-size:12px;
    flex:1; text-align:center;
  }
  .texLabel:active { background:rgba(100,200,255,0.35); }
  input[type=file] { display:none; }
  .tileRow { display:flex; align-items:center; gap:6px; font-size:12px; margin:6px 0; }
  .tileRow input[type=range] { flex:1; accent-color:#8cd8ff; }
  .segmented {
    display:flex; background:rgba(0,0,0,0.4); border-radius:16px;
    padding:2px; border:1px solid rgba(100,200,255,0.3);
    margin:6px 0;
  }
  .segmented button {
    flex:1; background:transparent; border:none; color:#8cd8ff;
    padding:6px 10px; border-radius:14px; cursor:pointer;
    font-size:11px; font-weight:bold; transition:0.15s;
  }
  .segmented button.active {
    background:#8cd8ff; color:#0a0f1a;
  }
  .resetTex {
    background:rgba(255,100,100,0.2); padding:6px 10px;
    border-radius:16px; cursor:pointer; font-size:11px;
    border:1px solid rgba(255,100,100,0.4); color:#ff9999;
    text-align:center; margin-top:6px;
  }
  .resetTex:active { background:rgba(255,100,100,0.4); }

  #bottomPanel {
    position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; z-index:20; flex-wrap:wrap; justify-content:center;
    padding:0 10px;
  }
  button.mainBtn {
    background:rgba(50,50,70,0.95); color:#fff;
    border:1px solid rgba(255,215,0,0.3);
    padding:10px 16px; border-radius:10px; cursor:pointer;
    font-size:13px; font-weight:500; transition:0.15s; white-space:nowrap;
  }
  button.mainBtn:hover, button.mainBtn:active { background:#ffaa00; color:#000; }
  button.mainBtn.active { background:#ffaa00; color:#000; font-weight:bold; }

  #saveBtn {
    background:rgba(80,200,120,0.25);
    border:1px solid rgba(80,200,120,0.6);
    color:#9dffb8;
  }
  #saveBtn:hover, #saveBtn:active { background:#66d18a; color:#000; }

  #toast {
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(20,40,25,0.95); color:#9dffb8;
    border:1px solid rgba(100,255,150,0.5);
    padding:10px 18px; border-radius:12px; font-size:13px;
    opacity:0; pointer-events:none; transition:0.3s; z-index:100;
    max-width:80vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.err { background:rgba(50,20,20,0.95); color:#ff9d9d; border-color:rgba(255,100,100,0.5); }

  #modeIndicator {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%, -50%) scale(0.8);
    z-index:30; pointer-events:none;
    background:rgba(255,136,68,0.95);
    color:#fff; padding:18px 36px;
    border-radius:20px; font-size:22px; font-weight:bold;
    box-shadow:0 10px 40px rgba(255,136,68,0.5);
    opacity:0; transition:opacity 0.4s, transform 0.4s;
    text-align:center;
    border:2px solid #fff;
    white-space:pre-line;
  }
  #modeIndicator.show {
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
  }

  /* Badge "Terhubung dari #X" */
  #chainBadge {
    position:absolute; bottom:70px; left:50%;
    transform:translateX(-50%);
    background:rgba(100,255,150,0.95); color:#0a0f1a;
    padding:8px 16px; border-radius:20px;
    font-size:12px; font-weight:bold;
    z-index:25; pointer-events:none;
    opacity:0; transition:0.3s;
    box-shadow:0 4px 15px rgba(100,255,150,0.4);
  }
  #chainBadge.show { opacity:1; }

  @media (max-width:700px) {
    #info { font-size:11px; max-width:150px; padding:8px 10px; }
    #mainPanel { width:210px; right:6px; font-size:12px; }
    #mainPanel .panelSection { padding:10px 12px; }
    button.mainBtn { padding:8px 12px; font-size:12px; }
    #modeIndicator { font-size:16px; padding:12px 24px; }
  }
</style>
</head>
<body>


<div id="fps">FPS: --</div>

<div id="modeIndicator"></div>
<div id="chainBadge">🔗 Sambung dari titik terpilih</div>

<button id="btnPanelToggle" title="Buka/Tutup Panel">☰</button>

<div id="mainPanel">

  <div class="panelSection">
    <h4>🎯 Mode Membuat</h4>
    <div class="modeRow">
      <button class="modeBtn active" id="btnModeRoad">🛣 Jalan</button>
      <button class="modeBtn" id="btnModeFence">🧱 Pagar</button>
    </div>
  </div>

  <div class="panelSection">
    <h4>🖼 Tekstur</h4>
    <div id="texPreviewRow">
      <div class="preview" id="texPreview"></div>
      <label class="texLabel">
        Pilih Gambar
        <input type="file" id="texInput" accept="image/*">
      </label>
    </div>
    <div class="tileRow">
      Tile:
      <input type="range" id="tileSlider" min="1" max="100" step="0.5" value="6">
      <span id="tileVal" style="min-width:26px;text-align:right;color:#8cd8ff;font-family:monospace;">6</span>
    </div>
    <div class="segmented" id="uvModeGroup">
      <button data-mode="vertical" class="active">↕ Vertikal</button>
      <button data-mode="horizontal">↔ Horizontal</button>
    </div>
    <div class="resetTex" id="btnResetTex">✖ Reset Tekstur</div>
  </div>

  <div class="panelSection" id="pointEditSection" style="display:none;">
    <h4>✏️ Edit Titik <span id="activeIndex">-</span></h4>
    <div class="row">
      <label style="color:#ff6666">X</label>
      <input type="range" id="px" min="-20" max="20" step="0.1" value="0">
      <span class="val" id="pxVal">0.0</span>
    </div>
    <div class="row">
      <label style="color:#66ff66">Y</label>
      <input type="range" id="py" min="0" max="10" step="0.1" value="0">
      <span class="val" id="pyVal">0.0</span>
    </div>
    <div class="row">
      <label style="color:#66aaff">Z</label>
      <input type="range" id="pz" min="-20" max="20" step="0.1" value="0">
      <span class="val" id="pzVal">0.0</span>
    </div>
    <div class="row">
      📏 Lebar: <input type="range" id="widthSlider" min="0.5" max="5" step="0.1" value="2.0">
      <span id="widthVal" style="min-width:30px;text-align:right;color:#ffd966;font-family:monospace;font-size:12px;">2.0</span>
    </div>

    <div class="toggleRow" style="margin-top:8px;">
      <span id="pointModeText">🛣 Titik Ini: Jalan</span>
    </div>
    <button class="miniBtn" id="btnTogglePointMode" style="margin-top:4px;">🔄 Balik Mode Titik</button>

    <!-- FITUR BARU: Extend / Sambung -->
    <div class="toggleRow green" style="margin-top:8px;">
      <span>🔗 Sambung dari Titik Ini</span>
      <div class="toggleSwitch on" id="toggleChain"></div>
    </div>
    <div style="font-size:10px; color:#9dffb8; opacity:0.8; margin-top:4px; text-align:center;">
      Klik tanah = sambung jalan dari titik ini
    </div>

    <div class="btnRow">
      <button id="btnDown">▼ -0.5</button>
      <button id="btnUp">▲ +0.5</button>
    </div>
    <div class="btnRow">
      <button id="btnDelete" style="background:rgba(255,80,80,0.25);border-color:rgba(255,80,80,0.5);color:#ff8888;">🗑 Hapus Titik</button>
    </div>
  </div>

  <div class="panelSection">
    <h4>✨ Efek</h4>
    <div class="toggleRow blue">
      <span>Partikel Debu</span>
      <div class="toggleSwitch" id="toggleParticle"></div>
    </div>
  </div>

  <div class="panelSection">
    <h4>⚙️ Aksi</h4>
    <button class="mainBtn" id="saveBtn" style="width:100%; margin-bottom:8px;">💾 Simpan ke Folder</button>
    <div class="btnRow">
      <button id="btnClear">🗑 Hapus Semua</button>
      <button id="btnSample">📐 Contoh</button>
    </div>
  </div>

</div>

<div id="bottomPanel">
  <button class="mainBtn active" id="btnDeselect">✖ Batal Pilih</button>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { OBJExporter } from 'three/addons/exporters/OBJExporter.js';

// ============================================================
//  RENDERER
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// ============================================================
//  SCENE & CAMERA
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2a3a);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(15, 15, 20);
camera.lookAt(0, 0, 0);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.enableDamping = false;
orbit.target.set(0, 1, 0);
orbit.maxPolarAngle = Math.PI / 2.05;
orbit.minDistance = 5;
orbit.maxDistance = 60;

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(10, 20, 8);
scene.add(sun);

// ============================================================
//  GROUND
// ============================================================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshLambertMaterial({ color: 0x3a4a5a })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(100, 50, 0x556677, 0x2a3a4a);
grid.position.y = 0.01;
grid.material.opacity = 0.4;
grid.material.transparent = true;
scene.add(grid);

// ============================================================
//  STATE
// ============================================================
const points = [];
let roadWidth = 2.0;
let activePoint = null;

let roadTexture = null;
let roadTextureDataUrl = null;
let roadTextureFileName = 'texture.png';
let textureTiling = 6;
let uvMode = 'vertical';

let currentMode = 'road';

// **FITUR CHAIN**: jika aktif, klik tanah = sambung dari titik terpilih
let chainMode = true;

const roadMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.85,
  metalness: 0.05,
  side: THREE.DoubleSide
});

const lineMat = new THREE.LineBasicMaterial({ color: 0xffd966, opacity: 0.5, transparent: true });

const POINT_COLOR_NORMAL = 0xffd966;
const POINT_COLOR_ACTIVE = 0x66ff66;
const POINT_COLOR_FENCE = 0xff8844;

function makePointMesh() {
  const geo = new THREE.SphereGeometry(0.35, 12, 12);
  const mat = new THREE.MeshBasicMaterial({ color: POINT_COLOR_NORMAL });
  return new THREE.Mesh(geo, mat);
}

function getPointColor(pointObj) {
  if (pointObj === activePoint) return POINT_COLOR_ACTIVE;
  return pointObj.isFence ? POINT_COLOR_FENCE : POINT_COLOR_NORMAL;
}

function applyPointColor(pointObj) {
  if (!pointObj || !pointObj.mesh) return;
  pointObj.mesh.material.color.setHex(getPointColor(pointObj));
}

// ============================================================
//  ROAD MESH
// ============================================================
let roadMesh = null;
let guideLine = null;

function getPointAngle(pointObj) {
  return pointObj.isFence ? Math.PI / 2 : 0;
}

function buildRoad() {
  if (roadMesh) { scene.remove(roadMesh); roadMesh.geometry.dispose(); roadMesh = null; }
  if (guideLine) { scene.remove(guideLine); guideLine.geometry.dispose(); guideLine = null; }

  if (points.length < 2) return;

  const guidePts = points.map(p => p.position.clone());
  guideLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(guidePts), lineMat
  );
  scene.add(guideLine);

  const curve = new THREE.CatmullRomCurve3(guidePts, false, 'catmullrom', 0.5);

  const totalLength = curve.getLength();
  const SEG = Math.max(30, Math.min(300, Math.floor(totalLength * 6)));

  const verts = [];
  const uvs = [];
  const idx = [];

  const curvePoints = [];
  let accumLength = 0;

  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t).normalize();
    
    const segIdx = t * (points.length - 1);
    const lo = Math.floor(segIdx);
    const hi = Math.min(lo + 1, points.length - 1);
    const frac = segIdx - lo;
    
    const angleLo = getPointAngle(points[lo]);
    const angleHi = getPointAngle(points[hi]);
    const angle = angleLo + (angleHi - angleLo) * frac;
    
    if (i > 0) {
      const prev = curvePoints[i-1];
      accumLength += p.distanceTo(prev.p);
    }

    curvePoints.push({
      p, tan, angle,
      cumV: accumLength / totalLength
    });
  }

  for (let i = 0; i <= SEG; i++) {
    const cp = curvePoints[i];
    const hw = roadWidth / 2;
    const angle = cp.angle;
    
    const rightBase = new THREE.Vector3().crossVectors(cp.tan, new THREE.Vector3(0,1,0)).normalize();
    if (rightBase.length() < 0.1) rightBase.set(1,0,0);
    
    const q = new THREE.Quaternion().setFromAxisAngle(cp.tan, angle);
    const rightRotated = rightBase.clone().applyQuaternion(q);
    
    const l = cp.p.clone().addScaledVector(rightRotated, -hw);
    const r = cp.p.clone().addScaledVector(rightRotated,  hw);

    verts.push(l.x, l.y, l.z);
    verts.push(r.x, r.y, r.z);

    const v = cp.cumV * textureTiling;
    if (uvMode === 'vertical') {
      uvs.push(0, v);
      uvs.push(1, v);
    } else {
      uvs.push(v, 0);
      uvs.push(v, 1);
    }
  }

  for (let i = 0; i < SEG; i++) {
    const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
    idx.push(a, c, b, b, c, d);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  if (roadTexture) {
    roadMat.map = roadTexture;
    roadMat.color.setHex(0xffffff);
  } else {
    roadMat.map = null;
    const allFence = points.every(pt => pt.isFence);
    roadMat.color.setHex(allFence ? 0xaa8866 : 0x888888);
  }
  roadMat.needsUpdate = true;

  roadMesh = new THREE.Mesh(geo, roadMat);
  roadMesh.name = 'Jalan';
  scene.add(roadMesh);

  if (particleEnabled) buildParticles();
}

// ============================================================
//  PARTIKEL DEBU
// ============================================================
let particleSystem = null;
let particleEnabled = false;

function buildParticles() {
  if (particleSystem) {
    scene.remove(particleSystem);
    particleSystem.geometry.dispose();
    particleSystem.material.dispose();
    particleSystem = null;
  }

  if (!particleEnabled || points.length < 2) return;

  const guidePts = points.map(p => p.position.clone());
  const curve = new THREE.CatmullRomCurve3(guidePts, false, 'catmullrom', 0.5);
  const totalLength = curve.getLength();
  const count = Math.min(2000, Math.floor(totalLength * 30));

  const positions = [];
  const colors = [];

  for (let i = 0; i < count; i++) {
    const t = Math.random();
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t).normalize();
    const right = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0,1,0)).normalize();
    
    const lateral = (Math.random() - 0.5) * roadWidth * 1.4;
    const vertical = Math.random() * 2.5;
    
    const pos = p.clone().addScaledVector(right, lateral);
    pos.y += vertical;
    
    positions.push(pos.x, pos.y, pos.z);
    
    const brightness = 0.7 + Math.random() * 0.3;
    colors.push(brightness, brightness * 0.95, brightness * 0.8);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.7,
    depthWrite: false,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });

  particleSystem = new THREE.Points(geo, mat);
  particleSystem.name = 'PartikelDebu';
  scene.add(particleSystem);
}

// ============================================================
//  TITIK
// ============================================================
// Tambah titik di akhir (mode normal)
function addPoint(position) {
  const mesh = makePointMesh();
  mesh.position.copy(position);
  mesh.userData.isPoint = true;
  scene.add(mesh);
  
  const isFence = (currentMode === 'fence');
  const pointObj = { 
    position: position.clone(), 
    mesh, 
    isFence 
  };
  mesh.userData.pointObj = pointObj;
  mesh.material.color.setHex(getPointColor(pointObj));
  points.push(pointObj);
  buildRoad();
  return pointObj;
}

// **FITUR BARU**: sisipkan titik setelah titik tertentu (untuk chain mode)
function insertPointAfter(position, afterPoint) {
  const mesh = makePointMesh();
  mesh.position.copy(position);
  mesh.userData.isPoint = true;
  scene.add(mesh);
  
  // Titik baru mengikuti mode titik sebelumnya
  const isFence = afterPoint.isFence;
  const pointObj = { 
    position: position.clone(), 
    mesh, 
    isFence 
  };
  mesh.userData.pointObj = pointObj;
  mesh.material.color.setHex(getPointColor(pointObj));
  
  const idx = points.indexOf(afterPoint);
  if (idx >= 0) {
    points.splice(idx + 1, 0, pointObj);
  } else {
    points.push(pointObj);
  }
  
  buildRoad();
  return pointObj;
}

// **FITUR BARU**: sisipkan titik sebelum titik tertentu (chain ke belakang)
function insertPointBefore(position, beforePoint) {
  const mesh = makePointMesh();
  mesh.position.copy(position);
  mesh.userData.isPoint = true;
  scene.add(mesh);
  
  const isFence = beforePoint.isFence;
  const pointObj = { 
    position: position.clone(), 
    mesh, 
    isFence 
  };
  mesh.userData.pointObj = pointObj;
  mesh.material.color.setHex(getPointColor(pointObj));
  
  const idx = points.indexOf(beforePoint);
  if (idx >= 0) {
    points.splice(idx, 0, pointObj);
  } else {
    points.unshift(pointObj);
  }
  
  buildRoad();
  return pointObj;
}

function removePoint(pointObj) {
  if (points.length <= 1) return;
  if (activePoint === pointObj) deselectPoint();
  const i = points.indexOf(pointObj);
  if (i >= 0) points.splice(i, 1);
  scene.remove(pointObj.mesh);
  pointObj.mesh.geometry.dispose();
  pointObj.mesh.material.dispose();
  buildRoad();
}

function clearAll() {
  deselectPoint();
  points.forEach(p => {
    scene.remove(p.mesh);
    p.mesh.geometry.dispose();
    p.mesh.material.dispose();
  });
  points.length = 0;
  buildRoad();
}

function selectPoint(pointObj) {
  if (activePoint && activePoint.mesh) {
    activePoint.mesh.scale.setScalar(1);
    applyPointColor(activePoint);
  }
  activePoint = pointObj;
  if (pointObj) {
    pointObj.mesh.material.color.setHex(POINT_COLOR_ACTIVE);
    pointObj.mesh.scale.setScalar(1.4);
    gizmo.attach(pointObj.mesh);
    gizmo.visible = true;
    updatePointPanel();
    showPointSection(true);
    updateChainBadge();
  } else {
    gizmo.detach(); gizmo.visible = false; showPointSection(false);
    hideChainBadge();
  }
}

function deselectPoint() {
  if (activePoint && activePoint.mesh) {
    activePoint.mesh.scale.setScalar(1);
    applyPointColor(activePoint);
  }
  activePoint = null;
  gizmo.detach(); gizmo.visible = false; showPointSection(false);
  hideChainBadge();
}

  if (!activePoint) return;

    const guidePts = points.map(pt => pt.position.clone());
    guideLine.geometry.setFromPoints(guidePts);
  }
  updatePointPanel();
});

function syncActivePoint() {
  if (!activePoint) return;
  activePoint.position.copy(activePoint.mesh.position);
  if (activePoint.position.y < 0) {
    activePoint.position.y = 0;
    activePoint.mesh.position.y = 0;
  }
}

// ============================================================
//  INTERAKSI POINTER
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function getPointAtScreen(x, y) {
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = points.map(p => p.mesh);
  const hits = raycaster.intersectObjects(meshes);
  if (hits.length > 0) return hits[0].object.userData.pointObj;
  return null;
}

function getGroundPoint(x, y) {
  pointer.x = (x / innerWidth) * 2 - 1;
  pointer.y = -(y / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(ground);
  if (hits.length > 0) return hits[0].point.clone();
  return null;
}

let tapStart = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (gizmo.dragging) return;
  tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (e.button !== 0) return;
  if (gizmo.dragging) return;
  if (!tapStart) return;

  const dx = e.clientX - tapStart.x;
  const dy = e.clientY - tapStart.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const dt = performance.now() - tapStart.t;
  tapStart = null;
  if (dist > 6 || dt > 350) return;

  // Cek apakah klik pada titik
  const hitPoint = getPointAtScreen(e.clientX, e.clientY);
  if (hitPoint) {
    if (activePoint === hitPoint) {
      deselectPoint();
    } else {
      selectPoint(hitPoint);
    }
    return;
  }

  // Klik pada tanah
  const gp = getGroundPoint(e.clientX, e.clientY);
  if (gp) {
    // **FITUR UTAMA**: jika chainMode aktif dan ada titik terpilih,
    // sisipkan titik BARU setelah titik terpilih (menyambung)
    if (chainMode && activePoint) {
      const newPt = insertPointAfter(gp, activePoint);
      // Tetap pilih titik baru agar bisa lanjut menyambung
      selectPoint(newPt);
      showToast(`🔗 Tersambung dari #${points.indexOf(activePoint)}`);
    } else {
      // Mode normal: tambah titik di akhir
      const newPt = addPoint(gp);
      selectPoint(newPt);
    }
  } else {
    deselectPoint();
  }
});

renderer.domElement.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const hitPoint = getPointAtScreen(e.clientX, e.clientY);
  if (hitPoint) removePoint(hitPoint);
});

// ============================================================
//  SIMPAN KE FOLDER (OBJ + MTL + TEKSTUR)
// ============================================================
const toastEl = document.getElementById('toast');
function showToast(msg, isError = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', isError);
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function dataUrlToBlob(dataUrl) {
  const [meta, b64] = dataUrl.split(',');
  const mime = meta.match(/:(.*?);/)[1];
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function textureNameFromMime(origName, mime) {
  const base = (origName || 'texture').replace(/\.[^.]+$/, '');
  let ext = 'png';
  if (mime.includes('jpeg') || mime.includes('jpg')) ext = 'jpg';
  else if (mime.includes('png')) ext = 'png';
  else if (mime.includes('webp')) ext = 'webp';
  else if (mime.includes('bmp')) ext = 'bmp';
  return `${base}.${ext}`;
}

async function saveToFolder() {
  if (!roadMesh || points.length < 2) {
    showToast('❗ Jalan belum dibuat (minimal 2 titik)', true);
    return;
  }

  if (!window.showDirectoryPicker) {
    showToast('❌ Browser tidak mendukung (gunakan Chrome/Edge)', true);
    return;
  }

  let dirHandle;
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch (err) {
    if (err.name === 'AbortError') return;
    showToast('❌ Gagal membuka folder: ' + err.message, true);
    return;
  }

  try {
    const exportScene = new THREE.Scene();
    const exportMesh = roadMesh.clone();
    exportMesh.name = 'Jalan';
    exportMesh.material = roadMat.clone();
    exportMesh.material.name = 'MaterialJalan';

    if (roadTexture) {
      const mime = (roadTextureDataUrl && roadTextureDataUrl.match(/:(.*?);/)) 
        ? roadTextureDataUrl.match(/:(.*?);/)[1] 
        : 'image/png';
      const texFinalName = textureNameFromMime(roadTextureFileName, mime);
      roadTexture.name = texFinalName;
      exportMesh.material.map = roadTexture;
    } else {
      exportMesh.material.map = null;
    }

    exportScene.add(exportMesh);

    const exporter = new OBJExporter();
    let objText = exporter.parse(exportScene);

    const mtlName = 'jalan.mtl';
    if (!/^mtllib /m.test(objText)) {
      objText = `mtllib ${mtlName}\n` + objText;
    }

    let mtlText = `# Material Jalan\n`;
    mtlText += `newmtl MaterialJalan\n`;
    mtlText += `Ka 0.2000 0.2000 0.2000\n`;
    mtlText += `Kd 1.0000 1.0000 1.0000\n`;
    mtlText += `Ks 0.0500 0.0500 0.0500\n`;
    mtlText += `Ns 20.0\n`;
    mtlText += `d 1.0\n`;
    mtlText += `illum 2\n`;
    if (roadTexture) {
      const mime = roadTextureDataUrl.match(/:(.*?);/)[1];
      const texFinalName = textureNameFromMime(roadTextureFileName, mime);
      mtlText += `map_Kd ${texFinalName}\n`;
    }

    const objHandle = await dirHandle.getFileHandle('jalan.obj', { create: true });
    const objWritable = await objHandle.createWritable();
    await objWritable.write(objText);
    await objWritable.close();

    const mtlHandle = await dirHandle.getFileHandle(mtlName, { create: true });
    const mtlWritable = await mtlHandle.createWritable();
    await mtlWritable.write(mtlText);
    await mtlWritable.close();

    let savedTex = null;
    if (roadTexture && roadTextureDataUrl) {
      const mime = roadTextureDataUrl.match(/:(.*?);/)[1];
      const texFinalName = textureNameFromMime(roadTextureFileName, mime);
      savedTex = texFinalName;
      const texHandle = await dirHandle.getFileHandle(texFinalName, { create: true });
      const texWritable = await texHandle.createWritable();
      await texWritable.write(dataUrlToBlob(roadTextureDataUrl));
      await texWritable.close();
    }

    if (savedTex) {
      showToast(`✅ Tersimpan: jalan.obj, jalan.mtl, ${savedTex}`);
    } else {
      showToast(`✅ Tersimpan: jalan.obj + jalan.mtl (tanpa tekstur)`);
    }
  } catch (err) {
    console.error(err);
    showToast('❌ Gagal menyimpan: ' + err.message, true);
  }
}

document.getElementById('saveBtn').onclick = saveToFolder;

addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') { setMode('road'); e.preventDefault(); return; }
  if (e.key === 'f' || e.key === 'F') { setMode('fence'); e.preventDefault(); return; }
  if (e.key === 'p' || e.key === 'P') { toggleParticle.click(); e.preventDefault(); return; }
  if (e.key === 'c' || e.key === 'C') { toggleChain.click(); e.preventDefault(); return; }
  if (e.key === 'Tab') {
    mainPanel.classList.toggle('visible');
    btnPanelToggle.textContent = mainPanel.classList.contains('visible') ? '✖' : '☰';
    e.preventDefault(); return;
  }
  
  if (!activePoint) return;
  if (e.key === 'PageUp' || e.key === 'ArrowUp') {
    activePoint.position.y = Math.min(10, activePoint.position.y + 0.5);
    activePoint.mesh.position.y = activePoint.position.y;
    updatePointPanel(); buildRoad();
    e.preventDefault();
  } else if (e.key === 'PageDown' || e.key === 'ArrowDown') {
    activePoint.position.y = Math.max(0, activePoint.position.y - 0.5);
    activePoint.mesh.position.y = activePoint.position.y;
    updatePointPanel(); buildRoad();
    e.preventDefault();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    removePoint(activePoint);
    e.preventDefault();
  } else if (e.key === 'Escape') {
    deselectPoint();
  }
});

// ============================================================
//  FPS + ANIMATE
// ============================================================
const fpsEl = document.getElementById('fps');
let frames = 0, lastFps = performance.now();

function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastFps >= 1000) {
    fpsEl.textContent = 'FPS: ' + frames;
    frames = 0; lastFps = now;
  }
}

loadSample();
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
