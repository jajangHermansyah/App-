
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HTML Code Checker — Advanced</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
    margin: 0; background: #0d1117; color: #e6edf3;
    font-family: Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}
header { padding: 14px; background: #161b22; border-bottom: 1px solid #30363d; }
header h2 { margin: 0; font-size: 17px; }

.tabs { display: flex; padding: 12px 12px 0; }
.tab {
    flex: 1; padding: 12px 16px;
    background: #161b22; color: #8b949e;
    border: 1px solid #30363d; border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-size: 14px; font-weight: bold;
    cursor: pointer; text-align: center;
    transition: background .15s, color .15s;
    user-select: none;
    display: flex; align-items: center; justify-content: center; gap: 4px;
}
.tab + .tab { margin-left: 4px; }
.tab.active {
    background: #0d1117; color: #e6edf3;
    margin-bottom: -1px; position: relative; z-index: 1;
}
.tab .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; margin-right: 6px;
    background: #30363d; vertical-align: middle;
}
.tab[data-tab="code"].active .dot { background: #58a6ff; }
.tab[data-tab="preview"].active .dot { background: #3fb950; }
.tab .count {
    display: none;
    background: #da3633; color: #fff;
    border-radius: 10px; padding: 1px 7px;
    font-size: 11px; margin-left: 6px;
    font-weight: bold;
}
.tab .count.show { display: inline-block; }

.tab .copy-tab-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: #21262d; color: #8b949e;
    border: 1px solid #30363d; border-radius: 5px;
    padding: 2px 6px; font-size: 12px;
    cursor: pointer; margin-left: 4px;
    transition: all .15s; flex-shrink: 0;
}
.tab .copy-tab-btn:hover { background: #1f6feb; color: #fff; border-color: #1f6feb; }
.tab .copy-tab-btn:active { transform: scale(.9); }
.tab .copy-tab-btn.copied { background: #238636; color: #fff; border-color: #2ea043; }

.search-bar {
    display: flex; gap: 6px; padding: 10px 12px;
    margin: 8px 12px 0; background: #161b22;
    border: 1px solid #30363d; border-radius: 8px;
    align-items: center; flex-wrap: wrap;
}
.search-bar .search-icon { color: #8b949e; font-size: 16px; flex-shrink: 0; }
.search-bar input[type="text"] {
    flex: 1; min-width: 120px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 8px 10px;
    font-size: 13px; font-family: Consolas, monospace; outline: none;
}
.search-bar input[type="text"]:focus {
    border-color: #1f6feb;
    box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.25);
}
.search-bar input[type="text"].no-match {
    border-color: #da3633;
    box-shadow: 0 0 0 2px rgba(218, 54, 51, 0.25);
}
.search-bar button {
    border: 0; border-radius: 6px;
    padding: 8px 10px; font-size: 13px; font-weight: bold;
    cursor: pointer; color: white; flex-shrink: 0;
}
.search-bar button:active { transform: scale(.95); }
.btn-search { background: #238636; padding: 8px 16px; }
.btn-search:hover { background: #2ea043; }
.btn-prev, .btn-next {
    background: #21262d; color: #e6edf3;
    padding: 8px 11px; border: 1px solid #30363d;
}
.btn-prev:hover:not(:disabled), .btn-next:hover:not(:disabled) { background: #30363d; }
.btn-prev:disabled, .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-clear-search { background: #484f58; padding: 8px 11px; }
.search-toggles { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
.toggle-btn {
    background: #21262d; color: #8b949e;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 6px 9px; font-size: 12px;
    font-family: Consolas, monospace; font-weight: bold;
    cursor: pointer; user-select: none;
    min-width: 30px; text-align: center;
}
.toggle-btn:hover { background: #30363d; color: #e6edf3; }
.toggle-btn.active { background: #1f6feb; color: white; border-color: #1f6feb; }
.search-info {
    font-size: 12px; color: #8b949e;
    font-family: Consolas, monospace;
    padding: 4px 8px; background: #0d1117;
    border-radius: 4px; flex-shrink: 0;
    min-width: 70px; text-align: center;
}
.search-info.has-match { color: #7ee787; }
.search-info.no-match { color: #ff7b72; }
.search-info.idle { color: #6e7681; }

.workspace { padding: 0 12px 12px; }
.panel {
    display: none;
    border: 1px solid #30363d;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    background: #2b2b2b;
}
.panel.active { display: block; }

.panel-header {
    padding: 8px 12px; background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 13px; font-weight: bold; color: #8b949e;
    display: flex; justify-content: space-between; align-items: center;
}
.panel-header .badge {
    font-size: 11px; color: #6e7681;
    background: #21262d; padding: 2px 8px; border-radius: 10px;
}
.panel-header .badge.live {
    color: #7ee787; background: rgba(46, 160, 67, 0.15);
    border: 1px solid #238636;
}
.panel-header .badge.dirty {
    color: #d29922; background: rgba(210, 153, 34, 0.15);
    border: 1px solid #9e6a03;
}
.panel-header .right-group-header {
    display: flex; align-items: center; gap: 8px;
}
.panel-header .copy-panel-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: #21262d; color: #8b949e;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-weight: bold;
    cursor: pointer; transition: all .15s;
}
.panel-header .copy-panel-btn:hover {
    background: #1f6feb; color: #fff; border-color: #1f6feb;
}
.panel-header .copy-panel-btn:active { transform: scale(.95); }
.panel-header .copy-panel-btn.copied {
    background: #238636; color: #fff; border-color: #2ea043;
}

.font-size-control {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: #0d1117;
    border-bottom: 1px solid #30363d;
    font-size: 12px; color: #8b949e;
}
.font-size-control label {
    flex-shrink: 0;
    font-family: Consolas, monospace;
    font-weight: bold; color: #58a6ff;
    min-width: 32px; text-align: right;
}
.font-size-control input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; background: #21262d;
    border-radius: 3px; outline: none;
    cursor: pointer; border: 1px solid #30363d; min-width: 80px;
}
.font-size-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px;
    background: #1f6feb; border-radius: 50%;
    cursor: pointer; border: 2px solid #58a6ff;
    box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.25);
    transition: transform .15s;
}
.font-size-control input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15); background: #388bfd;
}
.font-size-control input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    background: #1f6feb; border-radius: 50%;
    cursor: pointer; border: 2px solid #58a6ff;
    box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.25);
    transition: transform .15s;
}
.font-size-control input[type="range"]::-moz-range-thumb:hover {
    transform: scale(1.15); background: #388bfd;
}
.font-size-control .size-value {
    font-family: Consolas, monospace;
    font-size: 11px; color: #7ee787;
    background: #161b22; padding: 3px 8px;
    border-radius: 4px; border: 1px solid #238636;
    min-width: 48px; text-align: center;
    flex-shrink: 0;
}
.font-size-control .size-preset {
    background: #21262d; color: #8b949e;
    border: 1px solid #30363d; border-radius: 4px;
    padding: 3px 8px; font-size: 11px;
    font-family: Consolas, monospace; font-weight: bold;
    cursor: pointer; flex-shrink: 0; user-select: none;
}
.font-size-control .size-preset:hover { background: #30363d; color: #e6edf3; }
.font-size-control .size-preset.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }

.editor { display: flex; width: 100%; height: 460px; overflow: hidden; position: relative; }

:root {
    --code-font-size: 11px;
    --code-line-height: 18px;
    --code-padding-y: 10px;
    --code-padding-x: 10px;
}

.line-numbers {
    width: 46px; flex-shrink: 0;
    padding-top: var(--code-padding-y); padding-bottom: var(--code-padding-y); padding-right: 8px;
    background: #161b22; color: #6e7681;
    font-family: Consolas, monospace; font-size: var(--code-font-size); line-height: var(--code-line-height);
    text-align: right; overflow: hidden; user-select: none;
    border-right: 1px solid #30363d; z-index: 3; position: relative;
    content-visibility: auto; contain: strict;
}
.line-number {
    height: var(--code-line-height); white-space: nowrap;
    cursor: pointer; padding-right: 4px; border-radius: 3px;
    contain: layout style paint;
}
.line-number.error { color: #ff7b72; font-weight: bold; }
.line-number.error::before { content: "🔴 "; font-size: 7px; }
.line-number.warn { color: #d29922; font-weight: bold; }
.line-number.warn::before { content: "⚠️ "; font-size: 7px; }
.line-number.suggest { color: #79c0ff; font-weight: bold; background: rgba(56, 139, 253, 0.12); }
.line-number.suggest::before { content: "📍 "; font-size: 8px; }
.line-number.matched { background: #1f3a5f; color: #79c0ff; font-weight: bold; border-left: 3px solid #58a6ff; padding-left: 3px; }
.line-number.active { background: #2d333b; color: #e6edf3; }
.line-number.search-hit { background: #4a3d1a; color: #f0c674; }
.line-number.search-current { background: #f0883e; color: #0d1117; font-weight: bold; }
.line-number.flash {
    background: #f0883e !important;
    color: #0d1117 !important;
    font-weight: bold;
    animation: flashPulse .9s ease-out;
}
@keyframes flashPulse { 0% { background: #ffd33d; } 100% { background: #f0883e; } }

.code-wrapper { position: relative; flex: 1; width: 0; height: 100%; overflow: hidden; }
#code {
    position: absolute; inset: 0; width: 100%; height: 100%; resize: none;
    border: 0; outline: 0; background: transparent; color: #8b949e;
    padding: var(--code-padding-y) var(--code-padding-x);
    font-family: Consolas, monospace; font-size: var(--code-font-size); line-height: var(--code-line-height);
    white-space: pre; overflow: auto; tab-size: 4; z-index: 2;
    will-change: scroll-position; contain: content;
}
#bracketOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
#lineHighlight {
    position: absolute; left: 0; right: 0;
    height: var(--code-line-height);
    background: rgba(240, 136, 62, 0.28);
    border-top: 1px solid #f0883e; border-bottom: 1px solid #f0883e;
    pointer-events: none; opacity: 0;
    transition: opacity .3s; z-index: 1;
}
#lineHighlight.show { opacity: 1; animation: highlightFade 1.6s ease-out forwards; }
@keyframes highlightFade {
    0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; }
}

#lineSuggest {
    position: absolute; left: 0; right: 0;
    height: var(--code-line-height);
    background: rgba(56, 139, 253, 0.22);
    border-top: 1px dashed #58a6ff;
    border-bottom: 1px dashed #58a6ff;
    pointer-events: none; display: none; z-index: 1;
}
#lineSuggest.show { display: block; }
#lineSuggest::after {
    content: attr(data-label);
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    font-family: Consolas, monospace;
    font-size: 10px; font-weight: bold;
    color: #58a6ff; background: #0d1117;
    padding: 1px 6px; border-radius: 3px;
    border: 1px solid #58a6ff; white-space: nowrap;
}

#searchOverlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1; overflow: hidden;
    contain: strict;
}
.search-match {
    position: absolute;
    background: rgba(240, 196, 116, 0.35);
    border: 1px solid rgba(240, 196, 116, 0.7);
    border-radius: 2px; pointer-events: none;
}
.search-match.current {
    background: rgba(240, 136, 62, 0.55);
    border: 1px solid #f0883e;
    box-shadow: 0 0 0 1px #f0883e;
}

#iframe-wrap { width: 100%; height: 460px; background: #ffffff; position: relative; }
#preview { display: block; width: 100%; height: 100%; border: 0; background: #ffffff; }
#previewLoading {
    position: absolute; inset: 0;
    background: rgba(13, 17, 23, 0.75);
    display: none;
    align-items: center; justify-content: center;
    color: #58a6ff; font-size: 13px;
    font-family: Consolas, monospace;
    z-index: 5;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
}
#previewLoading.show { display: flex; }
#previewLoading .spinner {
    width: 16px; height: 16px;
    border: 2px solid #30363d;
    border-top-color: #58a6ff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

body.preview-mode { overflow: hidden; }
body.preview-mode header,
body.preview-mode .tabs,
body.preview-mode .search-bar,
body.preview-mode #panel-code,
body.preview-mode .buttons,
body.preview-mode .filters,
body.preview-mode .goto-bar,
body.preview-mode .delete-bar,
body.preview-mode #status,
body.preview-mode #errors,
body.preview-mode .hint { display: none !important; }
body.preview-mode .workspace { padding: 0; }
body.preview-mode #panel-preview {
    display: block !important;
    position: fixed; inset: 0;
    border: 0; border-radius: 0;
    z-index: 9999; background: #ffffff;
}
body.preview-mode #panel-preview .panel-header {
    display: flex;
    position: fixed; top: 0; left: 0; right: 0;
    padding: 0 12px;
    background: rgba(22, 27, 34, 0.95);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid #30363d;
    z-index: 10000;
    padding-top: env(safe-area-inset-top, 0);
    height: calc(48px + env(safe-area-inset-top, 0px));
}
body.preview-mode #iframe-wrap {
    position: fixed;
    top: calc(48px + env(safe-area-inset-top, 0px));
    left: 0; right: 0; bottom: 0;
    width: 100%; height: auto; background: #ffffff;
}
body.preview-mode #preview { width: 100%; height: 100%; }

#backToCode {
    display: none;
    background: #1f6feb; color: white;
    border: 0; border-radius: 6px;
    padding: 7px 12px; font-size: 13px; font-weight: bold;
    cursor: pointer; margin-left: 8px; flex-shrink: 0;
}
body.preview-mode #backToCode { display: inline-block; }

#refreshPreview {
    display: none;
    background: #21262d; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 7px 10px; font-size: 13px; font-weight: bold;
    cursor: pointer; flex-shrink: 0;
}
#refreshPreview:hover { background: #30363d; }
body.preview-mode #refreshPreview { display: inline-block; }

#panel-preview .panel-header .left-group {
    display: flex; align-items: center; gap: 8px; min-width: 0;
}
#panel-preview .panel-header .right-group {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

.buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px; margin: 10px 0; }
button.action { border: 0; border-radius: 7px; padding: 10px 14px; color: white; font-size: 14px; cursor: pointer; }
button.action:active { transform: scale(.97); }
.check { background: #1f6feb; } .run { background: #238636; }
.format { background: #8250df; } .clear { background: #484f58; }
.save { background: #2ea043; }
.save:hover { background: #3fb950; }
.open  { background: #bf8700; }
.open:hover { background: #d4a017; }

/* ====== HAPUS BARIS BAR ====== */
.delete-bar {
    display: flex; gap: 8px;
    margin: 8px 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
}
.delete-bar label {
    font-size: 13px; color: #8b949e;
    font-weight: bold; flex-shrink: 0;
}
.delete-bar input[type="number"] {
    width: 80px; background: #0d1117;
    border: 1px solid #30363d; border-radius: 6px;
    color: #e6edf3; padding: 7px 10px;
    font-size: 13px; font-family: Consolas, monospace;
    outline: none; text-align: center;
    -moz-appearance: textfield;
}
.delete-bar input[type="number"]::-webkit-outer-spin-button,
.delete-bar input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
}
.delete-bar input[type="number"]:focus {
    border-color: #f85149;
    box-shadow: 0 0 0 2px rgba(248, 81, 73, 0.25);
}
.delete-bar .sep { color: #6e7681; font-size: 12px; }
.delete-bar .btn-del {
    background: #da3633; color: white;
    border: 0; border-radius: 6px;
    padding: 8px 16px; font-size: 13px;
    font-weight: bold; cursor: pointer;
}
.delete-bar .btn-del:hover { background: #f85149; }
.delete-bar .btn-del:active { transform: scale(.96); }
.delete-bar .btn-del-clear {
    background: #21262d; color: #8b949e;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
    font-weight: bold; cursor: pointer;
}
.delete-bar .btn-del-clear:hover { background: #30363d; color: #e6edf3; }
.delete-bar .btn-del-clear:active { transform: scale(.96); }
.delete-bar .del-info {
    font-size: 12px; color: #8b949e;
    font-family: Consolas, monospace;
    padding: 4px 8px; background: #0d1117;
    border-radius: 4px; min-width: 60px;
    flex-shrink: 0; text-align: center;
}
.delete-bar .del-info.ok { color: #7ee787; }
.delete-bar .del-info.err { color: #ff7b72; }

#status { margin: 10px 12px; padding: 11px; border-radius: 7px; background: #161b22; border: 1px solid #30363d; }
.success { color: #7ee787; border-color: #238636 !important; }
.error-status { color: #ff7b72; border-color: #da3633 !important; }
.warn-status { color: #d29922; border-color: #9e6a03 !important; }

#errors { display: flex; flex-direction: column; gap: 10px; margin: 10px 12px; }
.error-item {
    background: #161b22; border: 1px solid #30363d;
    border-left: 4px solid #f85149; border-radius: 6px; padding: 10px;
    cursor: pointer;
}
.error-item.warn { border-left-color: #d29922; }
.error-item.warn .error-title { color: #d29922; }
.error-title { color: #ff7b72; font-weight: bold; margin-bottom: 4px; }
.error-location { color: #8b949e; font-family: monospace; font-size: 12px; margin-bottom: 6px; }

.error-fix {
    background: #0d2818; border: 1px solid #238636;
    border-radius: 5px; padding: 8px; margin-top: 6px;
    font-size: 13px; color: #7ee787;
}
.error-fix-label { font-weight: bold; color: #3fb950; margin-bottom: 3px; display: block; }
.error-fix code {
    display: block; background: #000; color: #7ee787;
    padding: 6px 8px; border-radius: 4px; margin-top: 4px;
    font-family: Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-all;
}

.error-suggest {
    background: rgba(56, 139, 253, 0.08);
    border: 1px solid #1f6feb;
    border-radius: 5px; padding: 8px;
    margin-top: 6px; font-size: 13px;
    color: #79c0ff;
}
.error-suggest-label {
    font-weight: bold; color: #58a6ff;
    margin-bottom: 4px; display: block;
}
.error-suggest .suggest-line {
    background: #0d1117;
    border-left: 3px solid #58a6ff;
    padding: 6px 10px; margin-top: 4px;
    font-family: Consolas, monospace;
    font-size: 12px; color: #e6edf3;
    white-space: pre-wrap; word-break: break-all;
    border-radius: 3px;
}
.error-suggest .suggest-line .line-tag { color: #6e7681; font-size: 11px; margin-right: 6px; }
.error-suggest .suggest-line .new-content { color: #7ee787; font-weight: bold; }
.error-suggest .suggest-line .arrow { color: #6e7681; margin: 0 6px; }

.error-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn-goto {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1f6feb; color: white;
    border: 0; border-radius: 6px;
    padding: 8px 14px; font-size: 13px; font-weight: bold;
    cursor: pointer; user-select: none;
}
.btn-goto:hover { background: #388bfd; }
.btn-goto:active { transform: scale(.95); background: #1158c7; }
.btn-goto-suggest { background: #0d4a8a; border: 1px solid #58a6ff; }
.btn-goto-suggest:hover { background: #1560a8; }

.hint { margin: 0 12px 10px; font-size: 12px; color: #8b949e; font-style: italic; }

.filters { display: flex; gap: 6px; margin: 8px 12px; flex-wrap: wrap; }
.pill {
    background: #21262d; border: 1px solid #30363d; color: #8b949e;
    border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; user-select: none;
}
.pill.active { background: #1f6feb; color: white; border-color: #1f6feb; }

.goto-bar {
    display: flex; gap: 6px; margin: 8px 12px;
    align-items: center; flex-wrap: wrap;
}
.goto-bar label { font-size: 12px; color: #8b949e; }
.goto-bar input {
    width: 90px; background: #0d1117;

    font-size: 13px; font-family: Consolas, monospace; outline: none;

.goto-bar input:focus { border-color: #1f6feb; }

    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);

}

/* ⚡ Kolom info total baris — hanya display, tidak bisa diklik */

<script>
/* =====================================================
   STATE
===================================================== */
let lastRenderedCode = null;
let lastSuggestLine = null;
let currentFileName = "index";

/* =====================================================
   FITUR COPY
===================================================== */
function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        ta.setAttribute("readonly", "");
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        try {
            const ok = document.execCommand("copy");
            document.body.removeChild(ta);
            ok ? resolve() : reject(new Error("execCommand copy gagal"));
        } catch (err) {
            document.body.removeChild(ta);
            reject(err);
        }
    });
}
function showCopyFeedback(button) {
    if (!button) return;
    const originalHTML = button.innerHTML;
    button.classList.add("copied");
    button.innerHTML = "✅";
    clearTimeout(button.__copyTimer);
    button.__copyTimer = setTimeout(() => {
        button.classList.remove("copied");
        button.innerHTML = originalHTML;
    }, 1500);
}
function copyAllCode(button) {
    const code = document.getElementById("code").value;
    if (!code.trim()) {
        showToastError("⚠️ Tidak ada kode untuk disalin.");
        return;
    }
    copyToClipboard(code)
        .then(() => {
            showToast("📋 Kode berhasil disalin ke clipboard!");
            showCopyFeedback(button);
        })
        .catch(() => {
            const ta = document.getElementById("code");
            ta.focus(); ta.select();
            try {
                document.execCommand("copy");
                showToast("📋 Kode disalin (mode fallback).");
                showCopyFeedback(button);
            } catch (e) {
                showToastError("❌ Gagal menyalin kode.");
            }
        });
}
document.getElementById("copyTabBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    copyAllCode(e.currentTarget);
});
document.getElementById("copyPanelBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    copyAllCode(e.currentTarget);
});

/* =====================================================
   SIMPAN
===================================================== */
function openSaveModal() {
    const modal = document.getElementById("saveModal");
    const nameInput = document.getElementById("saveFileName");
    nameInput.value = currentFileName || "index";
    updateFilenamePreview();
    modal.classList.add("show");
    setTimeout(() => { nameInput.focus(); nameInput.select(); }, 50);
}
function closeSaveModal() {
    document.getElementById("saveModal").classList.remove("show");
}
function updateFilenamePreview() {
    const name = document.getElementById("saveFileName").value.trim() || "index";
    const fmt = document.getElementById("saveFormat").value;
    document.getElementById("filenamePreview").textContent = name + "." + fmt;
}
function confirmSave() {
    let name = document.getElementById("saveFileName").value.trim() || "index";
    const fmt = document.getElementById("saveFormat").value;
    name = name.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
    if (!/\.(html|htm|txt)$/i.test(name)) {
    } else {
        const ext = name.match(/\.(html|htm|txt)$/i)[1].toLowerCase();
        name = name.replace(/\.(html|htm|txt)$/i, "");
        document.getElementById("saveFormat").value = ext;
    }
    const filename = name + "." + fmt;
    const content = codeArea.value;
    const blob = new Blob([content], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 100);
    currentFileName = name;
    document.title = filename + " — HTML Code Checker";
    showToast("✅ Tersimpan: " + filename);
    closeSaveModal();
}

function showToast(msg, duration = 2500) {
    let toast = document.getElementById("__toast");
    if (!toast) {
        toast = document.createElement("div");
        toast.id = "__toast";
        toast.style.cssText = `
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #161b22; border: 1px solid #2ea043;
            color: #7ee787; padding: 12px 20px; border-radius: 8px;
            font-size: 13px; font-weight: bold; z-index: 999999;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            opacity: 0; transition: opacity .25s, transform .25s;
            pointer-events: none; max-width: 90%; text-align: center;
        `;
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.borderColor = "#2ea043";
    toast.style.color = "#7ee787";
    requestAnimationFrame(() => {
        toast.style.opacity = "1";
        toast.style.transform = "translateX(-50%) translateY(0)";
    });
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(20px)";
    }, duration);
}
function showToastError(msg, duration = 2500) {
    let toast = document.getElementById("__toast");
    if (!toast) { showToast(msg, duration); toast = document.getElementById("__toast"); }
    toast.style.borderColor = "#da3633";
    toast.style.color = "#ff7b72";
    toast.textContent = msg;
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(20px)";
    }, duration);
}

/* =====================================================
   BUKA FILE
===================================================== */
function openLoadFile() {
    document.getElementById("loadFileInput").click();
}
document.getElementById("loadFileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
        codeArea.value = evt.target.result;
        const baseName = file.name.replace(/\.[^.]+$/, "");
        currentFileName = baseName;
        document.title = file.name + " — HTML Code Checker";
        lastRenderedCode = null;
        document.getElementById("previewStatus").textContent = "siap";
        document.getElementById("previewStatus").classList.remove("live");
        __lineOffsetsDirty = true;
        __lastLineCount = -1;
        scheduleLineNumbersUpdate();
        scheduleBracketUpdate();
        updateDeleteBarInfo();
        showToast("📂 Dibuka: " + file.name);
    };
    reader.readAsText(file);
    e.target.value = "";
});

document.getElementById("saveModal").addEventListener("click", (e) => {
    if (e.target.id === "saveModal") closeSaveModal();
});
document.getElementById("saveFileName").addEventListener("input", updateFilenamePreview);
document.getElementById("saveFormat").addEventListener("change", updateFilenamePreview);
document.getElementById("saveFileName").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); confirmSave(); }
    if (e.key === "Escape") { e.preventDefault(); closeSaveModal(); }
});
document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        openSaveModal();
    }
});

/* =====================================================
   TAB SWITCHER
===================================================== */
function switchTab(name) {
    document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === name);
    });
    document.querySelectorAll(".panel").forEach(p => {
        p.classList.toggle("active", p.id === "panel-" + name);
    });
    if (name === "preview") {
        enterPreviewMode();
        renderPreview(false);
    } else {
        exitPreviewMode();
        cachedCharW = 0;
        setTimeout(() => { scheduleBracketUpdate(); redrawSearchHighlights(); }, 30);
    }
}
function enterPreviewMode() { document.body.classList.add("preview-mode"); }
function exitPreviewMode() {
    document.body.classList.remove("preview-mode");
    document.getElementById("previewLoading").classList.remove("show");
}

function renderPreview(showLoading) {
    const iframe = document.getElementById("preview");
    const status = document.getElementById("previewStatus");
    const loading = document.getElementById("previewLoading");
    const code = codeArea.value;
    if (!code.trim()) {
        iframe.srcdoc = "<!DOCTYPE html><html><body style='margin:0;background:#0d1117;color:#6e7681;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;'><div>Preview kosong</div></body></html>";
        status.textContent = "kosong";
        status.classList.remove("live", "dirty");
        return;
    }
    if (showLoading) loading.classList.add("show");
    iframe.srcdoc = "";
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            try {
                iframe.srcdoc = code;
                lastRenderedCode = code;
                status.textContent = "live";
                status.classList.remove("dirty");
                status.classList.add("live");
                iframe.addEventListener("load", () => loading.classList.remove("show"), { once: true });
                setTimeout(() => loading.classList.remove("show"), 800);
            } catch (e) {
                loading.classList.remove("show");
                status.textContent = "error";
                status.classList.remove("live", "dirty");
            }
        });
    });
}
function runCode() { renderPreview(true); switchTab("preview"); }
document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => switchTab(tab.dataset.tab));
});

/* =====================================================
   BAGIAN INTI
===================================================== */
const codeArea    = document.getElementById("code");
const lineNumbers = document.getElementById("lineNumbers");
const overlay     = document.getElementById("bracketOverlay");
const lineHighlight = document.getElementById("lineHighlight");
const lineSuggest = document.getElementById("lineSuggest");
const searchOverlay = document.getElementById("searchOverlay");
const codeWrapper = document.getElementById("codeWrapper");

window.__lastErrorLines = [];
window.__lastWarnLines  = [];
window.__lastSuggestLines = [];
window.__allErrors      = [];
window.__activeFilter   = "all";
window.__currentErrorIndex = -1;

/* =====================================================
   LINE INDEX CACHE
===================================================== */
let __lineOffsets = [0];
let __lineOffsetsDirty = false;

function rebuildLineOffsets() {
    const text = codeArea.value;
    const arr = [0];
    let idx = -1;
    while ((idx = text.indexOf("\n", idx + 1)) !== -1) {
        arr.push(idx + 1);
    }
    __lineOffsets = arr;
    __lineOffsetsDirty = false;
}

function lineFromIndexFast(index) {
    if (__lineOffsetsDirty) rebuildLineOffsets();
    const arr = __lineOffsets;
    let lo = 0, hi = arr.length - 1;
    while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (arr[mid] <= index) lo = mid;
        else hi = mid - 1;
    }
    return lo + 1;
}

function colFromIndexFast(index) {
    if (__lineOffsetsDirty) rebuildLineOffsets();
    const line = lineFromIndexFast(index);
    return index - __lineOffsets[line - 1] + 1;
}

function positionFromIndexFast(index) {
    return { line: lineFromIndexFast(index), column: colFromIndexFast(index) };
}
function indexFromLineColFast(line, col) {
    if (__lineOffsetsDirty) rebuildLineOffsets();
    const l = Math.max(1, Math.min(line, __lineOffsets.length));
    return __lineOffsets[l - 1] + (col - 1);
}

/* =====================================================
   SCHEDULER
===================================================== */
let __lineNumbersTimer = null;
function scheduleLineNumbersUpdate() {
    if (__lineNumbersTimer) return;
    __lineNumbersTimer = setTimeout(() => {
        __lineNumbersTimer = null;
        updateLineNumbers(window.__lastErrorLines, window.__lastWarnLines);
    }, 120);
}

let __bracketRaf = null;
function scheduleBracketUpdate() {
    if (__bracketRaf) return;
    __bracketRaf = requestAnimationFrame(() => {
        __bracketRaf = null;
        updateBracketMatching();
    });
}

let __scrollRaf = null;
function scheduleScrollUpdate() {
    if (__scrollRaf) return;
    __scrollRaf = requestAnimationFrame(() => {
        __scrollRaf = null;
        updateBracketMatching();
        redrawSearchHighlights();
    });
}

/* =====================================================
   EVENT LISTENERS
===================================================== */
codeArea.addEventListener("input", () => {
    __lineOffsetsDirty = true;
    const status = document.getElementById("previewStatus");
    if (lastRenderedCode !== null && lastRenderedCode !== codeArea.value) {
        if (status.textContent === "live") {
            status.textContent = "perlu refresh";
            status.classList.remove("live");
            status.classList.add("dirty");
        }
    } else if (lastRenderedCode === null && codeArea.value.trim()) {
        if (status.textContent !== "siap") {
            status.textContent = "siap";
            status.classList.remove("live", "dirty");
        }
    }
    scheduleLineNumbersUpdate();
    scheduleBracketUpdate();
    updateDeleteBarInfo();
});

let __lastCursorLine = -1;
let __cursorRaf = null;
function scheduleCursorUpdate() {
    if (__cursorRaf) return;
    __cursorRaf = requestAnimationFrame(() => {
        __cursorRaf = null;
        const selStart = codeArea.selectionStart;
        const selEnd = codeArea.selectionEnd;
        if (selEnd - selStart > 50) return;
        const line = lineFromIndexFast(selStart);
        if (line !== __lastCursorLine) {
            __lastCursorLine = line;
            scheduleBracketUpdate();
        }
    });
}
codeArea.addEventListener("keyup", scheduleCursorUpdate);
codeArea.addEventListener("click", scheduleCursorUpdate);

    clearTimeout(__selectIdleTimer);

/* =====================================================
   ANALISIS BRACKET
===================================================== */
function analyzeUnclosedBracket(text, openIndex, openChar) {
    const closeChar = { "(": ")", "{": "}", "[": "]" }[openChar];
    const lines = text.split("\n");
    const openPos = positionFromIndex(text, openIndex);

    let depth = 1;
    let scanIdx = openIndex + 1;
    let blockEndIndex = text.length;
    while (scanIdx < text.length && depth > 0) {
        const c = text[scanIdx];
        if (c === openChar) depth++;
        else if (c === closeChar) {
            depth--;
            if (depth === 0) { blockEndIndex = scanIdx; break; }
        }
        scanIdx++;
    }

    let endLine;
    if (depth === 0) {
        endLine = positionFromIndex(text, blockEndIndex).line;
    } else {
        endLine = lines.length;
    }

    let suggestLine = endLine;
    for (let i = endLine - 1; i >= openPos.line - 1; i--) {
        const lineText = lines[i] || "";
        const stripped = lineText.replace(/\/\/.*$/, "").replace(/\/\*[\s\S]*?\*\//g, "").trim();
        if (stripped !== "") { suggestLine = i + 1; break; }
    }
    if (suggestLine < openPos.line) suggestLine = openPos.line;

    const beforeLine = lines[suggestLine - 1] || "";
    const afterLine = lines[suggestLine] || "";
    const openIndent = lines[openPos.line - 1].match(/^(\s*)/)[1];
    const suggestion = openIndent + closeChar;

    return {
        closeChar, openLine: openPos.line,
        suggestLine, endLine, beforeLine, afterLine,
        suggestion, openIndent
    };
}

window.__searchQuery   = "";
window.__searchMatches = [];
window.__searchIndex   = -1;
window.__searchCase    = false;
window.__searchRegex   = false;
window.__searchWhole   = false;

const MAX_SEARCH_HIGHLIGHTS = 400;

function buildSearchRegex(query) {
    if (!query) return null;
    let pattern = window.__searchRegex ? query : query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (window.__searchWhole) pattern = "\\b" + pattern + "\\b";
    const flags = "g" + (window.__searchCase ? "" : "i");
    try { return new RegExp(pattern, flags); } catch (e) { return null; }
}
function performSearch() {
    const query = searchInput.value;
    window.__searchQuery = query;
    window.__searchMatches = [];
    window.__searchIndex = -1;
    if (!query) {
        searchInput.classList.remove("no-match");
        updateSearchInfo("idle"); redrawSearchHighlights();
        updateSearchLineNumbers(); updateNavButtons();
        return;
    }
    const regex = buildSearchRegex(query);
    if (!regex) {
        searchInput.classList.add("no-match");
        updateSearchInfo("Regex tidak valid");
        updateNavButtons(); return;
    }
    const text = codeArea.value;
    let m, safety = 0;
    while ((m = regex.exec(text)) !== null && safety++ < 10000) {
        if (m[0].length === 0) { regex.lastIndex++; continue; }
        const pos = positionFromIndexFast(m.index);
        window.__searchMatches.push({
            start: m.index, end: m.index + m[0].length,
            line: pos.line, col: pos.column, text: m[0]
        });
    }
    if (window.__searchMatches.length > 0) {
        window.__searchIndex = 0;
        searchInput.classList.remove("no-match");
        updateSearchInfo(); redrawSearchHighlights();
        updateSearchLineNumbers(); updateNavButtons();
        scrollToSearchMatch(0);
    } else {
        searchInput.classList.add("no-match");
        updateSearchInfo(); redrawSearchHighlights();
        updateSearchLineNumbers(); updateNavButtons();
    }
}
function updateSearchInfo(customState) {
    const total = window.__searchMatches.length;
    if (customState === "idle" || !window.__searchQuery) {
        searchInfo.textContent = "—"; searchInfo.className = "search-info idle"; return;
    }
    if (typeof customState === "string" && customState !== "idle") {
        searchInfo.textContent = customState; searchInfo.className = "search-info no-match"; return;
    }
    if (total === 0) { searchInfo.textContent = "0/0"; searchInfo.className = "search-info no-match"; return; }
    searchInfo.textContent = (window.__searchIndex + 1) + "/" + total;
    searchInfo.className = "search-info has-match";
}
function updateNavButtons() {
    const has = window.__searchMatches.length > 0;
    btnNext.disabled = !has; btnPrev.disabled = !has;
}
function redrawSearchHighlights() {
    searchOverlay.innerHTML = "";
    if (!window.__searchQuery || window.__searchMatches.length === 0) {
        codeWrapper.classList.remove("search-active"); return;
    }
    codeWrapper.classList.add("search-active");
    const lineH = parseFloat(getComputedStyle(codeArea).lineHeight);
    const padY  = parseFloat(getComputedStyle(codeArea).paddingTop);
    const padX  = parseFloat(getComputedStyle(codeArea).paddingLeft);
    const sTop  = codeArea.scrollTop;
    const sLeft = codeArea.scrollLeft;
    const charW = measureCharWidth();
    const viewH = codeArea.clientHeight;
    const viewW = codeArea.clientWidth;
    const firstVisibleLine = Math.max(0, Math.floor((sTop - padY) / lineH));
    const lastVisibleLine  = Math.ceil((sTop + viewH - padY) / lineH);

    let rendered = 0;
    window.__searchMatches.forEach((match, idx) => {
        if (rendered >= MAX_SEARCH_HIGHLIGHTS) return;
        if (match.line < firstVisibleLine || match.line > lastVisibleLine + 1) return;
        const y = (match.line - 1) * lineH + padY - sTop;
        const matchText = match.text;
        const linesInMatch = matchText.split("\n");
        if (linesInMatch.length === 1) {
            const x = (match.col - 1) * charW + padX - sLeft;
            const w = matchText.length * charW;
            if (x + w < 0 || x > viewW + 50) return;
            const el = document.createElement("div");
            el.className = "search-match" + (idx === window.__searchIndex ? " current" : "");
            el.style.left = x + "px"; el.style.top = y + "px";
            el.style.width = w + "px"; el.style.height = lineH + "px";
            searchOverlay.appendChild(el);
            rendered++;
        } else {
            linesInMatch.forEach((part, i) => {
                if (rendered >= MAX_SEARCH_HIGHLIGHTS) return;
                const yLine = y + i * lineH;
                if (yLine + lineH < 0 || yLine > viewH) return;
                const xStart = (i === 0) ? (match.col - 1) * charW + padX - sLeft : padX - sLeft;
                const w = part.length * charW;
                if (w === 0) return;
                const el = document.createElement("div");
                el.className = "search-match" + (idx === window.__searchIndex ? " current" : "");
                el.style.left = xStart + "px"; el.style.top = yLine + "px";
                el.style.width = w + "px"; el.style.height = lineH + "px";
                searchOverlay.appendChild(el);
                rendered++;
            });
        }
    });
}
function updateSearchLineNumbers() {
    lineNumbers.querySelectorAll(".line-number.search-hit, .line-number.search-current").forEach(n => {
        n.classList.remove("search-hit", "search-current");
    });
    if (!window.__searchMatches.length) return;
    const hitLines = new Set();
    window.__searchMatches.forEach(m => hitLines.add(m.line));
    hitLines.forEach(line => {
        const el = lineNumbers.querySelector('.line-number[data-line="' + line + '"]');
        if (el) el.classList.add("search-hit");
    });
    if (window.__searchIndex >= 0 && window.__searchMatches[window.__searchIndex]) {
        const curLine = window.__searchMatches[window.__searchIndex].line;
        const el = lineNumbers.querySelector('.line-number[data-line="' + curLine + '"]');
        if (el) el.classList.add("search-current");
    }
}
function scrollToSearchMatch(idx) {
    const match = window.__searchMatches[idx];
    if (!match) return;
    window.__searchIndex = idx;
    const lineH = parseFloat(getComputedStyle(codeArea).lineHeight);
    const padY  = parseFloat(getComputedStyle(codeArea).paddingTop);
    const targetY = (match.line - 1) * lineH + padY;
    const viewH = codeArea.clientHeight;
    codeArea.scrollTop = Math.max(0, targetY - viewH / 2 + lineH / 2);
    lineNumbers.scrollTop = codeArea.scrollTop;
    codeArea.focus();
    try { codeArea.setSelectionRange(match.start, match.end); } catch (e) {}
    updateSearchInfo(); redrawSearchHighlights();
    updateSearchLineNumbers(); scheduleBracketUpdate();
}
function searchNext() {
    if (!window.__searchMatches.length) return;
    scrollToSearchMatch((window.__searchIndex + 1) % window.__searchMatches.length);
}
function searchPrev() {
    if (!window.__searchMatches.length) return;
    scrollToSearchMatch((window.__searchIndex - 1 + window.__searchMatches.length) % window.__searchMatches.length);
}
function clearSearch() {
    searchInput.value = "";
    window.__searchQuery = "";
    window.__searchMatches = [];
    window.__searchIndex = -1;
    searchInput.classList.remove("no-match");
    searchOverlay.innerHTML = "";
    codeWrapper.classList.remove("search-active");
    updateSearchInfo("idle"); updateSearchLineNumbers(); updateNavButtons();

}
btnSearch.addEventListener("click", () => {
    if (!searchInput.value.trim()) { searchInput.focus(); return; }
    performSearch();
});
searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        if (e.shiftKey) {
            if (!window.__searchMatches.length) performSearch(); else searchPrev();
        } else {
            if (!window.__searchMatches.length || window.__searchQuery !== searchInput.value) performSearch();
            else searchNext();
        }
    } else if (e.key === "Escape") { e.preventDefault(); clearSearch(); }
});

btnPrev.addEventListener("click", searchPrev);

    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-code"));

    lineNumbers.scrollTop = codeArea.scrollTop;
    const index = indexFromLineColFast(line, 1);
    codeArea.focus();
    codeArea.setSelectionRange(index, index);
    if (flash) {

let __lastLineCount = -1;
function updateLineNumbers(errorLines = [], warnLines = [], matchedLines = [], activeLine = -1) {
    const lines = codeArea.value.split("\n");
    const needRebuild = lines.length !== __lastLineCount;
    if (needRebuild) {
        let html = "";
        for (let i = 0; i < lines.length; i++) {
            html += '<div class="line-number" data-line="' + (i + 1) + '">' + (i + 1) + "</div>";
        }
        lineNumbers.innerHTML = html;
        __lastLineCount = lines.length;
    }
    const errorSet = new Set(errorLines);
    const warnSet  = new Set(warnLines);
    const suggestSet = new Set(window.__lastSuggestLines);
    const matchedSet = new Set(matchedLines);
    const allNodes = lineNumbers.children;
    for (let i = 0; i < allNodes.length; i++) {
        const el = allNodes[i];
        const line = i + 1;
        el.classList.toggle("error",   errorSet.has(line));
        el.classList.toggle("warn",    !errorSet.has(line) && warnSet.has(line));
        el.classList.toggle("suggest", suggestSet.has(line));
        el.classList.toggle("matched", matchedSet.has(line));
        el.classList.toggle("active",  line === activeLine && !matchedSet.has(line));
    }
    updateSearchLineNumbers();
}
lineNumbers.addEventListener("click", e => {

/* =====================================================
   FUNGSI LAMA
===================================================== */
function positionFromIndex(text, index) {
    const before = text.substring(0, index);
    const lines  = before.split("\n");
    return { line: lines.length, column: lines[lines.length - 1].length + 1 };
}
function getIndexFromPosition(text, line, column) {
    const lines = text.split("\n");
    let index = 0;
    for (let i = 0; i < line - 1; i++) index += lines[i].length + 1;
    return index + column - 1;
}
function addError(list, text, index, message, fix = "", fixCode = "", severity = "error", lang = "general", suggest = null) {
    const pos = positionFromIndex(text, index);
    list.push({
        line: pos.line, column: pos.column,
        message, fix, fixCode, severity, lang, suggest
    });
}

const TAG_REGEX = /<\/?([A-Za-z][A-Za-z0-9:-]*)(?:\s[^<>]*?)?\/?>/g;
const VOID_TAGS = new Set(["area","base","br","col","embed","hr","img","input",
    "link","meta","param","source","track","wbr"]);

function tokenizeTags(code) {
    const tags = [];
    const re = new RegExp(TAG_REGEX.source, "g");
    let m;
    while ((m = re.exec(code)) !== null) {
        const full = m[0], name = m[1].toLowerCase();
        if (full.toLowerCase().startsWith("<!doctype")) continue;
        if (VOID_TAGS.has(name)) continue;
        if (full.endsWith("/>")) continue;
        tags.push({ name, index: m.index, end: m.index + full.length, isClose: full.startsWith("</") });
    }
    return tags;
}

function findTagPair(code, cursorIndex) {
    const WINDOW = 6000;
    const start = Math.max(0, cursorIndex - WINDOW);
    const end = Math.min(code.length, cursorIndex + WINDOW);
    const sub = code.substring(start, end);
    const tags = tokenizeTags(sub);
    for (const t of tags) { t.index += start; t.end += start; }
    let activeIdx = -1;
    for (let i = 0; i < tags.length; i++) {
        const t = tags[i];
        if (cursorIndex >= t.index && cursorIndex <= t.end) { activeIdx = i; break; }
    }
    if (activeIdx === -1) return null;
    const active = tags[activeIdx];
    if (!active.isClose) {
        let depth = 0;
        for (let i = activeIdx + 1; i < tags.length; i++) {
            const t = tags[i];
            if (t.name === active.name) {
                if (!t.isClose) depth++;
                else { if (depth === 0) return { open: active, close: t }; depth--; }
            }
        }
        return { open: active, close: null };
    } else {
        let depth = 0;
        for (let i = activeIdx - 1; i >= 0; i--) {
            const t = tags[i];
            if (t.name === active.name) {
                if (t.isClose) depth++;
                else { if (depth === 0) return { open: t, close: active }; depth--; }
            }
        }
        return { open: null, close: active };
    }
}
let cachedCharW = 0;
function measureCharWidth() {
    if (cachedCharW) return cachedCharW;
    const span = document.createElement("span");
    const cs = getComputedStyle(codeArea);
    span.style.font = cs.font; span.style.fontFamily = cs.fontFamily;
    span.style.fontSize = cs.fontSize; span.style.visibility = "hidden";
    span.style.position = "absolute"; span.style.whiteSpace = "pre";
    span.textContent = "MMMMMMMMMM";
    document.body.appendChild(span);
    cachedCharW = span.getBoundingClientRect().width / 10;
    document.body.removeChild(span);
    return cachedCharW;
}
function padX() { return parseFloat(getComputedStyle(codeArea).paddingLeft); }
function drawBracketLines(pair) {
    overlay.innerHTML = "";
    if (!pair || !pair.open || !pair.close) return;
    if (!overlay.clientHeight) return;
    const openPos  = positionFromIndexFast(pair.open.index);
    const closePos = positionFromIndexFast(pair.close.index);
    const lineH = parseFloat(getComputedStyle(codeArea).lineHeight);
    const padY  = parseFloat(getComputedStyle(codeArea).paddingTop);
    const sTop  = codeArea.scrollTop;
    const sLeft = codeArea.scrollLeft;
    const charW = measureCharWidth();
    const openX  = (openPos.column  - 1) * charW + padX() - sLeft;
    const closeX = (closePos.column - 1) * charW + padX() - sLeft;
    const openY  = (openPos.line  - 1) * lineH + padY + lineH / 2 - sTop;
    const closeY = (closePos.line - 1) * lineH + padY + lineH / 2 - sTop;
    const H = overlay.clientHeight;
    if (closeY < -40 || openY > H + 40) return;
    const stroke = "#58a6ff", NS = "http://www.w3.org/2000/svg";
    const startX = Math.max(0, openX - 4);
    const endX   = Math.max(0, closeX - 4);
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", ["M",startX,openY,"L",startX,closeY,"L",endX,closeY].join(" "));
    path.setAttribute("fill","none"); path.setAttribute("stroke",stroke);
    path.setAttribute("stroke-width","1.5"); path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round"); path.setAttribute("opacity","0.9");
    overlay.appendChild(path);
    [ [startX,openY], [endX,closeY] ].forEach(([x,y]) => {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx",x); c.setAttribute("cy",y);
        c.setAttribute("r","3"); c.setAttribute("fill",stroke);
        overlay.appendChild(c);
    });
}
function updateBracketMatching() {
    const selStart = codeArea.selectionStart;
    const selEnd   = codeArea.selectionEnd;
    if (selEnd - selStart > 50) { overlay.innerHTML = ""; return; }
    const cursor = selStart;
    const code   = codeArea.value;
    const pair   = findTagPair(code, cursor);
    const matchedLines = [];
    if (pair && pair.open && pair.close) {
        matchedLines.push(
            positionFromIndexFast(pair.open.index).line,
            positionFromIndexFast(pair.close.index).line
        );
    } else if (pair && (pair.open || pair.close)) {
        const t = pair.open || pair.close;
        matchedLines.push(positionFromIndexFast(t.index).line);
    }
    const activeLine = lineFromIndexFast(cursor);
    updateLineNumbers(window.__lastErrorLines, window.__lastWarnLines, matchedLines, activeLine);
    drawBracketLines(pair);
}

        updateDeleteBarInfo();

function deleteLineRange() {
    const startInput = document.getElementById("delStartLine");
    const endInput = document.getElementById("delEndLine");

    const totalLines = codeArea.value.split("\n").length;
    let start = parseInt(startInput.value, 10);
    let end = parseInt(endInput.value, 10);

    if (isNaN(start) || start < 1) {
        lockDelInfo("⚠️ Isi baris awal", "err");
        startInput.focus();
        return;
    }
    if (isNaN(end) || end < 1) end = start;
    if (start > end) { const t = start; start = end; end = t; }
    if (start > totalLines) {
        lockDelInfo("⚠️ Maks " + totalLines, "err");
        return;
    }
    if (end > totalLines) end = totalLines;

    const jumlah = end - start + 1;
    const confirmMsg = "Hapus " + jumlah + " baris (baris " + start + " s/d " + end + ")?\n\n" +
        "Total baris sekarang: " + totalLines + "\n" +
        "Setelah dihapus: " + (totalLines - jumlah) + " baris.";

    if (!confirm(confirmMsg)) return;

    const lines = codeArea.value.split("\n");
    lines.splice(start - 1, jumlah);
    codeArea.value = lines.join("\n");

    __lineOffsetsDirty = true;
    __lastLineCount = -1;
    lastRenderedCode = null;

    const status = document.getElementById("previewStatus");
    if (status.textContent === "live") {
        status.textContent = "perlu refresh";
        status.classList.remove("live");
        status.classList.add("dirty");
    }

    updateLineNumbers(window.__lastErrorLines, window.__lastWarnLines);
    scheduleBracketUpdate();

    const targetLine = Math.min(start, lines.length);
    if (targetLine >= 1) {
        const targetIndex = indexFromLineColFast(targetLine, 1);
        codeArea.focus();
        codeArea.setSelectionRange(targetIndex, targetIndex);
        setTimeout(() => scrollToLine(targetLine, true), 50);
    }

    lockDelInfo("✅ " + jumlah + " baris dihapus", "ok");

    startInput.value = "";
    endInput.value = "";

    showToast("🗑 " + jumlah + " baris dihapus (baris " + start + "–" + end + ")");
}

function clearDeleteInputs() {
    document.getElementById("delStartLine").value = "";
    document.getElementById("delEndLine").value = "";
    const info = document.getElementById("delInfo");
    info.dataset.locked = "0";
    updateDeleteBarInfo();
}

function deleteCurrentLine() {
    const line = lineFromIndexFast(codeArea.selectionStart);
    document.getElementById("delStartLine").value = line;
    document.getElementById("delEndLine").value = line;
    deleteLineRange();
}

function deleteEmptyLines() {
    const lines = codeArea.value.split("\n");
    const total = lines.length;
    const confirmMsg = "Hapus SEMUA baris kosong dari " + total + " baris?";
    if (!confirm(confirmMsg)) return;

    const kept = lines.filter(l => l.trim() !== "");
    const dihapus = lines.length - kept.length;

    if (dihapus === 0) {
        lockDelInfo("Tidak ada baris kosong", "err");
        return;
    }

    codeArea.value = kept.join("\n");

    __lineOffsetsDirty = true;
    __lastLineCount = -1;
    lastRenderedCode = null;

    updateLineNumbers();
    scheduleBracketUpdate();
    lockDelInfo("✅ " + dihapus + " baris kosong dihapus", "ok");

    showToast("🗑 " + dihapus + " baris kosong dihapus");
}

document.getElementById("delStartLine").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("delEndLine").focus();
    }
});
document.getElementById("delEndLine").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        deleteLineRange();
    }
    if (e.key === "Escape") {

document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "d") {

    }

    if (!/<head[\s>]/i.test(code))
        addError(errors, code, 0, "Dokumen tidak memiliki tag <head>.",
            "Tambahkan <head> ... </head>.", "<head>...</head>", "error", "html");
    if (!/<body[\s>]/i.test(code))
        addError(errors, code, 0, "Dokumen tidak memiliki tag <body>.",
            "Tambahkan <body> ... </body>.", "<body>...</body>", "error", "html");
}
function extractBlocks(code, tag) {
    const result = [];
    const regex = new RegExp("<" + tag + "\\b[^>]*>([\\s\\S]*?)<\\/" + tag + "\\s*>", "gi");
    let match;
    while ((match = regex.exec(code)) !== null) {
        const content = match[1];
        const start = match.index + match[0].indexOf(">") + 1;
        result.push({ code: content, start });
    }
    return result;
}
function checkJavaScript(code, errors) {
    extractBlocks(code, "script").forEach(block => {
        const local = [];
        checkBrackets(block.code, local, "js");
        local.forEach(error => {
            const index = block.start + getIndexFromPosition(block.code, error.line, error.column);
            let adjustedSuggest = error.suggest;
            if (adjustedSuggest) {
                const blockStartPos = positionFromIndex(code, block.start);
                adjustedSuggest = Object.assign({}, adjustedSuggest, {
                    line: adjustedSuggest.line + (blockStartPos.line - 1)
                });
            }
            addError(errors, code, index,
                "JavaScript: " + error.message.replace(/^JavaScript: /, ""),
                error.fix, error.fixCode, error.severity || "error", "js",
                adjustedSuggest);
        });
        validateJSKeywords(block.code, code, block.start, errors);
    });
}
function checkCSS(code, errors) {
    extractBlocks(code, "style").forEach(block => {
        const local = [];
        checkBrackets(block.code, local, "css");
        local.forEach(error => {
            const index = block.start + getIndexFromPosition(block.code, error.line, error.column);
            let adjustedSuggest = error.suggest;
            if (adjustedSuggest) {
                const blockStartPos = positionFromIndex(code, block.start);
                adjustedSuggest = Object.assign({}, adjustedSuggest, {
                    line: adjustedSuggest.line + (blockStartPos.line - 1)
                });
            }
            addError(errors, code, index,
                "CSS: " + error.message.replace(/^CSS: /, ""),
                error.fix, error.fixCode, error.severity || "error", "css",
                adjustedSuggest);
        });
        validateCSSProperties(block.code, code, block.start, errors);
    });
}

function renderErrors() {
    const errors = document.getElementById("errors");
    const status = document.getElementById("status");
    errors.innerHTML = "";
    let list = window.__allErrors.slice();
    if (window.__activeFilter !== "all") {
        list = list.filter(e => e.lang === window.__activeFilter);
    }
    if (list.length === 0) {
        if (window.__allErrors.length === 0) {
            status.className = "success";
            status.innerHTML = "✅ Tidak ditemukan kesalahan sintaks.";
        } else {
            status.className = "warn-status";
            status.innerHTML = "ℹ️ Tidak ada error pada filter '" +
                window.__activeFilter.toUpperCase() + "'.";
        }
        return;
    }
    const nErr  = list.filter(e => e.severity === "error").length;
    const nWarn = list.length - nErr;
    status.className = nErr > 0 ? "error-status" : "warn-status";
    status.innerHTML = "❌ " + nErr + " error" +
        (nWarn > 0 ? " · ⚠️ " + nWarn + " peringatan" : "") +
        " — klik <b>🎯 Ke Baris</b> untuk ke baris error, <b>📍 Ke Baris Saran</b> untuk lihat tempat tutup.";
    list.forEach((error, idx) => {
        const div = document.createElement("div");
        div.className = "error-item" + (error.severity === "warn" ? " warn" : "");
        div.dataset.errorIdx = idx;
        const icon = error.severity === "warn" ? "⚠️" : "🔴";
        let html =
            '<div class="error-title">' + icon + ' #' + (idx + 1) + ' — ' +
            escapeHTML(error.message) + '</div>' +
            '<div class="error-location">📍 Baris ' + error.line +
            ', kolom ' + error.column +
            ' · <span style="color:#58a6ff">' + error.lang.toUpperCase() + '</span></div>';
        if (error.suggest) {
            const s = error.suggest;
            html += '<div class="error-suggest">' +
                '<span class="error-suggest-label">📍 Saran tempat menaruh penutup:</span>' +
                'Letakkan <b>' + escapeHTML(s.closeChar) + '</b> di <b>baris ' + s.line + '</b>';
            if (s.beforeLine !== undefined && s.beforeLine !== null) {
                html += '<div class="suggest-line">' +
                    '<span class="line-tag">' + (s.line - 1) + '</span>' +
                    escapeHTML(s.beforeLine) +
                    '</div>';
            }
            html += '<div class="suggest-line">' +
                '<span class="line-tag">' + s.line + '</span>' +
                '<span class="new-content">' + escapeHTML((s.indent || "") + s.closeChar) + '</span>' +
                '<span class="arrow">← tambahkan di sini</span>' +
                '</div>';
            if (s.afterLine) {
                html += '<div class="suggest-line">' +
                    '<span class="line-tag">' + (s.line + 1) + '</span>' +
                    escapeHTML(s.afterLine) +
                    '</div>';
            }
            html += '</div>';
        }
        if (error.fix) {
            html += '<div class="error-fix">' +
                    '<span class="error-fix-label">💡 Perbaikan:</span>' +
                    escapeHTML(error.fix);
            if (error.fixCode)
                html += '<code>' + escapeHTML(error.fixCode) + '</code>';
            html += '</div>';
        }
        html += '<div class="error-actions">' +
                '<button class="btn-goto" data-goto="' + error.line + '" type="button">' +
                '<span>🎯</span> Ke Baris ' + error.line +
                '</button>';
        if (error.suggest) {
            html += '<button class="btn-goto btn-goto-suggest" data-goto-suggest="' +
                error.suggest.line + '" data-close="' + escapeHTML(error.suggest.closeChar) +
                '" data-indent="' + escapeHTML(error.suggest.indent || "") +
                '" type="button">' +
                '<span>📍</span> Ke Baris Saran (' + error.suggest.line + ')' +
                '</button>';
        }
        html += '</div>';
        div.innerHTML = html;
        div.querySelector(".btn-goto").addEventListener("click", (ev) => {
            ev.stopPropagation();
            scrollToLine(error.line, true);
            window.__currentErrorIndex = window.__allErrors.indexOf(error);
            updateNavInfo();
        });
        const btnSuggest = div.querySelector(".btn-goto-suggest");
        if (btnSuggest) {
            btnSuggest.addEventListener("click", (ev) => {
                ev.stopPropagation();
                scrollToSuggestLine(
                    parseInt(btnSuggest.dataset.gotoSuggest, 10),
                    btnSuggest.dataset.close,
                    btnSuggest.dataset.indent
                );
            });
        }
        div.addEventListener("click", (ev) => {
            if (ev.target.closest(".btn-goto")) return;
            scrollToLine(error.line, true);
            window.__currentErrorIndex = window.__allErrors.indexOf(error);
            updateNavInfo();
        });
        errors.appendChild(div);
    });
    window.__currentErrorIndex = -1;
    updateNavInfo();
}
document.querySelectorAll(".pill").forEach(pill => {
    pill.addEventListener("click", () => {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        window.__activeFilter = pill.dataset.filter;
        renderErrors();
    });
});
function checkAll() {
    const code = codeArea.value;
    const found = [];
    checkHTMLComments(code, found);
    checkHTMLStructure(code, found);
    checkHTMLTags(code, found);
    checkJavaScript(code, found);
    checkCSS(code, found);
    validateHTMLAttributes(code, found);
    const unique = [];
    const seen = new Set();
    found.forEach(e => {
        const key = e.line + "|" + e.column + "|" + e.message;
        if (!seen.has(key)) { seen.add(key); unique.push(e); }
    });
    unique.sort((a, b) => a.line - b.line || a.column - b.column);
    window.__allErrors = unique;
    window.__lastErrorLines = unique.filter(e => e.severity !== "warn").map(e => e.line);
    window.__lastWarnLines  = unique.filter(e => e.severity === "warn").map(e => e.line);
    window.__lastSuggestLines = unique
        .filter(e => e.suggest && e.suggest.line)
        .map(e => e.suggest.line);
    const badge = document.getElementById("errCountBadge");
    const nErr = unique.filter(e => e.severity !== "warn").length;
    if (nErr > 0) {
        badge.textContent = nErr;
        badge.classList.add("show");
    } else {
        badge.classList.remove("show");
    }
    updateLineNumbers(window.__lastErrorLines, window.__lastWarnLines);
    scheduleBracketUpdate();
    renderErrors();
}
function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatHTML() {
    let code = codeArea.value.replace(/>\s*</g, ">\n<").replace(/\n\s*\n/g, "\n");
    const lines = code.split("\n");
    let indent = 0; const output = [];
    lines.forEach(line => {
        const clean = line.trim();
        if (!clean) return;
        if (/^<\//.test(clean)) indent = Math.max(0, indent - 1);
        output.push("    ".repeat(indent) + clean);
        if (/^<[A-Za-z]/.test(clean) && !/^<\//.test(clean) && !/\/>$/.test(clean) &&
            !/^<(meta|link|img|input|br|hr|source|area|base|embed|param|track|wbr)\b/i.test(clean))
            indent++;
    });
    codeArea.value = output.join("\n");
    __lastLineCount = -1;
    __lineOffsetsDirty = true;
    updateLineNumbers();
    scheduleBracketUpdate();
    updateDeleteBarInfo();
}
function clearCode() {
    if (codeArea.value.trim() && !confirm("Yakin hapus semua kode?")) return;
    codeArea.value = "";
    document.getElementById("errors").innerHTML = "";
    document.getElementById("preview").srcdoc = "";
    document.getElementById("previewStatus").textContent = "kosong";
    document.getElementById("previewStatus").classList.remove("live", "dirty");
    lastRenderedCode = null;
    overlay.innerHTML = "";
    searchOverlay.innerHTML = "";
    lineSuggest.classList.remove("show");
    const status = document.getElementById("status");
    status.className = ""; status.innerHTML = "Belum diperiksa.";
    window.__lastErrorLines = []; window.__lastWarnLines = [];
    window.__allErrors = []; window.__lastSuggestLines = [];
    document.getElementById("errCountBadge").classList.remove("show");
    document.getElementById("navInfo").textContent = "";
    clearSearch();
    __lastLineCount = -1;
    __lineOffsetsDirty = true;
    updateLineNumbers();
    updateDeleteBarInfo();
}
history.pushState({ page: "editor" }, "", location.href);
window.addEventListener("popstate", () => {
    if (document.body.classList.contains("preview-mode")) {
        exitPreviewMode();
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === "code"));
        document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-code"));
        history.pushState({ page: "editor" }, "", location.href);
    }
});

/* =====================================================
   SLIDER UKURAN TEKS
===================================================== */
const fontSlider = document.getElementById("fontSlider");
const sizeValue  = document.getElementById("sizeValue");
const rootStyle  = document.documentElement;

function setCodeFontSize(px) {
    px = Math.max(8, Math.min(24, parseInt(px, 10) || 11));
    const lineHeight = Math.round(px * 1.65);
    rootStyle.style.setProperty("--code-font-size", px + "px");
    rootStyle.style.setProperty("--code-line-height", lineHeight + "px");
    fontSlider.value = px;
    sizeValue.textContent = px + "px";
    document.querySelectorAll(".size-preset").forEach(p => {
        p.classList.toggle("active", parseInt(p.dataset.size, 10) === px);
    });
    cachedCharW = 0;
    requestAnimationFrame(() => {
        __lastLineCount = -1;
        updateLineNumbers(window.__lastErrorLines, window.__lastWarnLines);
        scheduleBracketUpdate();
        if (window.__searchQuery) redrawSearchHighlights();
        lineSuggest.classList.remove("show");
    });
    try { localStorage.setItem("codeFontSize", px); } catch (e) {}
}
fontSlider.addEventListener("input", (e) => {
    setCodeFontSize(e.target.value);
});
document.querySelectorAll(".size-preset").forEach(preset => {
    preset.addEventListener("click", () => {
        setCodeFontSize(preset.dataset.size);
    });
});
(function restoreFontSize() {
    let saved = 11;
    try {
        const v = localStorage.getItem("codeFontSize");
        if (v) saved = parseInt(v, 10);
    } catch (e) {}
    setCodeFontSize(saved);
})();

updateLineNumbers();
updateDeleteBarInfo();
setTimeout(() => scheduleBracketUpdate(), 50);
</script>
