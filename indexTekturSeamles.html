<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      
    <title>tekstur Seamless</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }

        /* Canvas untuk merender gambar */
        canvas {
            max-width: 90vw;
            max-height: 70vh;
            border: 2px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: #222;
        }

        .controls {
            background: #222;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            border-top: 2px solid #333;
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            border: none;
        }

        .btn-upload { background: #007bff; color: white; }
        .btn-save { background: #28a745; color: white; display: none; }

        .settings {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
        }

        input[type="number"] {
            width: 50px;
            padding: 5px;
            border-radius: 4px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div class="controls">
        <label for="imageInput" class="btn btn-upload">📁 PILIH GAMBAR</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none">
        
        <button id="saveBtn" class="btn btn-save">💾 SIMPAN HASIL (.PNG)</button>

        <div class="settings">
            <div>
                Kolom: <input type="number" id="cols" value="2" min="1">
            </div>
            <div>
                Baris: <input type="number" id="rows" value="2" min="1">
            </div>
        </div>
        <p style="font-size: 11px; color: #888; margin-top: 10px;">
            Atur jumlah kolom/baris untuk menentukan seberapa luas pengulangan gambar.
        </p>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const saveBtn = document.getElementById('saveBtn');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const colInput = document.getElementById('cols');
        const rowInput = document.getElementById('rows');

        let activeImage = null;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    activeImage = new Image();
                    activeImage.onload = renderTexture;
                    activeImage.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function renderTexture() {
            if (!activeImage) return;

            const cols = parseInt(colInput.value) || 1;
            const rows = parseInt(rowInput.value) || 1;

            // Set ukuran canvas sesuai (Ukuran Gambar x Jumlah Pengulangan)
            canvas.width = activeImage.width * cols;
            canvas.height = activeImage.height * rows;

            // Loop untuk menggambar pola tile
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    ctx.drawImage(activeImage, j * activeImage.width, i * activeImage.height);
                }
            }

            saveBtn.style.display = 'inline-block';
        }

        // Update otomatis saat angka kolom/baris diubah
        [colInput, rowInput].forEach(input => {
            input.addEventListener('input', renderTexture);
        });

        // Fungsi Simpan Gambar
        saveBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'seamless-texture-result.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
